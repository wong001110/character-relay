name: Agent expression runtime patch

on:
  push:
    branches:
      - agent/expand-expression-decisions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-expression-decisions
          fetch-depth: 0
      - name: Apply expression patches
        run: |
          python .tmp/patch_expression_runtime.py
          python .tmp/patch_expression_bot_and_budget.py
          python .tmp/patch_expression_interaction.py
      - name: Commit expression runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .tmp .github/workflows/agent-expression-patch.yml
          git add src/echo_masque/connector_runtime.py connectors/discord/src/index.ts
          git commit -m "feat: expand Discord expression decisions"
          git push origin HEAD:agent/expand-expression-decisions
