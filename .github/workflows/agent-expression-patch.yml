name: Agent expression runtime patch

on:
  push:
    branches:
      - agent/expand-expression-decisions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-expression-decisions
          fetch-depth: 0
      - name: Patch expression runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path} but found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          runtime = Path("src/echo_masque/connector_runtime.py")
          replace_once(
              runtime,
              '''                "Expression controls are invisible runtime behavior. First write the most "
                "natural in-character visible reply. Then decide whether a real Discord user "
                "would naturally add one expression. Using an expression is optional; use at "
                "most one.",''',
              '''                "Expression controls are invisible runtime behavior. First write the most "
                "natural in-character visible reply. Then make exactly one expression decision. "
                "Using an expression is optional, but the decision is mandatory whenever "
                "candidates are listed; use at most one expression in this reply.",''',
          )
          replace_once(
              runtime,
              '''                "Unicode Emoji may remain naturally in your visible reply text. Never invent a "
                "custom Emoji or Sticker ID. Choose only a listed resource_key and an action "
                "allowed for that candidate.",
                "Append exactly one final machine-control line after the visible reply. Balanced "''',
              '''                "Unicode Emoji may remain naturally in your visible reply text. Never invent a "
                "custom Emoji or Sticker ID. Choose only a listed resource_key and an action "
                "allowed for that candidate.",
                "If no retrieved expression naturally fits the character, tone, or moment, choose "
                "action none. A confident none decision is better than forcing an out-of-character "
                "expression. When candidates are provided, never omit the CR_EXPRESSION decision.",
                "You MUST append exactly one final machine-control line after the visible reply. "
                "Balanced "''',
          )

          index = Path("connectors/discord/src/index.ts")
          replace_once(
              index,
              '''async function validateExpressionResource(
  source: Message<true>,
  candidate: DiscordExpressionCandidate
): Promise<boolean> {''',
              '''async function resolveExpressionSourceMessage(
  fallback: Message<true>,
  messageId: string
): Promise<Message<true>> {
  if (!messageId || messageId === fallback.id) return fallback;
  try {
    const fetched = await fallback.channel.messages.fetch(messageId);
    return fetched.inGuild() ? fetched : fallback;
  } catch (error) {
    log("Unable to fetch the character message used as an Expression source.", {
      messageId,
      fallbackMessageId: fallback.id,
      error: error instanceof Error ? error.message : String(error)
    });
    return fallback;
  }
}

async function validateExpressionResource(
  source: Message<true>,
  candidate: DiscordExpressionCandidate
): Promise<boolean> {''',
          )

