name: Apply connector observability patch

on:
  push:
    branches:
      - agent/connector-portal-logs-singapore
    paths:
      - .github/apply_connector_observability.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connector-portal-logs-singapore
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply source patch
        run: python .github/apply_connector_observability.py

      - name: Validate backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check src tests/test_deployment_logs.py
          pytest tests/test_deployment_logs.py tests/test_deployments.py tests/test_discord_connector.py

      - name: Validate portal
        run: |
          cd web
          npm install
          npm run typecheck
          npm run build

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add connector logs and Singapore deployment' || exit 0
          git push origin HEAD:agent/connector-portal-logs-singapore
