name: Apply Discord event telemetry repair

on:
  push:
    branches: [agent/fix-discord-event-telemetry]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-discord-event-telemetry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"

      - name: Apply source patch
        run: python .github/scripts/apply_discord_event_telemetry_fix.py

      - name: Validate Railway region config
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("connectors/discord/railway.toml").read_text())
          regions = config["deploy"]["multiRegionConfig"]
          assert regions["us-west1"]["numReplicas"] == 0
          assert regions["asia-southeast1-eqsg3a"]["numReplicas"] == 1
          assert sum(item["numReplicas"] for item in regions.values()) == 1
          PY

      - name: Validate backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check \
            src/echo_masque/api/connector_schemas.py \
            src/echo_masque/api/routes/connectors.py \
            src/echo_masque/persistence/deployment_repository.py \
            tests/test_discord_connector.py
          python -m mypy src/echo_masque
          python -m pytest \
            tests/test_deployments.py \
            tests/test_discord_connector.py \
            tests/test_discord_event_logs.py -q

      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          docker build -t character-relay-discord-event-telemetry-test .

      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Remove generated and temporary files
        run: |
          rm -f connectors/discord/package-lock.json
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -f .github/scripts/apply_discord_event_telemetry_fix.py
          rm -f .github/workflows/apply-discord-event-telemetry-fix.yml

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: expose Discord event reporter telemetry"
          git push origin HEAD:agent/fix-discord-event-telemetry
