name: Apply Discord logging runtime fix

on:
  push:
    branches: [agent/fix-discord-logging-runtime]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-discord-logging-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Patch anchor not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "connectors/discord/railway.toml",
              'multiRegionConfig = { "us-west1" = { numReplicas = 0 }, "asia-southeast1-eqsg3a" = { numReplicas = 1 } }',
              'multiRegionConfig = { "asia-southeast1-eqsg3a" = { numReplicas = 1 } }',
          )

          replace(
              "connectors/discord/src/index.ts",
              'const eventReporter = new DiscordEventReporter((events) => relay.reportEvents(events));\neventReporter.start();',
              '''const eventReporter = new DiscordEventReporter(async (events) => {
            const eventTypes = [...new Set(events.map((item) => item.event_type))];
            const guildIds = [...new Set(events.map((item) => item.guild_id).filter(Boolean))];
            log("Uploading Discord event batch to Portal.", {
              level: "info",
              connectionId: config.relayConnectionId,
              eventCount: events.length,
              eventTypes,
              guildIds,
              firstOccurredAt: events[0]?.occurred_at ?? null,
              lastOccurredAt: events.at(-1)?.occurred_at ?? null
            });
            try {
              await relay.reportEvents(events);
              log("Discord event batch uploaded to Portal.", {
                level: "info",
                connectionId: config.relayConnectionId,
                eventCount: events.length,
                eventTypes,
                guildIds
              });
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              log("Discord event batch upload failed.", {
                level: "error",
                connectionId: config.relayConnectionId,
                eventCount: events.length,
                eventTypes,
                guildIds,
                error: message
              });
              throw error;
            }
          });
          eventReporter.start();
          log("Discord event reporter started.", {
            level: "info",
            connectionId: config.relayConnectionId,
            portalEventsEndpoint: `${config.relayApiUrl}/api/connectors/discord/events`,
            railwayReplicaRegion: process.env.RAILWAY_REPLICA_REGION ?? null,
            railwayReplicaId: process.env.RAILWAY_REPLICA_ID ?? null,
            railwayCommitSha: process.env.RAILWAY_GIT_COMMIT_SHA ?? null
          });''',
          )

          replace(
              "connectors/discord/src/index.ts",
              '''    details: input.details ?? {}
            });
          }''',
              '''    details: input.details ?? {}
            });
            log("Discord event queued for Portal.", {
              level: input.level,
              eventType: input.eventType,
              connectionId: config.relayConnectionId,
              guildId: input.guildId ?? null,
              channelId: input.channelId ?? null,
              threadId: input.threadId || null,
              sourceMessageId: input.sourceMessageId ?? null,
              deploymentId: input.deploymentId || null,
              pendingPortalLogs: eventReporter.pendingCount
            });
          }''',
          )

          replace(
              "connectors/discord/src/index.ts",
              '''  reportDiscordEvent({
            level: "info",
            eventType: "message_received",''',
              '''  log("Discord Gateway message received.", {
            level: "info",
            connectionId: config.relayConnectionId,
            guildId: guildMessage.guildId,
            guildName: guildMessage.guild.name,
            channelId: location.channelId,
            channelName: location.channelName,
            threadId: location.threadId || null,
            sourceMessageId: guildMessage.id,
            authorId: guildMessage.author.id,
            mentionedBot,
            candidateCount: candidates.length,
            hasReadableText: Boolean(originalText),
            stickerCount: guildMessage.stickers.size,
            railwayReplicaRegion: process.env.RAILWAY_REPLICA_REGION ?? null,
            railwayReplicaId: process.env.RAILWAY_REPLICA_ID ?? null
          });
          reportDiscordEvent({
            level: "info",
            eventType: "message_received",''',
          )

          replace(
              "src/echo_masque/api/routes/connectors.py",
              "import hmac\n",
              "import hmac\nimport logging\n",
          )
          replace(
              "src/echo_masque/api/routes/connectors.py",
              'router = APIRouter(prefix="/api/connectors/discord", tags=["connectors"])\n_WEBHOOK_SCOPE = "discord_webhook"',
              'logger = logging.getLogger(__name__)\n\nrouter = APIRouter(prefix="/api/connectors/discord", tags=["connectors"])\n_WEBHOOK_SCOPE = "discord_webhook"',
          )
          replace(
              "src/echo_masque/api/routes/connectors.py",
              '''    try:
                  deployment_repository(request).record_discord_events(
                      connection_id=payload.connection_id,
                      events=[item.model_dump() for item in payload.events],
                  )
              except KeyError as exc:
                  raise HTTPException(status_code=404, detail="Discord connection not found.") from exc
              except ValueError as exc:
                  raise HTTPException(status_code=422, detail=str(exc)) from exc''',
              '''    event_types = sorted({item.event_type for item in payload.events})
              guild_ids = sorted({item.guild_id for item in payload.events if item.guild_id})
              try:
                  inserted = deployment_repository(request).record_discord_events(
                      connection_id=payload.connection_id,
                      events=[item.model_dump() for item in payload.events],
                  )
              except KeyError as exc:
                  logger.warning(
                      "Discord event batch rejected: connection=%s events=%s types=%s guilds=%s reason=connection_not_found",
                      payload.connection_id,
                      len(payload.events),
                      event_types,
                      guild_ids,
                  )
                  raise HTTPException(status_code=404, detail="Discord connection not found.") from exc
              except ValueError as exc:
                  logger.warning(
                      "Discord event batch rejected: connection=%s events=%s types=%s guilds=%s reason=%s",
                      payload.connection_id,
                      len(payload.events),
                      event_types,
                      guild_ids,
                      str(exc),
                  )
                  raise HTTPException(status_code=422, detail=str(exc)) from exc
              logger.info(
                  "Discord event batch persisted: connection=%s received=%s inserted=%s types=%s guilds=%s",
                  payload.connection_id,
                  len(payload.events),
                  inserted,
                  event_types,
                  guild_ids,
              )''',
          )

          replace(
              "web/src/discordServerStatus.ts",
              '''function timestamp(value: string | null | undefined): number | null {
            if (!value) return null;
            const parsed = Date.parse(value);
            return Number.isFinite(parsed) ? parsed : null;
          }''',
              '''function timestamp(value: string | null | undefined): number | null {
            if (!value) return null;
            const normalized = /(?:Z|[+-]\\d{2}:\\d{2})$/u.test(value) ? value : `${value}Z`;
            const parsed = Date.parse(normalized);
            return Number.isFinite(parsed) ? parsed : null;
          }''',
          )

          replace(
              "web/src/DiscordEventLogPanel.tsx",
              '''function formatTime(value: string | null | undefined): string {
            if (!value) return "—";
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) return "—";''',
              '''function formatTime(value: string | null | undefined): string {
            if (!value) return "—";
            const normalized = /(?:Z|[+-]\\d{2}:\\d{2})$/u.test(value) ? value : `${value}Z`;
            const parsed = new Date(normalized);
            if (Number.isNaN(parsed.getTime())) return "—";''',
          )

          replace(
              "web/src/discordServerStatus.test.ts",
              '''  it("reports stale heartbeat data", () => {
            const [result] = buildDiscordServerStatuses(''',
              '''  it("treats timezone-less API timestamps as UTC", () => {
            const [result] = buildDiscordServerStatuses(
              [profile],
              [connection("connected", "2026-08-05T12:59:30")],
              [{ ...catalog, synced_at: "2026-08-05T12:59:20" }],
              NOW
            );
            expect(result?.state).toBe("connected");
          });

          it("reports stale heartbeat data", () => {
            const [result] = buildDiscordServerStatuses(''',
          )
          PY

      - name: Validate Railway config
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("connectors/discord/railway.toml").read_text())
          regions = config["deploy"]["multiRegionConfig"]
          assert regions == {"asia-southeast1-eqsg3a": {"numReplicas": 1}}, regions
          PY

      - name: Validate backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check src/echo_masque/api/routes/connectors.py
          python -m mypy src
          python -m pytest tests/test_deployments.py tests/test_discord_connector.py tests/test_discord_event_logs.py

      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          docker build -t character-relay-discord:logging-fix .

      - name: Validate Portal
        working-directory: web
        env:
          TZ: Asia/Kuala_Lumpur
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Remove temporary workflow and generated files
        run: |
          rm -f .github/workflows/apply-discord-logging-runtime-fix.yml
          rm -rf connectors/discord/dist web/dist
          git checkout -- connectors/discord/package-lock.json web/package-lock.json 2>/dev/null || true

      - name: Commit validated source
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "fix: restore Discord logs with visible diagnostics"
          git push origin HEAD:agent/fix-discord-logging-runtime
