name: Apply Discord Portal logs

on:
  push:
    branches:
      - agent/portal-discord-server-logs
    paths:
      - .github/apply_discord_portal_logs.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portal-discord-server-logs
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply source patch
        run: python .github/apply_discord_portal_logs.py

      - name: Validate backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix src/echo_masque/persistence/__init__.py
          ruff check src tests/test_discord_event_logs.py
          pytest tests/test_discord_event_logs.py tests/test_discord_connector.py tests/test_deployments.py

      - name: Validate Discord Connector
        run: |
          cd connectors/discord
          npm install --no-package-lock
          npm run typecheck
          npm test
          npm run build
          docker build -t character-relay-discord-event-logs .

      - name: Validate Portal
        run: |
          cd web
          npm install --no-package-lock
          npm run typecheck
          npm test
          npm run build

      - name: Remove generated files
        run: |
          rm -f connectors/discord/package-lock.json
          rm -f web/package-lock.json
          rm -f web/tsconfig.tsbuildinfo

      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add server-filtered Discord Portal logs' || exit 0
          git push origin HEAD:agent/portal-discord-server-logs
