name: Apply Discord startup recovery

on:
  push:
    branches:
      - agent/discord-startup-recovery-singapore
    paths:
      - .github/apply_discord_startup_recovery.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discord-startup-recovery-singapore
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply source patch
        run: python .github/apply_discord_startup_recovery.py

      - name: Validate Discord Connector
        run: |
          cd connectors/discord
          npm install
          npm run typecheck
          npm test
          npm run build
          docker build -t character-relay-discord-recovery .

      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover Discord Connector after startup sync failure' || exit 0
          git push origin HEAD:agent/discord-startup-recovery-singapore
