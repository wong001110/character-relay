name: Apply Expression JSON and AI assistance

on:
  push:
    branches: [agent/expression-json-ai-assist-final]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expression-json-ai-assist-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply integrations
        run: python scripts/apply_expression_json_ai.py

      - name: Validate Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check src tests --fix
          python -m ruff check src tests
          python -m mypy src
          python -m pytest

      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Remove temporary and generated files
        run: |
          rm -f .github/workflows/apply-expression-json-ai.yml
          rm -f scripts/apply_expression_json_ai.py
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -rf web/dist

      - name: Commit validated feature
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "feat: add Expression JSON import and AI drafting"
          git push origin HEAD:agent/expression-json-ai-assist-final
