name: Apply Expression Retrieval MVP

on:
  push:
    branches: [agent/expression-retrieval-mvp]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expression-retrieval-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"

      - name: Apply Expression integrations
        run: |
          python scripts/apply_expression_backend.py
          python scripts/repair_expression_connector_patch.py
          python scripts/apply_expression_connector.py
          python scripts/repair_expression_typescript.py
          python scripts/apply_expression_webhook_asset.py
          python scripts/apply_expression_web.py
          python scripts/repair_expression_python.py

      - name: Validate Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check src tests
          python -m mypy src
          python -m pytest

      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          docker build -t character-relay-discord-expression-test .

      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Remove temporary and generated files
        run: |
          rm -f .github/workflows/apply-expression-retrieval-mvp.yml
          rm -f scripts/apply_expression_backend.py
          rm -f scripts/apply_expression_connector.py
          rm -f scripts/apply_expression_web.py
          rm -f scripts/repair_expression_connector_patch.py
          rm -f scripts/repair_expression_python.py
          rm -f scripts/repair_expression_typescript.py
          rm -f scripts/apply_expression_webhook_asset.py
          rm -rf web/dist connectors/discord/dist
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -f connectors/discord/package-lock.json connectors/discord/tsconfig.tsbuildinfo

      - name: Commit validated MVP
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "feat: add Server expression retrieval workflows"
          git push origin HEAD:agent/expression-retrieval-mvp
