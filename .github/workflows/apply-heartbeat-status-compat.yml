name: Apply heartbeat status compatibility

on:
  push:
    branches: [agent/fix-heartbeat-status-compat]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-heartbeat-status-compat
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply compatibility patch
        run: python .github/scripts/apply_heartbeat_status_compat.py

      - name: Validate compatibility
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check src/echo_masque/persistence/deployment_repository.py tests/test_deployments.py tests/test_discord_connector.py
          python -m mypy src/echo_masque
          python -m pytest tests/test_deployments.py tests/test_discord_connector.py tests/test_discord_event_logs.py -q

      - name: Remove temporary files
        run: |
          rm -f .github/scripts/apply_heartbeat_status_compat.py
          rm -f .github/workflows/apply-heartbeat-status-compat.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep heartbeat repository calls compatible"
          git push origin HEAD:agent/fix-heartbeat-status-compat
