name: Apply notebook UI refresh

on:
  push:
    branches: [agent/notebook-ui-refresh]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notebook-ui-refresh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply remaining UI integration
        run: python scripts/apply_notebook_ui_patch.py
      - name: Validate Portal
        working-directory: web
        env:
          TZ: Asia/Kuala_Lumpur
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary and generated files
        run: |
          rm -f .github/workflows/apply-notebook-ui-refresh.yml
          rm -f scripts/apply_notebook_ui_patch.py
          rm -rf web/dist
          git checkout -- web/package-lock.json 2>/dev/null || true
      - name: Commit validated refresh
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "feat: refresh portal with cute notebook UI"
          git push origin HEAD:agent/notebook-ui-refresh
