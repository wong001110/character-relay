name: Apply Phase C Transform

on:
  push:
    branches:
      - feat/media-dependency-planning

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-dependency-planning
      - name: Apply transform when present
        shell: bash
        run: |
          if [ ! -f .phase-c-transform.py ]; then
            echo "No Phase C transform present; nothing to apply."
            exit 0
          fi
          python .phase-c-transform.py
          rm .phase-c-transform.py
          rm -f .phase-c.patch
          rm .github/workflows/apply-phase-c-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce media dependency before roleplay"
          git push origin HEAD:feat/media-dependency-planning
