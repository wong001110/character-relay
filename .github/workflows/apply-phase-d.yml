name: Apply Phase D

on:
  push:
    branches:
      - feat/conversation-planner-shadow-rollout
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/conversation-planner-shadow-rollout
          fetch-depth: 0
      - name: Apply staged patches
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/phase-d-python.patch
          git apply --check .github/phase-d-ts.patch
          git apply .github/phase-d-python.patch
          git apply .github/phase-d-ts.patch
          rm -f \
            .github/phase-d-python.patch \
            .github/phase-d-ts.patch \
            .github/workflows/apply-phase-d.yml
      - name: Commit Phase D
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add structured conversation planner rollout'
          git push origin HEAD:feat/conversation-planner-shadow-rollout
