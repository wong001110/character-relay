name: Apply Phase E

on:
  push:
    branches:
      - feat/topic-episode-projection
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/topic-episode-projection
          fetch-depth: 0
      - name: Apply staged Episode and Topic patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase-e.patch.0* > /tmp/phase-e.patch
          git apply --check /tmp/phase-e.patch
          git apply /tmp/phase-e.patch
          rm -f .github/phase-e.patch.0* .github/workflows/apply-phase-e.yml
      - name: Validate focused Phase E tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/echo_masque/conversation_episode.py \
            src/echo_masque/conversation_topic.py \
            src/echo_masque/persistence/conversation_episode_models.py \
            src/echo_masque/persistence/conversation_episode_repository.py \
            src/echo_masque/utility_topic_runtime.py
      - name: Commit Phase E
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add historical topic resume and episode projection'
          git push origin HEAD:feat/topic-episode-projection
