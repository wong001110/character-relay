name: Apply Phase F

on:
  push:
    branches:
      - feat/memory-vnext-internal-tools
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-vnext-internal-tools
          fetch-depth: 0
      - name: Apply staged Memory vNext and Internal Tool patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase-f.patch.0* > /tmp/phase-f.patch
          git apply --check /tmp/phase-f.patch
          git apply /tmp/phase-f.patch
          rm -f .github/phase-f.patch.0* .github/workflows/apply-phase-f.yml
      - name: Validate Phase F syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/echo_masque/internal_context.py \
            src/echo_masque/media_connector_runtime.py \
            src/echo_masque/media_tools.py \
            src/echo_masque/persistence/memory_vnext_models.py \
            src/echo_masque/persistence/memory_vnext_repository.py
      - name: Commit Phase F
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Memory vNext and internal context tools'
          git push origin HEAD:feat/memory-vnext-internal-tools
