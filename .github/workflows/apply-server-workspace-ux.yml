name: Apply Server workspace UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply UX refinements
        run: python scripts/apply_server_workspace_ux.py
      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary and generated files
        run: |
          rm -f .github/workflows/apply-server-workspace-ux.yml
          rm -f scripts/apply_server_workspace_ux.py
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -rf web/dist
      - name: Commit validated UX refinements
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "fix: refine shelf, drawers, and Server workspace UX"
          git push origin HEAD:main
