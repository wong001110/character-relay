name: Apply Smart Output V1 backend patch

on:
  push:
    branches:
      - agent/smart-output-v1
    paths:
      - patches/smart-output-v1-backend.patch
      - .github/workflows/apply-smart-output-v1-backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-output-v1
          fetch-depth: 0
      - name: Apply staged patch
        run: git apply --check patches/smart-output-v1-backend.patch && git apply patches/smart-output-v1-backend.patch
      - name: Remove staging files
        run: rm patches/smart-output-v1-backend.patch .github/workflows/apply-smart-output-v1-backend.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Smart Output V1 runtime"
          git push origin HEAD:agent/smart-output-v1
