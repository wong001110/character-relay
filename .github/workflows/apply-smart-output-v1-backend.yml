name: Apply Smart Output V1 backend migration

on:
  push:
    branches:
      - agent/smart-output-v1
    paths:
      - scripts/apply_smart_output_v1_backend.py
      - .github/workflows/apply-smart-output-v1-backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-output-v1
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/apply_smart_output_v1_backend.py
      - name: Remove staging files
        run: |
          rm -f patches/smart-output-v1-backend.patch
          rm scripts/apply_smart_output_v1_backend.py
          rm .github/workflows/apply-smart-output-v1-backend.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Smart Output V1 runtime"
          git push origin HEAD:agent/smart-output-v1
