name: Apply final Smart Output V1 fixes

on:
  push:
    branches:
      - agent/smart-output-v1
    paths:
      - scripts/apply_smart_output_v1_final.py
      - .github/workflows/apply-smart-output-v1-final.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-output-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply final fixes
        run: python scripts/apply_smart_output_v1_final.py
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate Python
        run: |
          python -m ruff check --fix \
            src/echo_masque/connector_runtime.py \
            src/echo_masque/smart_output.py \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_discord_bot_tag_runtime.py \
            tests/test_character_prompt_inspector.py \
            tests/test_character_prompt_expression_invariants.py
          python -m ruff format \
            src/echo_masque/connector_runtime.py \
            src/echo_masque/smart_output.py \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_discord_bot_tag_runtime.py \
            tests/test_character_prompt_inspector.py \
            tests/test_character_prompt_expression_invariants.py
          python -m ruff check . \
            --exclude scripts/apply_smart_output_v1_final.py \
            --exclude scripts/finalize_smart_output_v1.py
          python -m mypy src
          python -m pytest \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_discord_bot_tag_runtime.py \
            tests/test_character_prompt_inspector.py \
            tests/test_character_prompt_expression_invariants.py
      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary files
        run: |
          rm -f scripts/apply_smart_output_v1_final.py
          rm -f scripts/finalize_smart_output_v1.py
          rm -f .github/workflows/apply-smart-output-v1-final.yml
          rm -f .github/workflows/finalize-smart-output-v1.yml
          rm -f .github/workflows/format-smart-output-v1.yml
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize Smart Output V1 runtime"
          git pull --rebase origin agent/smart-output-v1
          git push origin HEAD:agent/smart-output-v1
