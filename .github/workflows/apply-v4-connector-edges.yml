name: Apply V4 Connector Edges

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Connector dependencies
        working-directory: connectors/discord
        run: npm install --no-package-lock

      - name: Apply backend edge patch
        run: python scripts/apply_v4_connector_edges_backend.py

      - name: Normalize Connector test patch helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_v4_connector_edges_ts.py")
          text = path.read_text(encoding="utf-8")
          old = '    "  attachmentCount: 0,\\n  embedCount: 0,\\n",\n    "  attachmentCount: 0,\\n  visibleImageAttachmentCount: 0,\\n  embedCount: 0,\\n",'
          new = '    "    attachmentCount: 0,\\n    embedCount: 0,\\n",\n    "    attachmentCount: 0,\\n    visibleImageAttachmentCount: 0,\\n    embedCount: 0,\\n",'
          if old not in text:
              raise SystemExit("turnIngress test helper pattern not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply Connector edge patch
        run: python scripts/apply_v4_connector_edges_ts.py

      - name: Normalize generated visible-image test fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("connectors/discord/src/turnIngress.test.ts")
          text = path.read_text(encoding="utf-8")
          marker = '\n\ndescribe("visible-image Turn Collection policy", () => {'
          fixture = '''

const basePolicy = {
  collectorEnabled: true,
  smartParticipationEnabled: true,
  recovery: false,
  mentionedBot: false,
  hasReplyReference: false,
  explicitAudience: false,
  hasReadableText: true,
  customEmojiCount: 0,
  stickerCount: 0,
  attachmentCount: 0,
  visibleImageAttachmentCount: 0,
  embedCount: 0,
  hasUrl: false,
  smartCandidateCount: 2
};

describe("visible-image Turn Collection policy", () => {'''
          if marker not in text:
              raise SystemExit("generated visible-image test marker not found")
          path.write_text(text.replace(marker, fixture, 1), encoding="utf-8")
          PY

      - name: Format Python changes
        run: |
          python -m ruff format \
            src/echo_masque/api/connector_schemas.py \
            src/echo_masque/media_connector_runtime.py \
            tests/test_media_connector_runtime.py
          python -m ruff check --fix \
            src/echo_masque/api/connector_schemas.py \
            src/echo_masque/media_connector_runtime.py \
            tests/test_media_connector_runtime.py

      - name: Validate Python edge cases
        run: |
          python -m ruff check src/echo_masque tests/test_media_connector_runtime.py
          python -m mypy src
          python -m pytest \
            tests/test_media_connector_runtime.py \
            tests/test_connector_attachment_schema.py \
            tests/test_smart_participation_v4_resolver.py

      - name: Validate Discord Connector edge cases
        working-directory: connectors/discord
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Validate patch cleanliness
        run: git diff --check

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply_v4_connector_edges_backend.py
          rm scripts/apply_v4_connector_edges_ts.py
          rm .github/workflows/apply-v4-connector-edges.yml

      - name: Commit validated V4 edge cases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated V4 edge changes produced."
            exit 1
          fi
          git commit -m "feat: complete durable follow-up and visible-image burst handling"
          git push origin HEAD:agent/conversation-intelligence-v4
