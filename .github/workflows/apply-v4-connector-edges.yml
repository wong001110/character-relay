name: Apply V4 Connector Edges

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Connector dependencies
        working-directory: connectors/discord
        run: npm install --no-package-lock

      - name: Apply backend edge patch
        run: python scripts/apply_v4_connector_edges_backend.py

      - name: Apply Connector edge patch
        run: python scripts/apply_v4_connector_edges_ts.py

      - name: Format Python changes
        run: |
          python -m ruff format \
            src/echo_masque/api/connector_schemas.py \
            src/echo_masque/media_connector_runtime.py \
            tests/test_media_connector_runtime.py
          python -m ruff check --fix \
            src/echo_masque/api/connector_schemas.py \
            src/echo_masque/media_connector_runtime.py \
            tests/test_media_connector_runtime.py

      - name: Validate Python edge cases
        run: |
          python -m ruff check src/echo_masque tests/test_media_connector_runtime.py
          python -m mypy src
          python -m pytest \
            tests/test_media_connector_runtime.py \
            tests/test_connector_attachment_schema.py \
            tests/test_smart_participation_v4_resolver.py

      - name: Validate Discord Connector edge cases
        working-directory: connectors/discord
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Validate patch cleanliness
        run: git diff --check

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply_v4_connector_edges_backend.py
          rm scripts/apply_v4_connector_edges_ts.py
          rm .github/workflows/apply-v4-connector-edges.yml

      - name: Commit validated V4 edge cases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated V4 edge changes produced."
            exit 1
          fi
          git commit -m "feat: complete durable follow-up and visible-image burst handling"
          git push origin HEAD:agent/conversation-intelligence-v4
