name: Apply V4 Context Telemetry

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Context telemetry patch
        run: python scripts/apply_v4_context_telemetry_patch.py

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply_v4_context_telemetry_patch.py
          rm .github/workflows/apply-v4-context-telemetry.yml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install --package-lock=false
          npm run typecheck
          npm test
          npm run build

      - name: Prevent validation artifacts
        run: rm -f connectors/discord/package-lock.json

      - name: Commit Context telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Context telemetry changes were produced."
            exit 1
          fi
          git commit -m "feat: add Character context Turn Intelligence telemetry"
          git push origin HEAD:agent/conversation-intelligence-v4
