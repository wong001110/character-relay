name: Apply V4 Final Server Features

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply server features
        run: python scripts/apply_v4_final_server_features.py
      - name: Format
        run: |
          python -m ruff format src/echo_masque/api/routes/smart_participation_v4.py src/echo_masque/api/smart_participation_outcome_schemas.py src/echo_masque/character_learned_state.py
          python -m ruff check --fix src/echo_masque/api/routes/smart_participation_v4.py src/echo_masque/api/smart_participation_outcome_schemas.py src/echo_masque/character_learned_state.py
      - name: Remove helper
        run: |
          rm scripts/apply_v4_final_server_features.py
          rm .github/workflows/apply-v4-final-server.yml
      - name: Validate
        run: |
          python -m ruff check src/echo_masque
          python -m mypy src
          python -m pytest tests/test_character_learned_state.py tests/test_smart_participation_v4_resolver.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete durable follow-up and learned evidence contracts"
          git push origin HEAD:agent/conversation-intelligence-v4
