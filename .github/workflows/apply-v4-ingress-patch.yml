name: Apply V4 Ingress Patch

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python scripts/apply_v4_ingress_patch.py

      - name: Adapt generated code to strict optional typing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          index = Path("connectors/discord/src/index.ts")
          text = index.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(?m)^\s*prepareCollection: collectionDecision\.collect\n\s*\? async \(\) => \{',
              '    ...(collectionDecision.collect\n      ? { prepareCollection: async () => {',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"prepareCollection prefix match count={count}")
          text, count = re.subn(
              r'(?m)^\s*\}\n\s*: undefined,\n\s*execute: async \(burst\) => \{',
              '        } }\n      : {}),\n    execute: async (burst) => {',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"prepareCollection suffix match count={count}")
          index.write_text(text, encoding="utf-8")

          test = Path("connectors/discord/src/relayClientBurst.test.ts")
          text = test.read_text(encoding="utf-8")
          replacements = [
              (
                  '    let resolverBody: Record<string, unknown> | null = null;',
                  '    const resolverBodies: Array<Record<string, unknown>> = [];',
              ),
              (
                  '          resolverBody = JSON.parse(String(init?.body ?? "{}")) as Record<string, unknown>;',
                  '          resolverBodies.push(\n            JSON.parse(String(init?.body ?? "{}")) as Record<string, unknown>\n          );',
              ),
              ('    expect(resolverBody).toMatchObject({', '    expect(resolverBodies[0]).toMatchObject({'),
              (
                  '    expect(resolverBody?.burst_messages).toEqual([',
                  '    expect(resolverBodies[0]?.burst_messages).toEqual([',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"burst test match count={text.count(old)} for {old!r}")
              text = text.replace(old, new, 1)
          test.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply_v4_ingress_patch.py
          rm .github/workflows/apply-v4-ingress-patch.yml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Commit V4 ingress wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No V4 ingress changes were produced."
            exit 1
          fi
          git commit -m "feat: wire V4 turn collector into Discord ingress"
          git push origin HEAD:agent/conversation-intelligence-v4
