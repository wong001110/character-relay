name: Apply V4 Knowledge Assessment

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Knowledge gate refactor
        run: python scripts/apply_v4_knowledge_assessment_patch.py

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply_v4_knowledge_assessment_patch.py
          rm .github/workflows/apply-v4-knowledge-assessment.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate Knowledge route assessment
        run: |
          python -m ruff check src/echo_masque/knowledge_route_gate.py tests/test_knowledge_route_gate.py tests/test_knowledge_route_assessment_v4.py
          python -m mypy src
          python -m pytest tests/test_knowledge_route_gate.py tests/test_knowledge_route_assessment_v4.py

      - name: Commit Knowledge assessment refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Knowledge assessment changes were produced."
            exit 1
          fi
          git commit -m "refactor: expose evidence-only Knowledge route assessment"
          git push origin HEAD:agent/conversation-intelligence-v4
