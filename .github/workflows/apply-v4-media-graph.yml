name: Apply V4 Media Graph

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Media Graph patch
        run: python scripts/apply_v4_media_graph_patch.py

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply_v4_media_graph_patch.py
          rm .github/workflows/apply-v4-media-graph.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate Media Graph integration
        run: |
          python -m ruff check src/echo_masque/conversation_media.py src/echo_masque/conversation_media_graph.py tests/test_conversation_media_recall.py
          python -m mypy src
          python -m pytest tests/test_conversation_media_recall.py tests/test_conversation_media_reference.py

      - name: Commit validated Media Graph integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Media Graph changes produced."
            exit 1
          fi
          git commit -m "feat: integrate Media perception with Conversation Graph"
          git push origin HEAD:agent/conversation-intelligence-v4
