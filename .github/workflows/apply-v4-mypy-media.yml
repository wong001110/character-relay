name: Apply V4 Mypy and Media

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply strict typing cleanup
        run: python scripts/apply_v4_mypy_cleanup_patch.py

      - name: Apply Media Graph integration
        run: python scripts/apply_v4_media_graph_patch.py

      - name: Remove duplicate Context trace value
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/echo_masque/context_layer.py")
          text = path.read_text(encoding="utf-8")
          target = "                eligible_base_count=result.eligible_base_count,\n"
          if text.count(target) != 1:
              raise SystemExit(f"eligible trace replacement count={text.count(target)}")
          path.write_text(text.replace(target, "", 1), encoding="utf-8")
          PY

      - name: Autoformat V4 checkpoint
        run: |
          python -m ruff format \
            src/echo_masque/context_layer.py \
            src/echo_masque/api/routes/smart_participation_v4.py \
            src/echo_masque/participation_context_rerank.py \
            src/echo_masque/participation_final_utility.py \
            src/echo_masque/persistence/smart_participation_state_models.py \
            src/echo_masque/smart_participation_outcome.py \
            src/echo_masque/smart_participation_durable_state.py \
            src/echo_masque/conversation_media.py \
            src/echo_masque/conversation_media_graph.py
          python -m ruff check --fix \
            src/echo_masque/context_layer.py \
            src/echo_masque/api/routes/smart_participation_v4.py \
            src/echo_masque/participation_context_rerank.py \
            src/echo_masque/participation_final_utility.py \
            src/echo_masque/persistence/smart_participation_state_models.py \
            src/echo_masque/smart_participation_outcome.py \
            src/echo_masque/smart_participation_durable_state.py \
            src/echo_masque/conversation_media.py \
            src/echo_masque/conversation_media_graph.py

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply_v4_mypy_cleanup_patch.py
          rm scripts/apply_v4_media_graph_patch.py
          rm .github/workflows/apply-v4-mypy-media.yml

      - name: Capture V4 diagnostics
        run: |
          mkdir -p /tmp/v4-diag
          set +e
          python -m ruff check src/echo_masque tests/test_character_context_routing.py tests/test_context_layer_turn_intelligence_v4.py > /tmp/v4-diag/ruff.txt 2>&1
          echo $? > /tmp/v4-diag/ruff.code
          python -m mypy src > /tmp/v4-diag/mypy.txt 2>&1
          echo $? > /tmp/v4-diag/mypy.code
          python -m pytest \
            tests/test_knowledge_route_gate.py \
            tests/test_knowledge_route_assessment_v4.py \
            tests/test_character_context_routing.py \
            tests/test_context_layer_turn_intelligence_v4.py \
            tests/test_tool_semantic_continuation.py \
            tests/test_character_learned_state.py \
            tests/test_conversation_media_recall.py \
            tests/test_conversation_media_reference.py \
            tests/test_smart_participation_v4_resolver.py > /tmp/v4-diag/pytest.txt 2>&1
          echo $? > /tmp/v4-diag/pytest.code
          set -e
          cat /tmp/v4-diag/ruff.txt
          cat /tmp/v4-diag/mypy.txt
          tail -n 120 /tmp/v4-diag/pytest.txt

      - name: Upload V4 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v4-checkpoint-diagnostics
          path: /tmp/v4-diag
          retention-days: 3

      - name: Enforce V4 validation
        run: |
          test "$(cat /tmp/v4-diag/ruff.code)" = "0"
          test "$(cat /tmp/v4-diag/mypy.code)" = "0"
          test "$(cat /tmp/v4-diag/pytest.code)" = "0"

      - name: Commit validated V4 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No V4 checkpoint changes produced."
            exit 1
          fi
          git commit -m "fix: stabilize V4 typing and Media Graph integration"
          git push origin HEAD:agent/conversation-intelligence-v4
