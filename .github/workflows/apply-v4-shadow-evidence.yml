name: Apply V4 Shadow Evidence Bridge

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Connector shadow bridge
        run: python scripts/apply_v4_shadow_evidence_patch.py

      - name: Remove one-time patch helpers
        run: |
          rm scripts/apply_v4_shadow_evidence_patch.py
          rm .github/workflows/apply-v4-shadow-evidence.yml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install --package-lock=false
          npm run typecheck
          npm test
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate Python shadow resolver
        run: |
          python -m ruff check src/echo_masque/participation_shadow_v4.py src/echo_masque/api/smart_participation_v4_schemas.py src/echo_masque/api/routes/smart_participation_v4.py tests/test_participation_shadow_v4.py tests/test_smart_participation_v4_resolver.py
          python -m mypy src
          python -m pytest tests/test_participation_shadow_v4.py tests/test_smart_participation_v4_resolver.py

      - name: Prevent validation artifacts
        run: rm -f connectors/discord/package-lock.json

      - name: Commit V4 shadow evidence bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No shadow evidence changes were produced."
            exit 1
          fi
          git commit -m "feat: add V4 deterministic speaker-plan shadow"
          git push origin HEAD:agent/conversation-intelligence-v4
