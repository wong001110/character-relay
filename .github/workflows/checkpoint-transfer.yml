name: Temporary source-only checkpoint transfer
on:
  push:
    branches: [chore/room-refactor-publish-20261002]
    paths: [.github/workflows/checkpoint-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22483baecfb84e6265a36dfbd8eb734eecb0632a
          fetch-depth: 1
      - name: Verify exact public-source-only checkpoint
        env:
          # Source.patch and commit.txt ONLY, intentionally destined for this public repo.
          # No private continuity state, captured transcripts or credentials.
          SOURCE_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-c76c-820b-b227-7f11e740a90c/raw?se=2026-10-02T08%3A09%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=f10219ae-da50-5532-acd5-27dfb82b831f&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T00%3A36%3A38Z&ske=2026-10-03T00%3A36%3A38Z&sks=b&skv=2026-02-06&sig=doG6CQnKzP0p6/tJcRN5n5tM2f3MMNfJy5sEcIF1VJg%3D'
        run: |
          echo "::add-mask::$SOURCE_URL"
          curl --fail --silent --show-error --max-time 60 "$SOURCE_URL" -o /tmp/source.zip
          echo '6980f3cf9c2bed8b751c6ea7877360158f38ea277703082a2771f064b85ad0c4  /tmp/source.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/source.zip') as z:
              assert sorted(z.namelist()) == ['commit.txt', 'source.patch']
              for name in z.namelist():
                  Path('/tmp/' + name).write_bytes(z.read(name))
          PY
          git apply --check --index /tmp/source.patch
          git apply --index /tmp/source.patch
          test "$(git write-tree)" = 1cc54bff18a2c347dbcaa3762aea667aaa678d7c
          sha=$(git hash-object -t commit -w --stdin < /tmp/commit.txt)
          test "$sha" = 7c076c9f5dafef67940c5a5d94083b18bc58998b
          test "$(git show -s --format=%P "$sha")" = 22483baecfb84e6265a36dfbd8eb734eecb0632a
          git push origin "$sha:refs/heads/chore/room-refactor-source-r5b"
          echo "Verified source commit: $sha"
