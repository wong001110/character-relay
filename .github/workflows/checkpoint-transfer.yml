name: Temporary source-only checkpoint transfer
on:
  push:
    branches: [chore/room-refactor-publish-20261002]
    paths: [.github/workflows/checkpoint-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c076c9f5dafef67940c5a5d94083b18bc58998b
          fetch-depth: 1
      - name: Verify exact public source only
        env:
          # Only source.patch and commit.txt, intentionally destined for this public repo.
          SOURCE_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-71f0-820b-b5e3-853e2256bd98/raw?se=2026-10-02T08%3A28%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=fc9c8273-bbf8-5004-914d-7036fd0d82eb&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T00%3A38%3A31Z&ske=2026-10-03T00%3A38%3A31Z&sks=b&skv=2026-02-06&sig=%2B1JTSuFgs2E/XUvzDS4ChCnMDMa4qMAVnr%2BxuJG5rrg%3D'
        run: |
          echo "::add-mask::$SOURCE_URL"
          curl --fail --silent --show-error --max-time 60 "$SOURCE_URL" -o /tmp/source.zip
          echo 'f2bd65b318f79816d437efa441d9731d22dcc2c54a97c53b07fdd540826aeaa5  /tmp/source.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/source.zip') as z:
              assert sorted(z.namelist()) == ['commit.txt', 'source.patch']
              for name in z.namelist():
                  Path('/tmp/' + name).write_bytes(z.read(name))
          PY
          git apply --check --index /tmp/source.patch
          git apply --index /tmp/source.patch
          test "$(git write-tree)" = 7bf77c46804bfe49b2130e74c243e8bf0a16c4ad
          sha=$(git hash-object -t commit -w --stdin < /tmp/commit.txt)
          test "$sha" = 6917d4a91fb8d38ef65c3ca343a0c5cd182b137e
          test "$(git show -s --format=%P "$sha")" = 7c076c9f5dafef67940c5a5d94083b18bc58998b
          git push origin "$sha:refs/heads/chore/room-refactor-source-r5c"
          echo "Verified source commit: $sha"
