name: Temporary source-only checkpoint transfer
on:
  push:
    branches: [chore/room-refactor-publish-20261002]
    paths: [.github/workflows/checkpoint-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d9943a3ec5b46b66fe992b2abe08a43dbc08a3a8
          fetch-depth: 1
      - name: Verify exact public-source-only checkpoint
        env:
          # Expiring transport for source.patch and commit.txt ONLY, both intentionally
          # destined for this public repository. No continuity state or credentials.
          SOURCE_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-dfc8-8230-9563-03f488b292f3/raw?se=2026-10-02T07%3A33%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=a88982b7-f923-5cae-ab6b-18ae20eee457&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T00%3A36%3A15Z&ske=2026-10-03T00%3A36%3A15Z&sks=b&skv=2026-02-06&sig=j1GcGNJ%2Bds7K3lHghUyvsvhxuX8XpeSdwPNwJLf8q/g%3D'
        run: |
          echo "::add-mask::$SOURCE_URL"
          curl --fail --silent --show-error --max-time 60 "$SOURCE_URL" -o /tmp/source.zip
          echo 'ea2d1b655ca974f1d689743ad0cb6e3742b8427c9c376bfc9bd33464437b2c11  /tmp/source.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/source.zip') as z:
              assert sorted(z.namelist()) == ['commit.txt', 'source.patch']
              for name in z.namelist():
                  Path('/tmp/' + name).write_bytes(z.read(name))
          PY
          git apply --check --index /tmp/source.patch
          git apply --index /tmp/source.patch
          test "$(git write-tree)" = f1ec093f1ce8fe9022a55a9e19e90db71067875f
          sha=$(git hash-object -t commit -w --stdin < /tmp/commit.txt)
          test "$sha" = 22483baecfb84e6265a36dfbd8eb734eecb0632a
          test "$(git show -s --format=%P "$sha")" = d9943a3ec5b46b66fe992b2abe08a43dbc08a3a8
          git push origin "$sha:refs/heads/chore/room-refactor-source-r5a"
          echo "Verified source commit: $sha"
