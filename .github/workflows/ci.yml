name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - name: Ruff
        run: python -m ruff check .
      - name: Capture Ruff diagnostics
        if: failure()
        run: python -m ruff check . --output-format=json > ruff-report.json || true
      - name: Upload Ruff diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff-report.json
      - name: Mypy
        run: python -m mypy src
      - name: Capture mypy diagnostics
        if: failure()
        run: python -m mypy src > mypy-report.txt 2>&1 || true
      - name: Upload mypy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy-report.txt
      - name: Pytest
        run: python -m pytest
      - name: Capture pytest diagnostics
        if: failure()
        run: python -m pytest > pytest-report.txt 2>&1 || true
      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-report.txt

  postgres-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_DB: echo_masque_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d echo_masque_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ECHO_MASQUE_ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "yes"
      ECHO_MASQUE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/echo_masque_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Fresh PostgreSQL foundation bootstrap
        run: python -m pytest tests/test_database_foundation.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:mock

  discord-connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectors/discord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: connectors/discord/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build Discord connector image
        run: docker build --tag character-relay-discord-connector:ci .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build production image
        run: docker build --tag echo-masque:ci .
      - name: Reject production container without persistent volume
        run: |
          set +e
          docker run --name echo-masque-ci-unsafe --env PORT=8001 echo-masque:ci \
            > unsafe-storage.log 2>&1
          status=$?
          set -e
          cat unsafe-storage.log
          if [ "$status" -eq 0 ]; then
            echo "Production container unexpectedly started without a /data mount."
            exit 1
          fi
          grep --fixed-strings "Unsafe production storage" unsafe-storage.log
          docker rm echo-masque-ci-unsafe
      - name: Start container with persistent volume
        run: |
          docker volume create echo-masque-ci-data
          docker run --detach \
            --name echo-masque-ci \
            --publish 8000:8000 \
            --env PORT=8000 \
            --volume echo-masque-ci-data:/data \
            echo-masque:ci
      - name: Wait for healthcheck
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health > health-before.json; then
              exit 0
            fi
            sleep 2
          done
          docker logs echo-masque-ci
          exit 1
      - name: Verify non-root runtime access
        run: |
          test "$(docker exec echo-masque-ci id -u)" != "0"
          docker exec echo-masque-ci test -w /data
          docker exec echo-masque-ci python -c "from playwright.sync_api import sync_playwright; playwright = sync_playwright().start(); browser = playwright.chromium.launch(headless=True); print(browser.version); browser.close(); playwright.stop()"
      - name: Verify storage identity survives container replacement
        run: |
          before=$(python -c 'import json; print(json.load(open("health-before.json"))["storage"]["storage_instance_id"])')
          docker rm --force echo-masque-ci
          docker run --detach \
            --name echo-masque-ci \
            --publish 8000:8000 \
            --env PORT=8000 \
            --volume echo-masque-ci-data:/data \
            echo-masque:ci
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health > health-after.json; then
              break
            fi
            sleep 2
          done
          after=$(python -c 'import json; print(json.load(open("health-after.json"))["storage"]["storage_instance_id"])')
          test "$before" = "$after"
      - name: Run container smoke test
        run: python scripts/railway_smoke.py http://127.0.0.1:8000 --require-storage
      - name: Verify Railway root-volume handoff
        run: |
          docker volume create echo-masque-ci-railway-data
          docker run --rm \
            --user 0 \
            --entrypoint sh \
            --volume echo-masque-ci-railway-data:/data \
            echo-masque:ci \
            -c 'chown root:root /data && chmod 0755 /data && touch /data/legacy.db && chmod 0644 /data/legacy.db'
          docker run --detach \
            --name echo-masque-ci-railway \
            --user 0 \
            --publish 8002:8002 \
            --env PORT=8002 \
            --env RAILWAY_RUN_UID=0 \
            --volume echo-masque-ci-railway-data:/data \
            echo-masque:ci
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8002/health > railway-health.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8002/health
          test "$(docker exec --user 0 echo-masque-ci-railway awk '/^Uid:/{print $2}' /proc/1/status)" = "10001"
          docker exec --user character-relay echo-masque-ci-railway test -w /data
          docker exec --user character-relay echo-masque-ci-railway test -w /data/legacy.db
      - name: Show container logs
        if: always()
        run: docker logs echo-masque-ci || true
      - name: Remove container and volume
        if: always()
        run: |
          docker rm --force echo-masque-ci || true
          docker rm --force echo-masque-ci-unsafe || true
          docker rm --force echo-masque-ci-railway || true
          docker volume rm echo-masque-ci-data || true
          docker volume rm echo-masque-ci-railway-data || true
