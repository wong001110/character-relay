name: Cleanup Interaction Session branches

on:
  push:
    branches: [main]
    paths:
      - .github/interaction-sticker-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary branches and cleanup files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/cleanup-interaction-sticker-branches.yml
          git rm -f .github/interaction-sticker-cleanup-trigger
          git commit -m 'chore: finish Interaction Session cleanup'
          git push origin HEAD:main
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/feature/interaction-sessions-sticker-understanding" || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/chore/interaction-sticker-cleanup" || true
