name: Cleanup merged feature branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch when present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/feature/discord-server-profiles" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/feature/discord-server-profiles"
          else
            echo "Feature branch is already absent."
          fi
