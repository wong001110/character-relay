name: Cleanup Server Workspace branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'wong001110/character-relay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove temporary branches and cleanup files
        run: |
          if [ ! -f .github/server-workspace-cleanup-trigger ]; then
            echo 'Cleanup trigger not present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git push origin --delete feature/server-scoped-deployment-workspace || true
          git push origin --delete chore/server-workspace-cleanup || true
          rm -f .github/server-workspace-cleanup-trigger
          rm -f .github/workflows/cleanup-server-workspace.yml
          git add -A
          git commit -m 'chore: finish Server Workspace cleanup'
          git push origin HEAD:main
