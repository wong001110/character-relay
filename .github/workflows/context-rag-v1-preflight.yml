name: Context Layer and RAG V1 preflight
# Rerun after branch lint fixes.

on:
  push:
    branches:
      - agent/context-rag-v1
    paths:
      - scripts/apply_context_rag_v1.py
      - .github/workflows/context-rag-v1-preflight.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-rag-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply runtime integration
        run: python scripts/apply_context_rag_v1.py
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate Python
        run: |
          python -m ruff check --fix \
            src/echo_masque/context_layer.py \
            src/echo_masque/knowledge_retrieval.py \
            src/echo_masque/persistence/knowledge_models.py \
            src/echo_masque/persistence/knowledge_repository.py \
            src/echo_masque/api/knowledge_schemas.py \
            src/echo_masque/api/routes/knowledge.py \
            src/echo_masque/api/__init__.py \
            src/echo_masque/api/connector_schemas.py \
            src/echo_masque/connector_runtime.py \
            src/echo_masque/evaluation_lifecycle.py \
            tests/test_context_rag.py
          python -m ruff format \
            src/echo_masque/context_layer.py \
            src/echo_masque/knowledge_retrieval.py \
            src/echo_masque/persistence/knowledge_models.py \
            src/echo_masque/persistence/knowledge_repository.py \
            src/echo_masque/api/knowledge_schemas.py \
            src/echo_masque/api/routes/knowledge.py \
            src/echo_masque/api/__init__.py \
            src/echo_masque/api/connector_schemas.py \
            src/echo_masque/connector_runtime.py \
            src/echo_masque/evaluation_lifecycle.py \
            tests/test_context_rag.py
          python -m ruff check . --exclude scripts/apply_context_rag_v1.py
          python -m mypy src
          python -m pytest \
            tests/test_context_rag.py \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_discord_bot_tag_runtime.py \
            tests/test_character_prompt_inspector.py
      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Validate Web
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove generated and temporary files
        run: |
          if ! git ls-files --error-unmatch connectors/discord/package-lock.json >/dev/null 2>&1; then rm -f connectors/discord/package-lock.json; fi
          if ! git ls-files --error-unmatch web/package-lock.json >/dev/null 2>&1; then rm -f web/package-lock.json; fi
          rm -f scripts/apply_context_rag_v1.py
          rm -f .github/workflows/context-rag-v1-preflight.yml
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Context Layer and RAG V1"
          git push origin HEAD:agent/context-rag-v1
