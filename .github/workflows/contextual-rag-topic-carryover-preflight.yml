name: Contextual RAG topic carryover preflight

on:
  push:
    branches:
      - agent/contextual-rag-topic-carryover

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contextual-rag-topic-carryover
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply trace, docs, and lint-safe updates
        run: |
          python - <<'PY'
          from pathlib import Path

          context_path = Path('src/echo_masque/context_layer.py')
          context = context_path.read_text()
          long_line = '        fallback_hit_count = len(result.candidates) if retrieval_mode == "contextual_fallback" else 0'
          wrapped = "        fallback_hit_count = (\n            len(result.candidates) if retrieval_mode == \"contextual_fallback\" else 0\n        )"
          if long_line in context:
              context_path.write_text(context.replace(long_line, wrapped, 1))

          tests_path = Path('tests/test_context_rag.py')
          tests = tests_path.read_text()
          tests_path.write_text(tests.replace('？', '?'))

          types_path = Path('connectors/discord/src/types.ts')
          types = types_path.read_text()
          old = "export interface DiscordContextTrace {\n  rag_status: \"skipped\" | \"completed\" | \"failed\";\n  rag_reason: string;\n  query_chars: number;"
          new = "export interface DiscordContextTrace {\n  rag_status: \"skipped\" | \"completed\" | \"failed\";\n  rag_reason: string;\n  retrieval_mode: \"current\" | \"contextual_fallback\";\n  carryover_message_count: number;\n  initial_hit_count: number;\n  fallback_hit_count: number;\n  query_chars: number;"
          if old not in types:
              raise SystemExit('DiscordContextTrace anchor not found')
          types_path.write_text(types.replace(old, new, 1))

          index_path = Path('connectors/discord/src/index.ts')
          index = index_path.read_text()
          old = "    rag_reason: trace.rag_reason,\n    query_chars: trace.query_chars,"
          new = "    rag_reason: trace.rag_reason,\n    retrieval_mode: trace.retrieval_mode,\n    carryover_message_count: trace.carryover_message_count,\n    initial_hit_count: trace.initial_hit_count,\n    fallback_hit_count: trace.fallback_hit_count,\n    query_chars: trace.query_chars,"
          if old not in index:
              raise SystemExit('reportCharacterContext anchor not found')
          index_path.write_text(index.replace(old, new, 1))

          docs_path = Path('docs/context-rag-v1.md')
          docs = docs_path.read_text()
          marker = '## Contextual retrieval V1.1'
          if marker not in docs:
              addition = "\n\n## Contextual retrieval V1.1\n\nRAG first retrieves with the current user message only. If matching Knowledge Bases exist but the current query returns no candidate chunks, Character Relay performs one deterministic contextual fallback.\n\nThe fallback prepends at most the two most recent non-empty messages from the same human author, then retries the same scoped sparse retrieval. Bot/character messages are deliberately excluded so generated or hallucinated output cannot become retrieval evidence for the next turn. Other users' messages are also excluded to reduce topic borrowing in group chat.\n\nThis adds no LLM call and does not change Knowledge Base authorization or Server/Channel/Character isolation. A direct current-query hit never pulls conversation history into retrieval.\n\nPrivacy-safe context traces expose `retrieval_mode` (`current` or `contextual_fallback`), `carryover_message_count`, `initial_hit_count`, and `fallback_hit_count` without storing the retrieval query or knowledge text in Discord Event Logs.\n"
              docs_path.write_text(docs + addition)
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Python contextual retrieval
        run: |
          python -m ruff check src/echo_masque/context_layer.py tests/test_context_rag.py
          python -m mypy src/echo_masque/context_layer.py
          python -m pytest tests/test_context_rag.py

      - name: Validate Discord connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/contextual-rag-topic-carryover-preflight.yml

      - name: Commit validated connector and docs updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: expose contextual RAG fallback diagnostics"
          git push origin HEAD:agent/contextual-rag-topic-carryover
