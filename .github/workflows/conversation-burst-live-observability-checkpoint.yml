name: Conversation Burst Live Observability Checkpoint

on:
  push:
    branches: [agent/observability-runtime-control]

permissions:
  contents: write

jobs:
  guarded-burst-observability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observability-runtime-control
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Burst observability patch
        run: |
          python scripts/apply_burst_live_observability.py
          python scripts/normalize_burst_observability_css.py
      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate Python
        run: |
          python -m ruff format src/echo_masque/api/connector_schemas.py src/echo_masque/api/routes/connectors.py src/echo_masque/api/routes/conversation_burst_observability.py src/echo_masque/api/routes/__init__.py src/echo_masque/api/app.py src/echo_masque/persistence/deployment_repository.py tests/test_conversation_burst_observability.py
          python -m ruff check --fix src/echo_masque/api/connector_schemas.py src/echo_masque/api/routes/connectors.py src/echo_masque/api/routes/conversation_burst_observability.py src/echo_masque/api/routes/__init__.py src/echo_masque/api/app.py src/echo_masque/persistence/deployment_repository.py tests/test_conversation_burst_observability.py
          python -m ruff check src/echo_masque/api/connector_schemas.py src/echo_masque/api/routes/connectors.py src/echo_masque/api/routes/conversation_burst_observability.py src/echo_masque/api/routes/__init__.py src/echo_masque/api/app.py src/echo_masque/persistence/deployment_repository.py tests/test_conversation_burst_observability.py
          python -m mypy src
          python -m pytest tests/test_conversation_burst_observability.py tests/test_observability_runtime_control.py -q
      - name: Validate Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Validate Web
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Verify diff
        run: git diff --check
      - name: Commit validated Burst observability and remove staging files
        run: |
          rm scripts/apply_burst_live_observability.py
          rm scripts/normalize_burst_observability_css.py
          rm .github/workflows/conversation-burst-live-observability-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expose live Conversation Burst observability'
          git push origin HEAD:agent/observability-runtime-control
