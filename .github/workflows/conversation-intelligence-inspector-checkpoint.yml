name: Conversation Intelligence Inspector Checkpoint

on:
  push:
    branches: [agent/observability-runtime-control]

permissions:
  contents: write

jobs:
  guarded-inspector:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observability-runtime-control
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply inspector wiring
        run: python scripts/apply_conversation_intelligence_inspector.py
      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate Python
        run: |
          python -m ruff format src/echo_masque/api/routes/conversation_intelligence.py src/echo_masque/api/routes/__init__.py src/echo_masque/api/app.py tests/test_conversation_intelligence_inspector.py
          python -m ruff check --fix src/echo_masque/api/routes/conversation_intelligence.py src/echo_masque/api/routes/__init__.py src/echo_masque/api/app.py tests/test_conversation_intelligence_inspector.py
          python -m ruff check src/echo_masque/api/routes/conversation_intelligence.py src/echo_masque/api/routes/__init__.py src/echo_masque/api/app.py tests/test_conversation_intelligence_inspector.py
          python -m mypy src
          python -m pytest tests/test_conversation_intelligence_inspector.py tests/test_character_learned_state.py tests/test_conversation_topic_memory.py -q
      - name: Validate Web
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Verify diff
        run: git diff --check
      - name: Commit validated inspector and remove staging files
        run: |
          rm scripts/apply_conversation_intelligence_inspector.py
          rm .github/workflows/conversation-intelligence-inspector-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Conversation Intelligence Inspector'
          git push origin HEAD:agent/observability-runtime-control
