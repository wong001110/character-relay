name: Discord character tag fix generator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feature/fix-discord-character-tags'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fix-discord-character-tags
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic character Tag fixes
        run: |
          if [ ! -f scripts/apply_discord_character_tag_fixes.py ]; then
            echo 'No pending generator.'
            exit 0
          fi
          python scripts/apply_discord_character_tag_fixes.py
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/echo_masque/persistence/discord_identity_models.py \
            src/echo_masque/persistence/discord_identity_repository.py \
            src/echo_masque/api/discord_identity_schemas.py \
            src/echo_masque/api/routes/discord_identities.py \
            src/echo_masque/api/connector_schemas.py \
            src/echo_masque/api/routes/connectors.py \
            src/echo_masque/connector_runtime.py \
            tests/test_discord_connector.py \
            tests/test_discord_bot_tag_runtime.py
          python -m ruff check src tests
          python -m mypy src
          python -m pytest -q tests/test_discord_connector.py tests/test_discord_bot_tag_runtime.py
          cd connectors/discord
          npm install --no-package-lock
          npm run typecheck
          npm test
          npm run build
          cd ../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize Discord character Tags and aliases'
          git push origin HEAD:feature/fix-discord-character-tags
