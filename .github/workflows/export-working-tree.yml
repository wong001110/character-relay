name: Export Working Tree

on:
  push:
    branches:
      - feat/media-dependency-two-stage-resolution
      - feat/conversation-planner-shadow-rollout
      - feat/topic-episode-projection
      - feat/memory-vnext-internal-tools
      - feat/server-wiki-graph-consolidation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: working-tree
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
