name: Finalize Expression MVP

on:
  push:
    branches: [agent/expression-retrieval-mvp]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expression-retrieval-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
      - name: Apply final safeguards
        run: python scripts/finalize_expression_mvp.py
      - name: Validate Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check src tests
          python -m mypy src
          python -m pytest
      - name: Validate Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          docker build -t character-relay-discord-expression-final .
      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary and generated files
        run: |
          rm -f .github/workflows/finalize-expression-mvp.yml
          rm -f scripts/finalize_expression_mvp.py
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -f connectors/discord/package-lock.json connectors/discord/tsconfig.tsbuildinfo
          rm -rf web/dist connectors/discord/dist
      - name: Commit final safeguards
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Expression delivery and control parsing"
          git push origin HEAD:agent/expression-retrieval-mvp
