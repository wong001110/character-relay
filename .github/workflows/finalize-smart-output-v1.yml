name: Finalize Smart Output V1

on:
  push:
    branches:
      - agent/smart-output-v1
    paths:
      - scripts/finalize_smart_output_v1.py
      - .github/workflows/finalize-smart-output-v1.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-output-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply final compatibility update
        run: python scripts/finalize_smart_output_v1.py
      - name: Lint and format Smart Output Python
        run: |
          python -m ruff check --fix \
            src/echo_masque/connector_runtime.py \
            src/echo_masque/smart_output.py \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_discord_bot_tag_runtime.py \
            tests/test_character_prompt_inspector.py \
            tests/test_character_prompt_expression_invariants.py
          python -m ruff format \
            src/echo_masque/connector_runtime.py \
            src/echo_masque/smart_output.py \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_discord_bot_tag_runtime.py \
            tests/test_character_prompt_inspector.py \
            tests/test_character_prompt_expression_invariants.py
          python -m ruff check . --exclude scripts/finalize_smart_output_v1.py
      - name: Typecheck Python
        run: python -m mypy src
      - name: Run Smart Output regression tests
        run: |
          python -m pytest \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_discord_bot_tag_runtime.py \
            tests/test_character_prompt_inspector.py \
            tests/test_character_prompt_expression_invariants.py
      - name: Remove temporary preflight files
        run: |
          rm -f scripts/finalize_smart_output_v1.py
          rm -f .github/workflows/finalize-smart-output-v1.yml
          rm -f .github/workflows/format-smart-output-v1.yml
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: finalize Smart Output V1 compatibility"
          git push origin HEAD:agent/smart-output-v1
