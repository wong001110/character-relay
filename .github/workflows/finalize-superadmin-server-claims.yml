name: Finalize Super Admin Server claims

on:
  push:
    branches: [agent/superadmin-server-claims-character-ai]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/superadmin-server-claims-character-ai
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply final boundary and UX
        run: python scripts/finalize_superadmin_server_claims.py
      - name: Validate Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check src tests
          python -m mypy src
          python -m pytest
      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary and generated files
        run: |
          rm -f .github/workflows/finalize-superadmin-server-claims.yml
          rm -f scripts/finalize_superadmin_server_claims.py
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -f connectors/discord/package-lock.json connectors/discord/tsconfig.tsbuildinfo
          rm -rf web/dist connectors/discord/dist
      - name: Commit final boundary
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize Super Admin Discord inventory boundary"
          git push origin HEAD:agent/superadmin-server-claims-character-ai
