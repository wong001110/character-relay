name: Finalize V4 Documentation

on:
  push:
    branches:
      - agent/conversation-intelligence-v4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V4 documentation closeout
        run: python scripts/finalize_v4_docs.py

      - name: Validate documentation diff
        run: |
          grep -F "IMPLEMENTED / RELEASE VALIDATED IN DRAFT PR #166" docs/conversation-intelligence-v4-roadmap.md
          grep -F "Current milestone — Smart Participation V4" docs/product-roadmap-rag-and-smart-participation.md
          grep -F "CI #1314" docs/conversation-intelligence-v4-roadmap.md
          git diff --check

      - name: Remove one-time closeout helpers
        run: |
          rm scripts/finalize_v4_docs.py
          rm .github/workflows/finalize-v4-docs.yml

      - name: Commit documentation closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: mark Conversation Intelligence V4 implemented and validated"
          git push origin HEAD:agent/conversation-intelligence-v4
