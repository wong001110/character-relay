name: Knowledge Base paste preflight

on:
  push:
    branches:
      - agent/fix-knowledge-paste-textarea
    paths:
      - scripts/fix_knowledge_paste.py
      - .github/workflows/fix-knowledge-paste-preflight.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-knowledge-paste-textarea
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply Knowledge Base fix
        run: python scripts/fix_knowledge_paste.py
      - name: Guard event lifetime regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("web/src/KnowledgeBasePanel.tsx").read_text(encoding="utf-8")
          assert "event.currentTarget.reset()" not in source
          assert "name: event.currentTarget.value }))" not in source
          assert "channel_id: event.currentTarget.value\n                  }))" not in source
          assert "description: event.currentTarget.value\n                }))" not in source
          assert '<textarea\n              rows={5}\n              maxLength={4000}' in source
          PY
      - name: Validate Web
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove generated and temporary files
        run: |
          if ! git ls-files --error-unmatch web/package-lock.json >/dev/null 2>&1; then rm -f web/package-lock.json; fi
          rm -f web/tsconfig.tsbuildinfo
          rm -f scripts/fix_knowledge_paste.py
          rm -f .github/workflows/fix-knowledge-paste-preflight.yml
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Knowledge Base paste handling"
          git push origin HEAD:agent/fix-knowledge-paste-textarea
