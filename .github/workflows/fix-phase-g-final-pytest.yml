name: Fix Phase G Final Pytest

on:
  push:
    branches:
      - feat/server-wiki-graph-consolidation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-wiki-graph-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make Conversation Planner runtime fallback-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/echo_masque/api/routes/smart_participation_v4.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _conversation_planner(request: Request) -> ConversationAdmissionPlanner:\n    current = getattr(request.app.state, "conversation_admission_planner_v1", None)\n    if isinstance(current, ConversationAdmissionPlanner):\n        return current\n    runtime = cast(RuntimeService, request.app.state.runtime_service)\n    gateway = UtilityGatewayRouter(runtime, caller=ExistingProviderUtilityCaller())\n    service = ConversationAdmissionPlanner(gateway)\n    request.app.state.conversation_admission_planner_v1 = service\n    return service\n'''
          new = '''def _conversation_planner(request: Request) -> ConversationAdmissionPlanner:\n    current = getattr(request.app.state, "conversation_admission_planner_v1", None)\n    if isinstance(current, ConversationAdmissionPlanner):\n        return current\n    runtime = getattr(request.app.state, "runtime_service", None)\n    if not isinstance(runtime, RuntimeService):\n        settings = cast(Settings, request.app.state.settings)\n        database = _deployment_repository(request).database\n        runtime = RuntimeService(Repository(database), settings)\n    gateway = UtilityGatewayRouter(runtime, caller=ExistingProviderUtilityCaller())\n    service = ConversationAdmissionPlanner(gateway)\n    request.app.state.conversation_admission_planner_v1 = service\n    return service\n'''
          if text.count(old) != 1:
              raise SystemExit("conversation planner helper shape changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - run: python -m pip install -e ".[dev]"
      - name: Validate regression
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src/echo_masque/api/routes/smart_participation_v4.py
          python -m mypy src/echo_masque/api/routes/smart_participation_v4.py
          pytest -q tests/test_smart_participation_v4_resolver.py
      - name: Commit regression fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-phase-g-final-pytest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make conversation planner runtime fallback-safe'
          git push origin HEAD:feat/server-wiki-graph-consolidation
