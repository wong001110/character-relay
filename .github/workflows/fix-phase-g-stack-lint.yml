name: Fix Phase G Stack Lint

on:
  push:
    branches:
      - feat/server-wiki-graph-consolidation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-wiki-graph-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Fix inherited stack lint
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/echo_masque/api/routes/smart_participation_v4.py \
            src/echo_masque/persistence/__init__.py \
            tests/test_planner_media_contract.py
          python - <<'PY'
          from pathlib import Path
          for name in (
              "tests/test_conversation_planner_v1.py",
              "tests/test_media_dependency_v2.py",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace("？", "?"), encoding="utf-8")
          PY
          python -m ruff check \
            src/echo_masque/api/routes/smart_participation_v4.py \
            src/echo_masque/persistence/__init__.py \
            tests/test_planner_media_contract.py \
            tests/test_conversation_planner_v1.py \
            tests/test_media_dependency_v2.py
      - name: Commit lint cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-phase-g-stack-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clean inherited conversation intelligence lint'
          git push origin HEAD:feat/server-wiki-graph-consolidation
