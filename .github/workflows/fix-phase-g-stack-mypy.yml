name: Fix Phase G Stack Mypy

on:
  push:
    branches:
      - feat/server-wiki-graph-consolidation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/server-wiki-graph-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply type-safety fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          planner = "src/echo_masque/planner_media.py"
          replace_once(planner, "from dataclasses import dataclass\n", "from dataclasses import dataclass, field\n")
          replace_once(
              planner,
              "    media: EnhancedLiveMediaContextService\n"
              "    utility_provider: MediaUnderstandingProvider | None = None\n\n"
              "    def __post_init__(self) -> None:\n",
              "    media: EnhancedLiveMediaContextService\n"
              "    utility_provider: MediaUnderstandingProvider | None = None\n"
              "    _utility: MediaUnderstandingService | None = field(\n"
              "        init=False,\n"
              "        default=None,\n"
              "        repr=False,\n"
              "    )\n\n"
              "    def __post_init__(self) -> None:\n",
          )
          replace_once(
              planner,
              "            context: LiveMediaContext | None = None\n"
              "            try:\n"
              "                context = await self.media._article_context(source)\n"
              "            except Exception:\n"
              "                context = None\n"
              "            if (\n"
              "                context is None\n"
              "                and needs_objective_subject\n"
              "                and source.kind in {\"image\", \"video\"}\n"
              "            ):\n"
              "                context = await self._utility_public_context(\n"
              "                    source=source,\n"
              "                    media_type=cast(Literal[\"image\", \"video\"], source.kind),\n"
              "                )\n"
              "            if context is not None:\n"
              "                descriptors.append(\n"
              "                    self._from_context(\n"
              "                        ref=f\"url:{index}\",\n"
              "                        context=context,\n"
              "                        source_url=source.canonical_url,\n"
              "                    )\n"
              "                )\n",
              "            resolved_context: LiveMediaContext | None = None\n"
              "            try:\n"
              "                resolved_context = await self.media._article_context(source)\n"
              "            except Exception:\n"
              "                resolved_context = None\n"
              "            if (\n"
              "                resolved_context is None\n"
              "                and needs_objective_subject\n"
              "                and source.kind in {\"image\", \"video\"}\n"
              "            ):\n"
              "                resolved_context = await self._utility_public_context(\n"
              "                    source=source,\n"
              "                    media_type=cast(Literal[\"image\", \"video\"], source.kind),\n"
              "                )\n"
              "            if resolved_context is not None:\n"
              "                descriptors.append(\n"
              "                    self._from_context(\n"
              "                        ref=f\"url:{index}\",\n"
              "                        context=resolved_context,\n"
              "                        source_url=source.canonical_url,\n"
              "                    )\n"
              "                )\n",
          )

          smart = "src/echo_masque/api/routes/smart_participation_v4.py"
          replace_once(
              smart,
              "    for item in payload.media_descriptors:\n"
              "        if not item.topic_evidence or item.state != \"resolved\":\n"
              "            continue\n"
              "        subject = \" \".join((item.subject or item.summary or item.label).split())[:500]\n"
              "        summary = \" \".join(item.summary.split())[:800]\n"
              "        if not subject and not summary:\n"
              "            continue\n"
              "        line = f\"[resolved media {item.kind}] {subject}\"\n",
              "    for descriptor in payload.media_descriptors:\n"
              "        if not descriptor.topic_evidence or descriptor.state != \"resolved\":\n"
              "            continue\n"
              "        subject = \" \".join(\n"
              "            (descriptor.subject or descriptor.summary or descriptor.label).split()\n"
              "        )[:500]\n"
              "        summary = \" \".join(descriptor.summary.split())[:800]\n"
              "        if not subject and not summary:\n"
              "            continue\n"
              "        line = f\"[resolved media {descriptor.kind}] {subject}\"\n",
          )

          media_runtime = "src/echo_masque/media_connector_runtime.py"
          replace_once(
              media_runtime,
              "        direct_tool_path = isinstance(target, PromptModelTarget) and bool(enabled)\n"
              "        try:\n"
              "            if direct_tool_path:\n"
              "                return await target.send_with_tools(\n",
              "        direct_tool_path = False\n"
              "        try:\n"
              "            if isinstance(target, PromptModelTarget) and enabled:\n"
              "                direct_tool_path = True\n"
              "                return await target.send_with_tools(\n",
          )
          PY
      - run: python -m pip install -e ".[dev]"
      - name: Validate full source typing
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/echo_masque/planner_media.py \
            src/echo_masque/api/routes/smart_participation_v4.py \
            src/echo_masque/media_connector_runtime.py
          python -m mypy src
      - name: Commit type-safety cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-phase-g-stack-mypy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make conversation intelligence stack type-safe'
          git push origin HEAD:feat/server-wiki-graph-consolidation
