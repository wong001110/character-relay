name: Format Smart Output V1 Python

on:
  push:
    branches:
      - agent/smart-output-v1
    paths:
      - .github/workflows/format-smart-output-v1.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-output-v1
          fetch-depth: 0
      - name: Install Ruff
        run: python -m pip install ruff==0.16.2
      - name: Fix and format touched Python
        run: |
          python -m ruff check --fix \
            src/echo_masque/connector_runtime.py \
            src/echo_masque/smart_output.py \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_character_prompt_expression_invariants.py
          python -m ruff format \
            src/echo_masque/connector_runtime.py \
            src/echo_masque/smart_output.py \
            tests/test_smart_output.py \
            tests/test_expression_runtime.py \
            tests/test_character_prompt_expression_invariants.py
          rm .github/workflows/format-smart-output-v1.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Smart Output V1 Python"
          git push origin HEAD:agent/smart-output-v1
