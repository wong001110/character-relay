name: Group chat isolated verification tools
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/group-chat-local-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    if: github.repository == 'wong001110/character-relay' && github.event.pull_request.number == 207 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/discord-group-chat-core-takeover'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Acquire public test packages only
        run: |
          mkdir -p /tmp/verification/wheels
          python -m pip download --only-binary=:all: -d /tmp/verification/wheels 'fastembed>=0.8,<0.9' 'mutmut>=3,<4'
          cd /tmp/verification
          sha256sum wheels/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: group-chat-extra-tools-${{ github.run_id }}
          path: /tmp/verification
          retention-days: 1
