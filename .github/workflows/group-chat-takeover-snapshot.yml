# Temporary source-only handoff artifact; remove after the takeover workspace is verified.
name: Group chat takeover source
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feat/discord-group-chat-core-takeover' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/group-chat-source
          git rev-parse HEAD > /tmp/group-chat-source/commit.txt
          git archive --format=tar HEAD | gzip > /tmp/group-chat-source/source.tar.gz
          cd /tmp/group-chat-source
          sha256sum source.tar.gz > sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: group-chat-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/group-chat-source/
          retention-days: 1
          if-no-files-found: error
