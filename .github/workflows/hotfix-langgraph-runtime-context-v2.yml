name: Hotfix LangGraph runtime context v2

on:
  push:
    branches:
      - fix/langgraph-runtime-context-rebind
    paths:
      - .github/workflows/hotfix-langgraph-runtime-context-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/langgraph-runtime-context-rebind
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply graph context patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/hotfix-langgraph-runtime-context.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<runtime-context-hotfix>', 'exec'))
          PY
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Normalize and validate
        run: |
          ruff check --fix src/echo_masque/orchestration/character_turn_graph.py tests/test_character_turn_graph.py tests/test_provider_trace_scope.py
          ruff check src/echo_masque/orchestration/character_turn_graph.py tests/test_character_turn_graph.py tests/test_provider_trace_scope.py
          mypy src/echo_masque
          pytest -q tests/test_character_turn_graph.py tests/test_provider_trace_scope.py
      - name: Remove one-shot workflows
        run: |
          git rm .github/workflows/hotfix-langgraph-runtime-context.yml
          git rm .github/workflows/hotfix-langgraph-runtime-context-v2.yml
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebind LangGraph runtime context across nodes"
          git push origin HEAD:fix/langgraph-runtime-context-rebind
