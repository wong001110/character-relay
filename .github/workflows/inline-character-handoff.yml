name: Validate Inline Character Handoff

on:
  push:
    branches: [agent/expression-retrieval-mvp]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expression-retrieval-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
      - name: Apply inline handoff patch
        run: |
          python scripts/add_inline_character_handoff.py
          python scripts/repair_inline_handoff_prompt.py
      - name: Validate Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check src tests
          python -m mypy src
          python -m pytest
      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          docker build -t character-relay-discord-inline-handoff .
      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary files
        run: |
          rm -f .github/workflows/inline-character-handoff.yml
          rm -f scripts/add_inline_character_handoff.py
          rm -f scripts/repair_inline_handoff_prompt.py
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -f connectors/discord/package-lock.json connectors/discord/tsconfig.tsbuildinfo
          rm -rf web/dist connectors/discord/dist
      - name: Commit validated fix
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          git commit -m "fix: route inline character handoffs"
          git push origin HEAD:agent/expression-retrieval-mvp
