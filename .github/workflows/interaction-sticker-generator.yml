name: Interaction Sessions and Sticker generator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feature/interaction-sessions-sticker-understanding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interaction-sessions-sticker-understanding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Interaction Sessions and Sticker implementation
        run: |
          if [ ! -f scripts/apply_interaction_sessions_and_stickers.py ]; then
            echo 'No pending generator.'
            exit 0
          fi
          grep -q '^## Runtime behavior$' connectors/discord/README.md || printf '\n## Runtime behavior\n' >> connectors/discord/README.md
          python scripts/patch_interaction_generator.py
          python scripts/apply_interaction_sessions_and_stickers.py
          python scripts/fix_generated_interaction_code.py
          rm -f scripts/patch_interaction_generator.py scripts/fix_generated_interaction_code.py
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          PY_FILES=(
            src/echo_masque/api/__init__.py
            src/echo_masque/api/connector_schemas.py
            src/echo_masque/api/interaction_schemas.py
            src/echo_masque/api/routes/__init__.py
            src/echo_masque/api/routes/connectors.py
            src/echo_masque/api/routes/interactions.py
            src/echo_masque/connector_runtime.py
            src/echo_masque/evaluation_lifecycle.py
            src/echo_masque/persistence/__init__.py
            src/echo_masque/persistence/interaction_models.py
            src/echo_masque/persistence/interaction_repository.py
            tests/test_interaction_sessions_and_stickers.py
          )
          python -m ruff check "${PY_FILES[@]}" --fix
          python -m ruff format "${PY_FILES[@]}"
          python -m ruff check src tests
          python -m mypy src
          python -m pytest -q tests/test_interaction_sessions_and_stickers.py tests/test_discord_connector.py tests/test_discord_bot_tag_runtime.py
          cd connectors/discord
          npm install --no-package-lock
          npm run typecheck
          npm test
          npm run build
          cd ../../web
          npm install --no-package-lock
          npm run typecheck
          npm test
          npm run build
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Interaction Sessions and Sticker understanding'
          git push origin HEAD:feature/interaction-sessions-sticker-understanding
