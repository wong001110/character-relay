name: Observability Runtime Control Checkpoint 1

on:
  push:
    branches: [agent/observability-runtime-control]

permissions:
  contents: write

jobs:
  guarded-checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observability-runtime-control
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded source patch
        run: python scripts/apply_observability_runtime_control_checkpoint1.py
      - name: Format Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff format src/echo_masque/admin_runtime.py src/echo_masque/api/routes/admin.py src/echo_masque/api/routes/smart_participation.py src/echo_masque/utility_gateway_router.py tests/test_observability_runtime_control.py
          python -m ruff check --fix src/echo_masque/admin_runtime.py src/echo_masque/api/routes/admin.py src/echo_masque/api/routes/smart_participation.py src/echo_masque/utility_gateway_router.py tests/test_observability_runtime_control.py
      - name: Python validation
        run: |
          python -m ruff check src/echo_masque/admin_runtime.py src/echo_masque/api/routes/admin.py src/echo_masque/api/routes/smart_participation.py src/echo_masque/utility_gateway_router.py tests/test_observability_runtime_control.py
          python -m mypy src
          python -m pytest tests/test_observability_runtime_control.py tests/test_utility_gateway_phase2.py -q
      - name: Discord Connector validation
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test -- --run src/turnCollector.test.ts src/turnIngress.test.ts
          npm run build
      - name: Verify diff
        run: git diff --check
      - name: Commit validated checkpoint and remove staging helpers
        run: |
          rm scripts/apply_observability_runtime_control_checkpoint1.py
          rm .github/workflows/observability-runtime-control-checkpoint1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add live runtime controls and provider recovery'
          git push origin HEAD:agent/observability-runtime-control
