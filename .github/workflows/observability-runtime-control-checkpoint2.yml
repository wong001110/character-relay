name: Observability Runtime Control Checkpoint 2

on:
  push:
    branches: [agent/observability-runtime-control]

permissions:
  contents: write

jobs:
  guarded-checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observability-runtime-control
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded source patch
        run: |
          python scripts/apply_observability_runtime_control_checkpoint2.py
          python scripts/normalize_checkpoint2_tests.py
      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format and validate Python
        run: |
          python -m ruff format src/echo_masque/providers/base.py src/echo_masque/providers/errors.py src/echo_masque/providers/openai_compatible.py src/echo_masque/persistence/utility_gateway_models.py src/echo_masque/persistence/database.py src/echo_masque/utility_gateway_contracts.py src/echo_masque/utility_gateway_router.py src/echo_masque/utility_gateway_live.py tests/test_provider_quota_observation.py
          python -m ruff check --fix src/echo_masque/providers/base.py src/echo_masque/providers/errors.py src/echo_masque/providers/openai_compatible.py src/echo_masque/persistence/utility_gateway_models.py src/echo_masque/persistence/database.py src/echo_masque/utility_gateway_contracts.py src/echo_masque/utility_gateway_router.py src/echo_masque/utility_gateway_live.py tests/test_provider_quota_observation.py
          python -m ruff check src/echo_masque/providers/base.py src/echo_masque/providers/errors.py src/echo_masque/providers/openai_compatible.py src/echo_masque/persistence/utility_gateway_models.py src/echo_masque/persistence/database.py src/echo_masque/utility_gateway_contracts.py src/echo_masque/utility_gateway_router.py src/echo_masque/utility_gateway_live.py tests/test_provider_quota_observation.py
          python -m mypy src
          python -m pytest tests/test_provider_quota_observation.py tests/test_observability_runtime_control.py -q
      - name: Validate Web
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Verify diff
        run: git diff --check
      - name: Commit validated checkpoint and remove staging helpers
        run: |
          rm scripts/apply_observability_runtime_control_checkpoint2.py
          rm scripts/normalize_checkpoint2_tests.py
          rm .github/workflows/observability-runtime-control-checkpoint2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expose free pool quota and Portal runtime controls'
          git push origin HEAD:agent/observability-runtime-control
