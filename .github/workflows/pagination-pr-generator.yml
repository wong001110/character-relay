name: Pagination PR generator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feature/paginate-portal-lists'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paginate-portal-lists
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pending pagination generators
        run: |
          changed=false
          for generator in scripts/fix_pagination_backend_generator.py scripts/apply_pagination_backend.py scripts/apply_pagination_frontend.py; do
            if [ -f "$generator" ]; then
              python "$generator"
              changed=true
            fi
          done
          if [ "$changed" != true ]; then
            echo 'No pending pagination generator.'
            exit 0
          fi
          python -m compileall -q src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply portal list pagination'
          git push origin HEAD:feature/paginate-portal-lists
