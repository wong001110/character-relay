name: Pagination workflow proof

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  proof:
    if: github.event.head_commit.message == 'chore: trigger pagination workflow proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paginate-portal-lists
      - name: Write proof
        run: |
          printf 'ok\n' > .pagination-workflow-proof
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pagination-workflow-proof
          git commit -m 'chore: verify pagination workflow access'
          git push origin HEAD:feature/paginate-portal-lists
