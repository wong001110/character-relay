name: Phase B Diagnose

on:
  push:
    branches:
      - feat/sequential-multi-participant-runtime

permissions:
  contents: read

jobs:
  first-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Capture first pytest failure
        run: python -m pytest -x -q > phase-b-first-failure.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase-b-first-failure
          path: phase-b-first-failure.txt
          retention-days: 1
