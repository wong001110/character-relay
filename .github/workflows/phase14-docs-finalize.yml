name: Phase 14 Documentation Finalizer

on:
  push:
    branches: [agent/phase-14-experiment-matrix]
    paths:
      - scripts/phase14_docs_finalize.py
      - .github/workflows/phase14-docs-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-14-experiment-matrix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/phase14_docs_finalize.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize phase 14 delivery status"
          git push origin HEAD:agent/phase-14-experiment-matrix
