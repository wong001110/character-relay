name: Phase 16 Live Acceptance

on:
  workflow_dispatch:
    inputs:
      live_url:
        description: Deployed Echo Masque URL
        required: true
        default: https://echo-masque-production.up.railway.app
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: phase-16-live-acceptance
  cancel-in-progress: false

jobs:
  phase16-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_URL: ${{ inputs.live_url || 'https://echo-masque-production.up.railway.app' }}
      ADMIN_EMAIL: ${{ secrets.ECHO_MASQUE_LIVE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ECHO_MASQUE_LIVE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require Live Admin acceptance credentials
        run: |
          test -n "$ADMIN_EMAIL" || (echo "Missing ECHO_MASQUE_LIVE_ADMIN_EMAIL" && exit 1)
          test -n "$ADMIN_PASSWORD" || (echo "Missing ECHO_MASQUE_LIVE_ADMIN_PASSWORD" && exit 1)
      - name: Install Echo Masque
        run: python -m pip install -e .
      - name: Wait for the Phase 16 deployment
        run: |
          python - <<'PY'
          import time

          import httpx

          base = "${{ env.LIVE_URL }}".rstrip("/")
          for attempt in range(72):
              try:
                  auth = httpx.get(f"{base}/api/auth/config", timeout=15)
                  templates = httpx.get(f"{base}/api/templates", timeout=15)
                  if auth.status_code == 200 and templates.status_code in {200, 401}:
                      payload = auth.json()
                      if payload.get("authentication_required") is True:
                          print("Phase 16 deployment routes are ready.")
                          break
              except (httpx.HTTPError, ValueError):
                  pass
              print(f"Waiting for Phase 16 deployment ({attempt + 1}/72)...")
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for the Phase 16 deployment.")
          PY
      - name: Run Phase 16 retained acceptance
        run: |
          python scripts/live_phase16_acceptance.py "$LIVE_URL" \
            --admin-email "$ADMIN_EMAIL" \
            --admin-password "$ADMIN_PASSWORD" \
            > phase16-live-acceptance.json
      - name: Publish redacted result
        run: cat phase16-live-acceptance.json
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase16-live-acceptance
          path: phase16-live-acceptance.json
          if-no-files-found: error
      - name: Record successful acceptance
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 45,
              body: `✅ Phase 16 live acceptance passed for commit \`${context.sha}\`.\n\nValidated template Draft boundaries, secret-free Share Bundles, exact Runtime Prompt inspection and four export formats, Calibration, Rules Evaluation, coverage analytics, and temporary-account cleanup. Evidence artifact: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
      - name: Record failed acceptance
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 45,
              body: `❌ Phase 16 live acceptance failed for commit \`${context.sha}\`. No secret values are included in this notice. Inspect run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
