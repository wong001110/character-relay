name: Phase 3 Character Turn bootstrap

on:
  push:
    branches:
      - agent/langgraph-phase-3-character-turn
    paths:
      - .github/workflows/phase3-character-turn-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-3-character-turn
          fetch-depth: 0
      - name: Refactor reusable Character Turn stages and add graph pilot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('src/echo_masque/connector_runtime.py')
          text = runtime_path.read_text(encoding='utf-8')

          text = text.replace(
              'import re\nfrom collections.abc import Callable\n',
              'import re\nfrom collections.abc import Callable\nfrom dataclasses import dataclass\n',
              1,
          )
          text = text.replace(
              'from echo_masque.credentials import CredentialStore\n',
              'from echo_masque.credentials import CredentialStore\nfrom echo_masque.domain import TargetResponse\n',
              1,
          )
          text = text.replace(
              'from echo_masque.persistence.deployment_models import CharacterDeploymentRecord\n',
              'from echo_masque.persistence.deployment_models import CharacterDeploymentRecord\n'
              'from echo_masque.persistence.models import CharacterCardRecord, TargetRecord\n',
              1,
          )

          marker = '''class ConnectorRuntimeError(RuntimeError):\n    """Raised when a deployment cannot produce a connector reply."""\n\n\nclass DiscordConnectorRuntime:'''
          replacement = '''class ConnectorRuntimeError(RuntimeError):\n    """Raised when a deployment cannot produce a connector reply."""\n\n\n@dataclass(slots=True)\nclass ResolvedCharacterTurn:\n    """Transient resolved runtime dependencies for one Character turn."""\n\n    payload: DiscordInboundMessage\n    deployment: CharacterDeploymentRecord\n    card: CharacterCardRecord\n    target_record: TargetRecord\n    target: TargetAdapter\n\n\n@dataclass(slots=True)\nclass PreparedCharacterTurn:\n    """Transient context/model inputs. Raw content never enters LangGraph state."""\n\n    resolved: ResolvedCharacterTurn\n    turn_context: CharacterTurnContext | None\n    smart_context: SmartOutputContext\n    prompt: str\n    enabled_tools: tuple[str, ...]\n    tool_context: ToolExecutionContext\n\n\n@dataclass(slots=True)\nclass ResolvedCharacterOutput:\n    """Transient model/output result awaiting deterministic Runtime authority."""\n\n    final_response: TargetResponse\n    smart_output: DiscordSmartOutputView\n    smart_reason: str\n    tool_traces: list[ToolExecutionTrace]\n\n\nclass DiscordConnectorRuntime:'''
          if text.count(marker) != 1:
              raise SystemExit('connector runtime class marker not found exactly once')
          text = text.replace(marker, replacement, 1)

          start = text.index('    async def respond(self, payload: DiscordInboundMessage)')
          end = text.index('    @staticmethod\n    def _tool_traces', start)
          methods = '''    def resolve_character_turn(\n        self,\n        payload: DiscordInboundMessage,\n    ) -> tuple[ResolvedCharacterTurn | None, DiscordConnectorReplyView | None]:\n        """Resolve deployment/card/target without performing a provider call."""\n\n        deployment = self.deployment_repository.deployment_matches_discord_destination(\n            payload.deployment_id,\n            connection_id=payload.connection_id,\n            guild_id=payload.guild_id,\n            channel_id=payload.channel_id,\n            thread_id=payload.thread_id,\n            category_id=payload.category_id,\n        )\n        if deployment is None:\n            return None, DiscordConnectorReplyView(\n                action="silent",\n                reason="no_active_deployment",\n                deployment_id=payload.deployment_id,\n            )\n\n        if not self._should_reply(deployment, payload):\n            return None, DiscordConnectorReplyView(\n                action="silent",\n                reason="trigger_not_matched",\n                deployment_id=deployment.id,\n            )\n\n        card = self.repository.get_character_card(\n            deployment.character_card_id,\n            deployment.owner_id,\n        )\n        if card is None:\n            self.deployment_repository.record_deployment_error(\n                deployment.id,\n                "Character Card is unavailable.",\n            )\n            raise ConnectorRuntimeError("Character Card is unavailable.")\n        target_record = self.repository.get_target(card.target_id)\n        if target_record is None:\n            self.deployment_repository.record_deployment_error(\n                deployment.id,\n                "Character target binding is unavailable.",\n            )\n            raise ConnectorRuntimeError("Character target binding is unavailable.")\n\n        target = self._target(\n            target_kind=target_record.target_kind,\n            target_name=target_record.name,\n            config_json=target_record.config_json,\n            owner_id=deployment.owner_id,\n            character_card_id=card.id,\n            character_profile=CharacterPromptProfile.from_record(card),\n        )\n        return (\n            ResolvedCharacterTurn(\n                payload=payload,\n                deployment=deployment,\n                card=card,\n                target_record=target_record,\n                target=target,\n            ),\n            None,\n        )\n\n    def prepare_character_turn(\n        self,\n        resolved: ResolvedCharacterTurn,\n    ) -> PreparedCharacterTurn:\n        """Build scoped context/RAG and the bounded Tool execution context."""\n\n        payload = resolved.payload\n        deployment = resolved.deployment\n        card = resolved.card\n        turn_context = (\n            self.context_orchestrator.build(\n                payload=payload,\n                deployment=deployment,\n                character_name=card.display_name,\n            )\n            if self.context_orchestrator is not None\n            else None\n        )\n        smart_context = (\n            turn_context.smart_output\n            if turn_context is not None\n            else SmartOutputContext.from_payload(\n                payload,\n                character_name=card.display_name,\n            )\n        )\n        prompt = self._social_prompt(\n            character_name=card.display_name,\n            payload=payload,\n            smart_context=smart_context,\n            turn_context=turn_context,\n        )\n        enabled_tools = (\n            self.deployment_tool_repository.get_enabled_tools_for_runtime(deployment.id)\n            if self.deployment_tool_repository is not None\n            else ()\n        )\n        tool_context = ToolExecutionContext(\n            owner_id=deployment.owner_id,\n            deployment_id=deployment.id,\n            character_card_id=card.id,\n            platform=deployment.platform,\n            connection_id=deployment.connection_id,\n            guild_id=payload.guild_id,\n            channel_id=payload.channel_id,\n            thread_id=payload.thread_id,\n            message_id=payload.message_id,\n            trigger_text=payload.text,\n            initiator_is_bot=payload.author_is_bot,\n            initiator_user_id=payload.author_id,\n        )\n        return PreparedCharacterTurn(\n            resolved=resolved,\n            turn_context=turn_context,\n            smart_context=smart_context,\n            prompt=prompt,\n            enabled_tools=enabled_tools,\n            tool_context=tool_context,\n        )\n\n    async def invoke_character_model(\n        self,\n        prepared: PreparedCharacterTurn,\n    ) -> TargetResponse:\n        """Invoke the existing model adapter and bounded ToolRuntime loop unchanged."""\n\n        target = prepared.resolved.target\n        deployment = prepared.resolved.deployment\n        try:\n            if isinstance(target, PromptModelTarget) and prepared.enabled_tools:\n                return await target.send_with_tools(\n                    prepared.prompt,\n                    tool_registry=self.tool_registry,\n                    enabled_tool_ids=prepared.enabled_tools,\n                    tool_context=prepared.tool_context,\n                    max_tool_rounds=2,\n                )\n            return await target.send(prepared.prompt)\n        except Exception as exc:\n            self.deployment_repository.record_deployment_error(\n                deployment.id,\n                str(exc),\n            )\n            raise\n\n    async def resolve_character_output(\n        self,\n        prepared: PreparedCharacterTurn,\n        response: TargetResponse,\n    ) -> ResolvedCharacterOutput:\n        """Parse/repair Smart Output without re-running side-effect Tools."""\n\n        resolved = prepared.resolved\n        payload = resolved.payload\n        deployment = resolved.deployment\n        target = resolved.target\n        target_record = resolved.target_record\n        smart_context = prepared.smart_context\n        tool_traces = self._tool_traces(response.trace)\n        final_response = response\n        smart_output, smart_reason = smart_context.parse_and_resolve(\n            response.text.strip(),\n            payload.expression_candidates,\n        )\n        if smart_output is None and target_record.target_kind == "prompt_model":\n            retry_prompt = "\\n".join(\n                (\n                    prepared.prompt,\n                    "",\n                    f"Your previous Smart Output was rejected ({smart_reason}).",\n                    "Regenerate once. Return exactly one valid [[CR_OUTPUT {...}]] line "\n                    "and nothing else. Use only the references supplied above.",\n                )\n            )\n            try:\n                # Formatting repair intentionally does not re-enable Tools. Tool results\n                # from the original turn remain in target history, preventing duplicated\n                # reads or side effects during repair.\n                retry_response = await target.send(retry_prompt)\n                final_response = retry_response\n                smart_output, smart_reason = smart_context.parse_and_resolve(\n                    retry_response.text.strip(),\n                    payload.expression_candidates,\n                )\n            except Exception as exc:\n                self.deployment_repository.record_deployment_error(\n                    deployment.id,\n                    str(exc),\n                )\n                smart_reason = "smart_output_retry_failed"\n\n        if smart_output is None and target_record.target_kind in {"stable", "fragile"}:\n            smart_output = legacy_message_output(response.text, payload.message_id)\n            smart_reason = "deterministic_target_adapter"\n\n        if smart_output is None:\n            smart_output = DiscordSmartOutputView(action="ignore")\n            smart_reason = f"invalid_smart_output:{smart_reason}"\n\n        return ResolvedCharacterOutput(\n            final_response=final_response,\n            smart_output=smart_output,\n            smart_reason=smart_reason,\n            tool_traces=tool_traces,\n        )\n\n    def authorize_character_output(\n        self,\n        prepared: PreparedCharacterTurn,\n        output: ResolvedCharacterOutput,\n    ) -> DiscordConnectorReplyView:\n        """Apply deterministic Runtime authority and produce the platform command view."""\n\n        resolved = prepared.resolved\n        deployment = resolved.deployment\n        card = resolved.card\n        smart_output = output.smart_output\n        final_response = output.final_response\n        expression = expression_decision_for(smart_output)\n        text = prepared.smart_context.legacy_visible_text(smart_output)\n        if smart_output.action == "ignore":\n            return DiscordConnectorReplyView(\n                action="silent",\n                reason=(\n                    output.smart_reason\n                    if output.smart_reason != "ok"\n                    else "character_chose_ignore"\n                ),\n                deployment_id=deployment.id,\n                character_display_name=card.display_name,\n                latency_ms=final_response.latency_ms,\n                input_tokens=final_response.input_tokens,\n                output_tokens=final_response.output_tokens,\n                expression=expression,\n                smart_output=smart_output,\n                context_trace=(\n                    prepared.turn_context.trace\n                    if prepared.turn_context is not None\n                    else None\n                ),\n                tool_calls=output.tool_traces,\n            )\n\n        self.deployment_repository.record_deployment_activity(deployment.id)\n        return DiscordConnectorReplyView(\n            action="reply" if smart_output.action == "message" else "expression",\n            reason="smart_output_generated",\n            deployment_id=deployment.id,\n            character_display_name=card.display_name,\n            text=text or None,\n            reply_to_message_id=smart_output.reply_to_message_id,\n            latency_ms=final_response.latency_ms,\n            input_tokens=final_response.input_tokens,\n            output_tokens=final_response.output_tokens,\n            expression=expression,\n            smart_output=smart_output,\n            context_trace=(\n                prepared.turn_context.trace if prepared.turn_context is not None else None\n            ),\n            tool_calls=output.tool_traces,\n        )\n\n    async def respond(self, payload: DiscordInboundMessage) -> DiscordConnectorReplyView:\n        """Legacy sequential path, now composed from reusable Phase 3 stage methods."""\n\n        resolved, early_reply = self.resolve_character_turn(payload)\n        if early_reply is not None:\n            return early_reply\n        if resolved is None:\n            raise ConnectorRuntimeError("Character turn resolution produced no result.")\n        prepared = self.prepare_character_turn(resolved)\n        response = await self.invoke_character_model(prepared)\n        output = await self.resolve_character_output(prepared, response)\n        return self.authorize_character_output(prepared, output)\n\n'''
          text = text[:start] + methods + text[end:]
          runtime_path.write_text(text, encoding='utf-8')

          graph = '''"""Phase 3 direct-runtime LangGraph pilot for one Character turn."""\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Any, Literal, TypedDict, cast\nfrom uuid import uuid4\n\nfrom langgraph.graph import END, START, StateGraph\nfrom langgraph.runtime import Runtime\n\nfrom echo_masque.api.connector_schemas import DiscordConnectorReplyView, DiscordInboundMessage\nfrom echo_masque.connector_runtime import (\n    DiscordConnectorRuntime,\n    PreparedCharacterTurn,\n    ResolvedCharacterOutput,\n    ResolvedCharacterTurn,\n)\nfrom echo_masque.domain import TargetResponse\nfrom echo_masque.orchestration.trace import (\n    RuntimeTraceEvent,\n    RuntimeTraceSink,\n    TraceNodeKind,\n)\n\nCharacterTurnOutcome = Literal["pending", "silent", "reply", "expression", "failed"]\nStageStatus = Literal["not_started", "running", "completed", "skipped", "failed"]\nGraphStatus = Literal["pending", "running", "completed", "failed"]\n\n\nclass CharacterTurnGraphState(TypedDict, total=False):\n    """Privacy-safe coordination state for one Character turn.\n\n    Raw messages, prompts, RAG excerpts, credentials, provider responses, Tool arguments,\n    Tool results, and final reply text remain transient in graph context and are not state.\n    Phase 3 does not add a checkpointer.\n    """\n\n    trace_id: str\n    graph_run_id: str\n    graph_name: Literal["character_turn"]\n    orchestration_version: str\n    status: GraphStatus\n    outcome: CharacterTurnOutcome\n    owner_id: str\n    deployment_id: str\n    character_card_id: str\n    platform: str\n    connection_id: str\n    guild_id: str\n    channel_id: str\n    thread_id: str\n    resolve_status: StageStatus\n    context_status: StageStatus\n    rag_status: StageStatus\n    model_status: StageStatus\n    tool_result_count: int\n    smart_output_status: StageStatus\n    authority_status: StageStatus\n    errors: tuple[str, ...]\n\n\n@dataclass(slots=True)\nclass CharacterTurnGraphContext:\n    """Transient dependencies and raw turn values for one graph run."""\n\n    payload: DiscordInboundMessage\n    runtime: DiscordConnectorRuntime\n    trace_sink: RuntimeTraceSink | None = None\n    orchestration_version: str = "langgraph-phase-3-direct-pilot"\n    resolved: ResolvedCharacterTurn | None = None\n    prepared: PreparedCharacterTurn | None = None\n    response: TargetResponse | None = None\n    output: ResolvedCharacterOutput | None = None\n    reply: DiscordConnectorReplyView | None = None\n\n\n@dataclass(frozen=True, slots=True)\nclass CharacterTurnGraphResult:\n    state: CharacterTurnGraphState\n    reply: DiscordConnectorReplyView\n\n\ndef _emit(\n    state: CharacterTurnGraphState,\n    context: CharacterTurnGraphContext,\n    *,\n    node_name: str,\n    node_kind: TraceNodeKind,\n    status: Literal["started", "completed", "failed"],\n    changed_keys: tuple[str, ...] = (),\n    metadata: tuple[tuple[str, str], ...] = (),\n    error: str = "",\n) -> None:\n    if context.trace_sink is None:\n        return\n    context.trace_sink.emit(\n        RuntimeTraceEvent(\n            trace_id=state.get("trace_id", ""),\n            graph_run_id=state.get("graph_run_id", ""),\n            graph_name="character_turn",\n            node_name=node_name,\n            node_kind=node_kind,\n            status=status,\n            changed_keys=changed_keys,\n            metadata=metadata,\n            error=error[:300],\n        )\n    )\n\n\ndef _resolve_turn(\n    state: CharacterTurnGraphState,\n    runtime: Runtime[CharacterTurnGraphContext],\n) -> CharacterTurnGraphState:\n    context = runtime.context\n    _emit(state, context, node_name="turn_resolve", node_kind="decision", status="started")\n    try:\n        resolved, early_reply = context.runtime.resolve_character_turn(context.payload)\n    except Exception as exc:\n        _emit(\n            state,\n            context,\n            node_name="turn_resolve",\n            node_kind="decision",\n            status="failed",\n            changed_keys=("resolve_status", "status", "outcome"),\n            error=str(exc),\n        )\n        raise\n    if early_reply is not None:\n        context.reply = early_reply\n        update: CharacterTurnGraphState = {\n            "resolve_status": "completed",\n            "status": "completed",\n            "outcome": "silent",\n            "deployment_id": early_reply.deployment_id or context.payload.deployment_id,\n        }\n        _emit(\n            state,\n            context,\n            node_name="turn_resolve",\n            node_kind="decision",\n            status="completed",\n            changed_keys=("resolve_status", "status", "outcome", "deployment_id"),\n            metadata=(("result", early_reply.reason),),\n        )\n        return update\n    if resolved is None:\n        raise RuntimeError("Character Turn graph resolution returned no runtime result.")\n    context.resolved = resolved\n    deployment = resolved.deployment\n    update = {\n        "resolve_status": "completed",\n        "status": "running",\n        "owner_id": deployment.owner_id,\n        "deployment_id": deployment.id,\n        "character_card_id": resolved.card.id,\n        "platform": deployment.platform,\n        "connection_id": deployment.connection_id,\n        "guild_id": context.payload.guild_id,\n        "channel_id": context.payload.channel_id,\n        "thread_id": context.payload.thread_id,\n    }\n    _emit(\n        state,\n        context,\n        node_name="turn_resolve",\n        node_kind="decision",\n        status="completed",\n        changed_keys=tuple(update.keys()),\n        metadata=(("target_kind", resolved.target_record.target_kind),),\n    )\n    return update\n\n\ndef _route_after_resolve(state: CharacterTurnGraphState) -> str:\n    return "end" if state.get("outcome") == "silent" else "context"\n\n\ndef _build_context(\n    state: CharacterTurnGraphState,\n    runtime: Runtime[CharacterTurnGraphContext],\n) -> CharacterTurnGraphState:\n    context = runtime.context\n    _emit(state, context, node_name="turn_context", node_kind="context", status="started")\n    if context.resolved is None:\n        raise RuntimeError("Character Turn graph lost resolved runtime dependencies.")\n    try:\n        prepared = context.runtime.prepare_character_turn(context.resolved)\n    except Exception as exc:\n        _emit(\n            state,\n            context,\n            node_name="turn_context",\n            node_kind="context",\n            status="failed",\n            changed_keys=("context_status", "rag_status", "status", "outcome"),\n            error=str(exc),\n        )\n        raise\n    context.prepared = prepared\n    rag_status: StageStatus = "completed" if prepared.turn_context is not None else "skipped"\n    _emit(\n        state,\n        context,\n        node_name="turn_context",\n        node_kind="context",\n        status="completed",\n        changed_keys=("context_status", "rag_status"),\n        metadata=(("rag_pipeline", "available" if prepared.turn_context is not None else "none"),),\n    )\n    return {"context_status": "completed", "rag_status": rag_status}\n\n\nasync def _invoke_model(\n    state: CharacterTurnGraphState,\n    runtime: Runtime[CharacterTurnGraphContext],\n) -> CharacterTurnGraphState:\n    context = runtime.context\n    _emit(state, context, node_name="turn_model", node_kind="agentic", status="started")\n    if context.prepared is None:\n        raise RuntimeError("Character Turn graph lost prepared context.")\n    try:\n        response = await context.runtime.invoke_character_model(context.prepared)\n    except Exception as exc:\n        _emit(\n            state,\n            context,\n            node_name="turn_model",\n            node_kind="agentic",\n            status="failed",\n            changed_keys=("model_status", "status", "outcome"),\n            error=str(exc),\n        )\n        raise\n    context.response = response\n    tool_count = len(context.runtime._tool_traces(response.trace))\n    _emit(\n        state,\n        context,\n        node_name="turn_model",\n        node_kind="agentic",\n        status="completed",\n        changed_keys=("model_status", "tool_result_count"),\n        metadata=(("tool_result_count", str(tool_count)),),\n    )\n    return {"model_status": "completed", "tool_result_count": tool_count}\n\n\nasync def _resolve_smart_output(\n    state: CharacterTurnGraphState,\n    runtime: Runtime[CharacterTurnGraphContext],\n) -> CharacterTurnGraphState:\n    context = runtime.context\n    _emit(\n        state,\n        context,\n        node_name="turn_smart_output",\n        node_kind="decision",\n        status="started",\n    )\n    if context.prepared is None or context.response is None:\n        raise RuntimeError("Character Turn graph lost model output before Smart Output.")\n    try:\n        output = await context.runtime.resolve_character_output(\n            context.prepared,\n            context.response,\n        )\n    except Exception as exc:\n        _emit(\n            state,\n            context,\n            node_name="turn_smart_output",\n            node_kind="decision",\n            status="failed",\n            changed_keys=("smart_output_status", "status", "outcome"),\n            error=str(exc),\n        )\n        raise\n    context.output = output\n    _emit(\n        state,\n        context,\n        node_name="turn_smart_output",\n        node_kind="decision",\n        status="completed",\n        changed_keys=("smart_output_status",),\n        metadata=(("action", output.smart_output.action), ("resolution", output.smart_reason)),\n    )\n    return {"smart_output_status": "completed"}\n\n\ndef _authorize_output(\n    state: CharacterTurnGraphState,\n    runtime: Runtime[CharacterTurnGraphContext],\n) -> CharacterTurnGraphState:\n    context = runtime.context\n    _emit(\n        state,\n        context,\n        node_name="turn_authority",\n        node_kind="authority",\n        status="started",\n    )\n    if context.prepared is None or context.output is None:\n        raise RuntimeError("Character Turn graph lost output before Runtime authority.")\n    try:\n        reply = context.runtime.authorize_character_output(context.prepared, context.output)\n    except Exception as exc:\n        _emit(\n            state,\n            context,\n            node_name="turn_authority",\n            node_kind="authority",\n            status="failed",\n            changed_keys=("authority_status", "status", "outcome"),\n            error=str(exc),\n        )\n        raise\n    context.reply = reply\n    outcome = cast(CharacterTurnOutcome, reply.action)\n    _emit(\n        state,\n        context,\n        node_name="turn_authority",\n        node_kind="authority",\n        status="completed",\n        changed_keys=("authority_status", "status", "outcome"),\n        metadata=(("action", reply.action), ("reason", reply.reason)),\n    )\n    return {\n        "authority_status": "completed",\n        "status": "completed",\n        "outcome": outcome,\n    }\n\n\ndef build_character_turn_graph() -> Any:\n    """Compile the Phase 3 direct-runtime Character Turn graph."""\n\n    builder = StateGraph(\n        state_schema=CharacterTurnGraphState,\n        context_schema=CharacterTurnGraphContext,\n    )\n    builder.add_node("turn_resolve", _resolve_turn)\n    builder.add_node("turn_context", _build_context)\n    builder.add_node("turn_model", _invoke_model)\n    builder.add_node("turn_smart_output", _resolve_smart_output)\n    builder.add_node("turn_authority", _authorize_output)\n    builder.add_edge(START, "turn_resolve")\n    builder.add_conditional_edges(\n        "turn_resolve",\n        _route_after_resolve,\n        {"context": "turn_context", "end": END},\n    )\n    builder.add_edge("turn_context", "turn_model")\n    builder.add_edge("turn_model", "turn_smart_output")\n    builder.add_edge("turn_smart_output", "turn_authority")\n    builder.add_edge("turn_authority", END)\n    return builder.compile()\n\n\nclass CharacterTurnGraphRunner:\n    """Run Phase 3 directly without changing production Discord routing yet."""\n\n    def __init__(\n        self,\n        runtime: DiscordConnectorRuntime,\n        *,\n        trace_sink: RuntimeTraceSink | None = None,\n    ) -> None:\n        self.runtime = runtime\n        self.trace_sink = trace_sink\n        self.graph = build_character_turn_graph()\n\n    async def run(self, payload: DiscordInboundMessage) -> CharacterTurnGraphResult:\n        context = CharacterTurnGraphContext(\n            payload=payload,\n            runtime=self.runtime,\n            trace_sink=self.trace_sink,\n        )\n        state: CharacterTurnGraphState = {\n            "trace_id": str(uuid4()),\n            "graph_run_id": str(uuid4()),\n            "graph_name": "character_turn",\n            "orchestration_version": context.orchestration_version,\n            "status": "pending",\n            "outcome": "pending",\n            "deployment_id": payload.deployment_id,\n            "resolve_status": "not_started",\n            "context_status": "not_started",\n            "rag_status": "not_started",\n            "model_status": "not_started",\n            "tool_result_count": 0,\n            "smart_output_status": "not_started",\n            "authority_status": "not_started",\n            "errors": (),\n        }\n        result = cast(\n            CharacterTurnGraphState,\n            await self.graph.ainvoke(state, context=context),\n        )\n        if context.reply is None:\n            raise RuntimeError("Character Turn graph completed without a reply view.")\n        return CharacterTurnGraphResult(state=result, reply=context.reply)\n\n    async def __call__(self, payload: DiscordInboundMessage) -> DiscordConnectorReplyView:\n        return (await self.run(payload)).reply\n\n\n__all__ = [\n    "CharacterTurnGraphContext",\n    "CharacterTurnGraphResult",\n    "CharacterTurnGraphRunner",\n    "CharacterTurnGraphState",\n    "CharacterTurnOutcome",\n    "build_character_turn_graph",\n]\n'''
          Path('src/echo_masque/orchestration/character_turn_graph.py').write_text(
              graph,
              encoding='utf-8',
          )

          init_path = Path('src/echo_masque/orchestration/__init__.py')
          init_text = init_path.read_text(encoding='utf-8')
          import_marker = 'from echo_masque.orchestration.condition_watch_graph import (\n'
          phase3_import = '''from echo_masque.orchestration.character_turn_graph import (\n    CharacterTurnGraphContext,\n    CharacterTurnGraphResult,\n    CharacterTurnGraphRunner,\n    CharacterTurnGraphState,\n    build_character_turn_graph,\n)\n'''
          if phase3_import not in init_text:
              init_text = init_text.replace(import_marker, phase3_import + import_marker, 1)
          list_marker = '__all__ = [\n'
          phase3_exports = '''    "CharacterTurnGraphContext",\n    "CharacterTurnGraphResult",\n    "CharacterTurnGraphRunner",\n    "CharacterTurnGraphState",\n'''
          init_text = init_text.replace(list_marker, list_marker + phase3_exports, 1)
          init_text = init_text.replace(
              '    "build_condition_watch_graph",\n',
              '    "build_character_turn_graph",\n    "build_condition_watch_graph",\n',
              1,
          )
          init_path.write_text(init_text, encoding='utf-8')

          test = '''from pathlib import Path\n\nfrom cryptography.fernet import Fernet\nfrom fastapi.testclient import TestClient\nfrom pydantic import SecretStr\n\nfrom echo_masque.api import create_app\nfrom echo_masque.api.connector_schemas import DiscordInboundMessage\nfrom echo_masque.config import Settings\nfrom echo_masque.orchestration import CharacterTurnGraphRunner, RuntimeTraceEvent\n\nADMIN_EMAIL = "phase3-admin@example.com"\nADMIN_PASSWORD = "Phase3CharacterTurn2026!"\nCONNECTOR_SECRET = "phase3-connector-secret"\n\n\ndef settings(path: Path) -> Settings:\n    return Settings(\n        environment="test",\n        database_url=f"sqlite:///{path}",\n        legacy_local_user_enabled=False,\n        bootstrap_admin_email=ADMIN_EMAIL,\n        bootstrap_admin_password=SecretStr(ADMIN_PASSWORD),\n        credential_encryption_keys=SecretStr(Fernet.generate_key().decode("ascii")),\n        connector_shared_secret=SecretStr(CONNECTOR_SECRET),\n    )\n\n\ndef seed(app: object, client: TestClient) -> tuple[dict[str, object], dict[str, object]]:\n    login = client.post(\n        "/api/auth/login",\n        json={"email": ADMIN_EMAIL, "password": ADMIN_PASSWORD},\n    )\n    assert login.status_code == 200, login.text\n    character = client.post(\n        "/api/characters",\n        json={\n            "target_id": "demo-stable",\n            "display_name": "Ann",\n            "subtitle": "Phase 3 deterministic fixture",\n            "subject_type": "companion",\n            "persona_summary": "Ann is calm and careful.",\n            "traits": ["calm"],\n            "tags": ["phase3"],\n            "expected_tone": "Concise and gentle.",\n            "forbidden_behaviors": ["invent private memories"],\n            "memory_summary": "Use only supplied context.",\n            "preferred_suites": ["identity_integrity"],\n            "portrait_variant": "lavender",\n        },\n    )\n    assert character.status_code == 201, character.text\n    connection = client.post(\n        "/api/connections",\n        json={\n            "platform": "discord",\n            "display_name": "Phase 3 Discord",\n            "connection_mode": "managed",\n            "external_account_id": "",\n            "status": "disconnected",\n            "metadata": {},\n        },\n    )\n    assert connection.status_code == 201, connection.text\n    deployment = client.post(\n        "/api/deployments",\n        json={\n            "character_card_id": character.json()["id"],\n            "connection_id": connection.json()["id"],\n            "workspace_id": "guild-phase3",\n            "workspace_name": "Phase 3 Guild",\n            "channel_id": "channel-phase3",\n            "channel_name": "runtime",\n            "thread_id": "",\n            "thread_name": "",\n            "participation_mode": "mention_and_reply",\n            "memory_scope": "channel_isolated",\n            "version_label": "Current",\n            "sticker_count": 0,\n            "status": "active",\n        },\n    )\n    assert deployment.status_code == 201, deployment.text\n    return connection.json(), deployment.json()\n\n\ndef payload(\n    connection: dict[str, object],\n    deployment: dict[str, object],\n    *,\n    mentioned_bot: bool,\n) -> DiscordInboundMessage:\n    return DiscordInboundMessage.model_validate(\n        {\n            "connection_id": connection["id"],\n            "deployment_id": deployment["id"],\n            "message_id": "message-phase3",\n            "guild_id": "guild-phase3",\n            "guild_name": "Phase 3 Guild",\n            "channel_id": "channel-phase3",\n            "channel_name": "runtime",\n            "category_id": "",\n            "thread_id": "",\n            "thread_name": "",\n            "author_id": "user-phase3",\n            "author_display_name": "Juen",\n            "text": "Ann, what do you think?",\n            "mentioned_bot": mentioned_bot,\n            "replied_to_bot": False,\n            "smart_candidate": False,\n            "recent_messages": [\n                {\n                    "message_id": "message-phase3",\n                    "author_id": "user-phase3",\n                    "author_display_name": "Juen",\n                    "text": "Ann, what do you think?",\n                    "is_bot": False,\n                }\n            ],\n        }\n    )\n\n\nclass TraceCollector:\n    def __init__(self) -> None:\n        self.events: list[RuntimeTraceEvent] = []\n\n    def emit(self, event: RuntimeTraceEvent) -> None:\n        self.events.append(event)\n\n\ndef test_character_turn_graph_matches_direct_runtime(tmp_path: Path) -> None:\n    app = create_app(settings(tmp_path / "phase3-parity.db"))\n    client = TestClient(app)\n    connection, deployment = seed(app, client)\n    incoming = payload(connection, deployment, mentioned_bot=True)\n\n    direct = __import__("asyncio").run(app.state.discord_connector_runtime.respond(incoming))\n    traces = TraceCollector()\n    runner = CharacterTurnGraphRunner(\n        app.state.discord_connector_runtime,\n        trace_sink=traces,\n    )\n    graph_result = __import__("asyncio").run(runner.run(incoming))\n\n    assert graph_result.reply.model_dump() == direct.model_dump()\n    assert graph_result.state["status"] == "completed"\n    assert graph_result.state["outcome"] == "reply"\n    assert graph_result.state["deployment_id"] == deployment["id"]\n    assert graph_result.state["character_card_id"] == deployment["character_card_id"]\n    assert graph_result.state["context_status"] == "completed"\n    assert graph_result.state["model_status"] == "completed"\n    assert graph_result.state["smart_output_status"] == "completed"\n    assert graph_result.state["authority_status"] == "completed"\n    assert graph_result.state["tool_result_count"] == 0\n\n    completed_nodes = [\n        event.node_name\n        for event in traces.events\n        if event.status == "completed"\n    ]\n    assert completed_nodes == [\n        "turn_resolve",\n        "turn_context",\n        "turn_model",\n        "turn_smart_output",\n        "turn_authority",\n    ]\n    assert "Ann, what do you think?" not in repr(traces.events)\n\n\ndef test_character_turn_graph_preserves_early_silent_route(tmp_path: Path) -> None:\n    app = create_app(settings(tmp_path / "phase3-silent.db"))\n    client = TestClient(app)\n    connection, deployment = seed(app, client)\n    incoming = payload(connection, deployment, mentioned_bot=False)\n\n    runner = CharacterTurnGraphRunner(app.state.discord_connector_runtime)\n    result = __import__("asyncio").run(runner.run(incoming))\n\n    assert result.reply.action == "silent"\n    assert result.reply.reason == "trigger_not_matched"\n    assert result.state["status"] == "completed"\n    assert result.state["outcome"] == "silent"\n    assert result.state["resolve_status"] == "completed"\n    assert result.state["context_status"] == "not_started"\n    assert result.state["model_status"] == "not_started"\n'''
          Path('tests/test_character_turn_graph.py').write_text(test, encoding='utf-8')
