name: Phase 3 typing fixes

on:
  push:
    branches:
      - agent/langgraph-phase-3-character-turn
    paths:
      - .github/workflows/phase3-mypy-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-3-character-turn
          fetch-depth: 0
      - name: Apply strict typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          prompt = Path('src/echo_masque/targets/prompt_model.py')
          text = prompt.read_text(encoding='utf-8')
          text = text.replace(
              '    ProviderCompletion,\n)',
              '    ProviderCompletion,\n    ToolCapableChatProvider,\n)',
              1,
          )
          text = text.replace(
              '        complete_with_tools = cast(Any, self.provider.complete_with_tools)\n',
              '        complete_with_tools = cast(\n'
              '            ToolCapableChatProvider, self.provider\n'
              '        ).complete_with_tools\n',
              1,
          )
          prompt.write_text(text, encoding='utf-8')

          graph = Path('src/echo_masque/orchestration/character_turn_graph.py')
          text = graph.read_text(encoding='utf-8')
          needle = '    try:\n        if context.tool_turn is None:\n'
          replacement = '    response: TargetResponse | None\n    try:\n        if context.tool_turn is None:\n'
          if text.count(needle) != 1:
              raise SystemExit(f'graph response marker count: {text.count(needle)}')
          graph.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase3-mypy-fix.yml
      - name: Commit typing fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy Phase 3 strict typing"
          git push origin HEAD:agent/langgraph-phase-3-character-turn
