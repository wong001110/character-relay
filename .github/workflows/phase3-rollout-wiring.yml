name: Phase 3 rollout wiring

on:
  push:
    branches:
      - agent/langgraph-phase-3-character-turn
    paths:
      - .github/workflows/phase3-rollout-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-3-character-turn
          fetch-depth: 0
      - name: Wire Character Turn graph behind cumulative mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('src/echo_masque/api/__init__.py')
          text = api.read_text(encoding='utf-8')
          old = 'from echo_masque.orchestration import ConditionWatchGraphRunner\n'
          new = '\n'.join([
              'from echo_masque.orchestration import (',
              '    CharacterTurnGraphRunner,',
              '    ConditionWatchGraphRunner,',
              ')',
              '',
          ])
          if text.count(old) != 1:
              raise SystemExit(f'orchestration import count: {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '\n'.join([
              '    discord_connector_runtime = DiscordConnectorRuntime(',
              '        repository,',
              '        deployment_repository,',
              '        credential_store,',
              '        context_orchestrator=context_orchestrator,',
              '        deployment_tool_repository=deployment_tool_repository,',
              '        tool_registry=tool_registry,',
              '    )',
              '',
          ])
          replacement = marker + '\n'.join([
              '    character_turn_graph_runner = (',
              '        CharacterTurnGraphRunner(discord_connector_runtime)',
              '        if resolved.langgraph_allows("character_turn")',
              '        else None',
              '    )',
              '',
          ])
          if text.count(marker) != 1:
              raise SystemExit(f'connector runtime marker count: {text.count(marker)}')
          text = text.replace(marker, replacement, 1)
          state_marker = '    app.state.discord_connector_runtime = discord_connector_runtime\n'
          state_replacement = state_marker + '    app.state.character_turn_graph_runner = character_turn_graph_runner\n'
          if text.count(state_marker) != 1:
              raise SystemExit(f'app state marker count: {text.count(state_marker)}')
          text = text.replace(state_marker, state_replacement, 1)
          api.write_text(text, encoding='utf-8')

          route = Path('src/echo_masque/api/routes/connectors.py')
          route_text = route.read_text(encoding='utf-8')
          runtime_import = 'from echo_masque.connector_runtime import ConnectorRuntimeError, DiscordConnectorRuntime\n'
          runtime_new = runtime_import + 'from echo_masque.orchestration import CharacterTurnGraphRunner\n'
          if route_text.count(runtime_import) != 1:
              raise SystemExit(f'route runtime import count: {route_text.count(runtime_import)}')
          route_text = route_text.replace(runtime_import, runtime_new, 1)
          helper_marker = '\n'.join([
              'def connector_runtime(request: Request) -> DiscordConnectorRuntime:',
              '    return cast(DiscordConnectorRuntime, request.app.state.discord_connector_runtime)',
              '',
              '',
          ])
          helper_replacement = helper_marker + '\n'.join([
              'def character_turn_graph_runner(',
              '    request: Request,',
              ') -> CharacterTurnGraphRunner | None:',
              '    return cast(',
              '        CharacterTurnGraphRunner | None,',
              '        request.app.state.character_turn_graph_runner,',
              '    )',
              '',
              '',
          ])
          if route_text.count(helper_marker) != 1:
              raise SystemExit(f'connector helper marker count: {route_text.count(helper_marker)}')
          route_text = route_text.replace(helper_marker, helper_replacement, 1)
          endpoint_old = '        return await connector_runtime(request).respond(payload)\n'
          endpoint_new = '\n'.join([
              '        runner = character_turn_graph_runner(request)',
              '        if runner is not None:',
              '            return await runner(payload)',
              '        return await connector_runtime(request).respond(payload)',
              '',
          ])
          if route_text.count(endpoint_old) != 1:
              raise SystemExit(f'message endpoint marker count: {route_text.count(endpoint_old)}')
          route_text = route_text.replace(endpoint_old, endpoint_new, 1)
          route.write_text(route_text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase3-rollout-wiring.yml
      - name: Commit rollout wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/echo_masque/api/__init__.py src/echo_masque/api/routes/connectors.py
          git commit -m "feat: wire Character Turn graph behind rollout mode"
          git push origin HEAD:agent/langgraph-phase-3-character-turn
