name: Phase 3 Ruff cleanup

on:
  push:
    branches:
      - agent/langgraph-phase-3-character-turn
    paths:
      - .github/workflows/phase3-ruff-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-3-character-turn
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1.0'
      - name: Apply Ruff fixes
        run: ruff check --fix src/echo_masque/api/routes/connectors.py src/echo_masque/api/__init__.py src/echo_masque/connector_runtime.py src/echo_masque/orchestration/character_turn_graph.py src/echo_masque/targets/prompt_model.py src/echo_masque/targets/__init__.py
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase3-ruff-fix.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/echo_masque .github/workflows/phase3-ruff-fix.yml
          git commit -m "style: normalize Phase 3 graph wiring"
          git push origin HEAD:agent/langgraph-phase-3-character-turn
