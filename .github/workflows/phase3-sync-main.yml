name: Phase 3 sync main

on:
  push:
    branches:
      - agent/langgraph-phase-3-character-turn
    paths:
      - .github/workflows/phase3-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-3-character-turn
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase3-sync-main.yml
      - name: Commit cleanup and push
        run: |
          git add -A
          git commit -m "chore: remove Phase 3 sync workflow"
          git push origin HEAD:agent/langgraph-phase-3-character-turn
