name: Phase 3 targeted Python 3.12

on:
  push:
    branches:
      - agent/langgraph-phase-3-character-turn
    paths:
      - .github/workflows/phase3-targeted-312.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-3-character-turn
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/echo_masque tests/test_character_turn_graph.py tests/test_character_turn_graph_wiring.py tests/test_prompt_model_tool_calling.py tests/test_smart_output.py
      - run: mypy src/echo_masque
      - run: pytest -q tests/test_character_turn_graph.py tests/test_character_turn_graph_wiring.py tests/test_prompt_model_tool_calling.py tests/test_smart_output.py
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase3-targeted-312.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove Phase 3 targeted gate"
          git push origin HEAD:agent/langgraph-phase-3-character-turn
