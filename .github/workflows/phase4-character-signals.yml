name: Phase 4 Character coordination signals

on:
  push:
    branches:
      - agent/langgraph-phase-4-social-turn
    paths:
      - .github/workflows/phase4-character-signals.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-4-social-turn
          fetch-depth: 0
      - name: Add validated coordination refs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/echo_masque/orchestration/character_turn_graph.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from echo_masque.connector_runtime import (\n',
              'from echo_masque.character_invite_runtime import current_character_invite_proposal\n'
              'from echo_masque.connector_runtime import (\n',
              1,
          )
          text = text.replace(
              'from echo_masque.orchestration.trace import (\n',
              'from echo_masque.smart_output import SmartMentionPart\n'
              'from echo_masque.orchestration.trace import (\n',
              1,
          )
          old = '\n'.join([
              '@dataclass(frozen=True, slots=True)',
              'class CharacterTurnGraphResult:',
              '    state: CharacterTurnGraphState',
              '    reply: DiscordConnectorReplyView',
              '',
              '',
          ])
          new = '\n'.join([
              '@dataclass(frozen=True, slots=True)',
              'class CharacterTurnGraphResult:',
              '    state: CharacterTurnGraphState',
              '    reply: DiscordConnectorReplyView',
              '    invite_candidate_deployment_id: str = ""',
              '    mentioned_character_deployment_ids: tuple[str, ...] = ()',
              '',
              '',
          ])
          if text.count(old) != 1:
              raise SystemExit('result dataclass marker mismatch')
          text = text.replace(old, new, 1)
          old_return = '\n'.join([
              '        if context.reply is None:',
              '            raise RuntimeError("Character Turn graph completed without a reply view.")',
              '        return CharacterTurnGraphResult(state=result, reply=context.reply)',
          ])
          new_return = '\n'.join([
              '        if context.reply is None:',
              '            raise RuntimeError("Character Turn graph completed without a reply view.")',
              '        mentioned: tuple[str, ...] = ()',
              '        invite_candidate = ""',
              '        smart_output = context.reply.smart_output',
              '        if smart_output is not None and smart_output.action == "message":',
              '            mentioned = tuple(',
              '                part.mention.removeprefix("deployment:")',
              '                for part in smart_output.content',
              '                if isinstance(part, SmartMentionPart)',
              '                and part.mention.startswith("deployment:")',
              '            )',
              '            if context.prepared is not None:',
              '                proposal = current_character_invite_proposal(',
              '                    context.prepared.smart_context.invite_turn_token',
              '                )',
              '                if (',
              '                    proposal is not None',
              '                    and proposal.candidate_deployment_id in mentioned',
              '                ):',
              '                    invite_candidate = proposal.candidate_deployment_id',
              '        return CharacterTurnGraphResult(',
              '            state=result,',
              '            reply=context.reply,',
              '            invite_candidate_deployment_id=invite_candidate,',
              '            mentioned_character_deployment_ids=mentioned,',
              '        )',
          ])
          if text.count(old_return) != 1:
              raise SystemExit('runner return marker mismatch')
          path.write_text(text.replace(old_return, new_return, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase4-character-signals.yml
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose validated Character coordination refs"
          git push origin HEAD:agent/langgraph-phase-4-social-turn
