name: Phase 4 Discord connector contracts

on:
  push:
    branches:
      - agent/langgraph-phase-4-social-turn
    paths:
      - .github/workflows/phase4-connector-contracts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-4-social-turn
          fetch-depth: 0
      - name: Add connector Social Turn contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path('connectors/discord/src/types.ts')
          text = types.read_text(encoding='utf-8')
          marker = 'export type ChannelScopeMode = "exact" | "all_except";\n'
          text = text.replace(
              marker,
              marker + 'export type LangGraphMode = "off" | "condition_watch" | "character_turn" | "social_turn";\n',
              1,
          )
          field = '  webhook_token?: string | null;\n'
          if text.count(field) != 1:
              raise SystemExit('deployment field marker mismatch')
          text = text.replace(
              field,
              field + '  orchestration_mode: LangGraphMode;\n',
              1,
          )
          reply_marker = 'export interface DiscordReply {\n'
          social = '''export type DiscordSocialTurnOrigin = "selected" | "invite" | "mention";

export interface DiscordSocialPendingTurn {
  deployment_id: string;
  origin: DiscordSocialTurnOrigin;
  depth: number;
  source_deployment_id: string;
}

export interface DiscordSocialTurnCursor {
  pending_turns: DiscordSocialPendingTurn[];
  completed_deployment_ids: string[];
  continuation_budget_remaining: number;
  max_depth: number;
  step_index: number;
}

export interface DiscordSocialTurnStepRequest {
  payload: DiscordInboundMessage;
  initial_deployment_ids: string[];
  available_deployment_ids: string[];
  continuation_budget: number;
  max_depth: number;
  cursor?: DiscordSocialTurnCursor | null;
}

export interface DiscordSocialTurnStepReply {
  reply: DiscordReply;
  cursor: DiscordSocialTurnCursor;
  current_deployment_id: string;
  next_turn?: DiscordSocialPendingTurn | null;
  done: boolean;
  stop_reason: string;
  invite_candidate_deployment_id: string;
  mentioned_character_deployment_ids: string[];
}

'''
          if text.count(reply_marker) != 1:
              raise SystemExit('DiscordReply marker mismatch')
          types.write_text(text.replace(reply_marker, social + reply_marker, 1), encoding='utf-8')

          relay = Path('connectors/discord/src/relayClient.ts')
          text = relay.read_text(encoding='utf-8')
          import_marker = '  DiscordServerCatalogSync,\n'
          text = text.replace(
              import_marker,
              import_marker + '  DiscordSocialTurnStepReply,\n  DiscordSocialTurnStepRequest,\n',
              1,
          )
          method_marker = '  async processMessage(\n'
          method = '''  async processSocialTurnStep(
    request: Omit<DiscordSocialTurnStepRequest, "payload"> & {
      payload: Omit<DiscordInboundMessage, "connection_id">;
    }
  ): Promise<DiscordSocialTurnStepReply> {
    return this.request<DiscordSocialTurnStepReply>(
      "/api/connectors/discord/social-turns/step",
      {
        method: "POST",
        body: JSON.stringify({
          ...request,
          payload: { connection_id: this.connectionId, ...request.payload }
        })
      }
    );
  }

'''
          if text.count(method_marker) != 1:
              raise SystemExit('processMessage marker mismatch')
          relay.write_text(text.replace(method_marker, method + method_marker, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase4-connector-contracts.yml
      - name: Commit contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Discord Social Turn continuation contracts"
          git push origin HEAD:agent/langgraph-phase-4-social-turn
