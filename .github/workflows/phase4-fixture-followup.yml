name: Phase 4 fixture followup

on:
  push:
    branches:
      - agent/langgraph-phase-4-social-turn
    paths:
      - .github/workflows/phase4-fixture-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-4-social-turn
          fetch-depth: 0
      - name: Patch remaining DiscordDeployment fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'connectors/discord/src/smartFollowUpRouting.test.ts',
              'connectors/discord/src/smartParticipation.test.ts',
              'connectors/discord/src/smartParticipationPortal.test.ts',
              'connectors/discord/src/smartRoutingIntegration.test.ts',
              'connectors/discord/src/webhookManager.test.ts',
          ]
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'orchestration_mode:' in text:
                  continue
              marker = '    webhook_token: null,\n'
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '    orchestration_mode: "off",\n',
                      1,
                  )
              else:
                  marker = '    webhook_token: null\n'
                  if marker not in text:
                      raise SystemExit(f'{name}: webhook token marker not found')
                  text = text.replace(
                      marker,
                      '    webhook_token: null,\n    orchestration_mode: "off"\n',
                      1,
                  )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase4-fixture-followup.yml
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: complete Phase 4 Connector fixture sweep"
          git push origin HEAD:agent/langgraph-phase-4-social-turn
