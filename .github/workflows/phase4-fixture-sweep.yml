name: Phase 4 deployment fixture sweep

on:
  push:
    branches:
      - agent/langgraph-phase-4-social-turn
    paths:
      - .github/workflows/phase4-fixture-sweep.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-4-social-turn
          fetch-depth: 0
      - name: Add orchestration mode to known fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          py = Path('tests/test_discord_connector.py')
          text = py.read_text(encoding='utf-8')
          old = '        "webhook_token": webhook_token,\n'
          if text.count(old) != 1:
              raise SystemExit(f'python fixture marker count: {text.count(old)}')
          py.write_text(
              text.replace(old, old + '        "orchestration_mode": "off",\n', 1),
              encoding='utf-8',
          )

          for name in (
              'connectors/discord/src/routing.test.ts',
              'connectors/discord/src/smartOutput.test.ts',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              marker = '    webhook_token: null,\n' if name.endswith('routing.test.ts') else '    webhook_token: "token"\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'{name}: fixture marker count {text.count(marker)}')
              replacement = (
                  marker.rstrip('\n') + ',\n    orchestration_mode: "off"\n'
                  if name.endswith('smartOutput.test.ts')
                  else marker + '    orchestration_mode: "off",\n'
              )
              path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase4-fixture-sweep.yml
      - name: Commit fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: update Phase 4 deployment fixtures"
          git push origin HEAD:agent/langgraph-phase-4-social-turn
