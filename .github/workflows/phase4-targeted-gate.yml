name: Phase 4 targeted gate

on:
  push:
    branches:
      - agent/langgraph-phase-4-social-turn
    paths:
      - .github/workflows/phase4-targeted-gate.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-4-social-turn
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/echo_masque tests/test_social_turn_graph.py tests/test_social_turn_graph_wiring.py tests/test_character_turn_graph.py tests/test_discord_connector.py
      - run: mypy src/echo_masque
      - run: pytest -q tests/test_social_turn_graph.py tests/test_social_turn_graph_wiring.py tests/test_character_turn_graph.py tests/test_discord_connector.py
      - run: git rm .github/workflows/phase4-targeted-gate.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove Phase 4 targeted gate"
          git push origin HEAD:agent/langgraph-phase-4-social-turn
