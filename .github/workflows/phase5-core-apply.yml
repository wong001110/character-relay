name: Phase 5 durable core apply

on:
  push:
    branches:
      - agent/langgraph-phase-5-durable-runtime
    paths:
      - .github/workflows/phase5-core-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-5-durable-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Phase 5 core
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          # Persistence exports register Phase 5 tables before Database.initialize().
          path = "src/echo_masque/persistence/__init__.py"
          replace(
              path,
              "from echo_masque.persistence.provider_trace_repository import ProviderTraceRepository\n",
              "from echo_masque.persistence.provider_trace_repository import ProviderTraceRepository\n"
              "from echo_masque.persistence.runtime_durability_models import (\n"
              "    RuntimeOperationRecord,\n"
              "    RuntimeSideEffectRecord,\n"
              "    RuntimeStepRecord,\n"
              "    RuntimeTraceEventRecord,\n"
              "    RuntimeTraceRunRecord,\n"
              ")\n"
              "from echo_masque.persistence.runtime_durability_repository import (\n"
              "    DurableRuntimeRepository,\n"
              ")\n",
          )
          replace(
              path,
              '    "DiscordWebhookBindingRecord",\n',
              '    "DiscordWebhookBindingRecord",\n    "DurableRuntimeRepository",\n',
          )
          replace(
              path,
              '    "Repository",\n',
              '    "Repository",\n'
              '    "RuntimeOperationRecord",\n'
              '    "RuntimeSideEffectRecord",\n'
              '    "RuntimeStepRecord",\n'
              '    "RuntimeTraceEventRecord",\n'
              '    "RuntimeTraceRunRecord",\n',
          )

          # RuntimeTraceEvent gains durable correlation/scope fields while remaining content-free.
          path = "src/echo_masque/orchestration/trace.py"
          replace(
              path,
              "    status: TraceEventStatus\n    changed_keys: tuple[str, ...] = ()\n",
              "    status: TraceEventStatus\n"
              "    operation_id: str = \"\"\n"
              "    owner_id: str = \"\"\n"
              "    deployment_id: str = \"\"\n"
              "    character_card_id: str = \"\"\n"
              "    changed_keys: tuple[str, ...] = ()\n",
          )

          # Connector inbound messages carry stable runtime correlation only.
          path = "src/echo_masque/api/connector_schemas.py"
          replace(
              path,
              "    expression_candidates: list[ExpressionCandidate] = Field(default_factory=list, max_length=10)\n",
              "    expression_candidates: list[ExpressionCandidate] = Field(default_factory=list, max_length=10)\n"
              "    runtime_operation_id: str = Field(default=\"\", max_length=64)\n"
              "    runtime_step_id: str = Field(default=\"\", max_length=64)\n",
          )

          # Tool execution context + at-most-once side-effect ledger integration.
          path = "src/echo_masque/tool_runtime.py"
          replace(path, "import ast\n", "import ast\nimport hashlib\n")
          replace(path, "from typing import Literal\n", "from typing import Literal, Protocol\n")
          replace(
              path,
              "    initiator_user_id: str = \"\"\n\n\n@dataclass(frozen=True)\nclass RegisteredTool:\n",
              "    initiator_user_id: str = \"\"\n"
              "    operation_id: str = \"\"\n"
              "    step_id: str = \"\"\n\n\n"
              "class SideEffectIdempotencyStore(Protocol):\n"
              "    def claim_side_effect(\n"
              "        self,\n"
              "        *,\n"
              "        operation_id: str,\n"
              "        step_id: str,\n"
              "        deployment_id: str,\n"
              "        tool_id: str,\n"
              "        arguments_hash: str,\n"
              "    ) -> tuple[str, str, str, dict[str, object]]: ...\n\n"
              "    def complete_side_effect(\n"
              "        self,\n"
              "        *,\n"
              "        idempotency_key: str,\n"
              "        content: str,\n"
              "        trace: dict[str, object],\n"
              "    ) -> None: ...\n\n\n"
              "@dataclass(frozen=True)\nclass RegisteredTool:\n",
          )
          replace(
              path,
              "        url_guard: PublicUrlGuard | None = None,\n    ) -> None:\n",
              "        url_guard: PublicUrlGuard | None = None,\n"
              "        side_effect_store: SideEffectIdempotencyStore | None = None,\n"
              "    ) -> None:\n",
          )
          replace(
              path,
              "        self.reminders = reminder_repository\n        self.external = ExternalToolRuntime(\n",
              "        self.reminders = reminder_repository\n"
              "        self.side_effect_store = side_effect_store\n"
              "        self.external = ExternalToolRuntime(\n",
          )
          target = Path(path)
          text = target.read_text(encoding="utf-8")
          start = text.index("    async def execute(\n")
          end = text.index("    async def _execute_tool(\n", start)
          method = '''    async def execute(\n        self,\n        call: ChatToolCall,\n        *,\n        enabled_tool_ids: tuple[str, ...],\n        context: ToolExecutionContext,\n        allow_side_effect: bool = True,\n    ) -> ToolExecutionResult:\n        started = perf_counter()\n        registered = self._by_provider_name.get(call.function.name)\n        if registered is None:\n            return self._error_result(\n                tool_id=call.function.name,\n                status="rejected",\n                error="unknown_tool",\n                started=started,\n            )\n        tool_id = registered.catalog.id\n        if tool_id not in set(self._normalized_ids(enabled_tool_ids)):\n            return self._error_result(\n                tool_id=tool_id,\n                status="rejected",\n                error="tool_not_assigned_to_deployment",\n                started=started,\n            )\n        if not registered.catalog.available:\n            return self._error_result(\n                tool_id=tool_id,\n                status="rejected",\n                error="tool_provider_not_configured",\n                started=started,\n            )\n        if registered.catalog.side_effect and not allow_side_effect:\n            return self._error_result(\n                tool_id=tool_id,\n                status="rejected",\n                error="side_effect_limit_reached",\n                started=started,\n            )\n\n        try:\n            raw_arguments = json.loads(call.function.arguments or "{}")\n            if not isinstance(raw_arguments, dict):\n                raise ValueError("Tool arguments must be a JSON object.")\n            arguments = {str(key): value for key, value in raw_arguments.items()}\n        except (json.JSONDecodeError, ValueError, TypeError) as exc:\n            return self._error_result(\n                tool_id=tool_id,\n                status="rejected",\n                error=str(exc)[:300],\n                started=started,\n            )\n\n        idempotency_key = ""\n        if (\n            registered.catalog.side_effect\n            and self.side_effect_store is not None\n            and context.operation_id\n            and context.step_id\n        ):\n            canonical = json.dumps(\n                arguments,\n                ensure_ascii=False,\n                sort_keys=True,\n                separators=(",", ":"),\n            )\n            arguments_hash = hashlib.sha256(canonical.encode("utf-8")).hexdigest()\n            claim, idempotency_key, replay_content, replay_trace = (\n                self.side_effect_store.claim_side_effect(\n                    operation_id=context.operation_id,\n                    step_id=context.step_id,\n                    deployment_id=context.deployment_id,\n                    tool_id=tool_id,\n                    arguments_hash=arguments_hash,\n                )\n            )\n            if claim == "replay":\n                try:\n                    trace = ToolExecutionTrace.model_validate(replay_trace)\n                except ValidationError:\n                    trace = ToolExecutionTrace(tool_id=tool_id, status="completed")\n                return ToolExecutionResult(content=replay_content, trace=trace)\n            if claim != "granted":\n                return self._error_result(\n                    tool_id=tool_id,\n                    status="rejected",\n                    error="side_effect_execution_uncertain",\n                    started=started,\n                )\n\n        try:\n            content = await self._execute_tool(tool_id, arguments, context)\n            result = ToolExecutionResult(\n                content=content,\n                trace=ToolExecutionTrace(\n                    tool_id=tool_id,\n                    status="completed",\n                    duration_ms=round((perf_counter() - started) * 1000),\n                ),\n            )\n        except (\n            ValidationError,\n            ExternalToolRejected,\n            ValueError,\n            TypeError,\n            KeyError,\n        ) as exc:\n            result = self._error_result(\n                tool_id=tool_id,\n                status="rejected",\n                error=str(exc)[:300],\n                started=started,\n            )\n        except (ExternalToolFailed, BrowserToolUnavailable) as exc:\n            result = self._error_result(\n                tool_id=tool_id,\n                status="failed",\n                error=str(exc)[:300],\n                started=started,\n            )\n\n        if idempotency_key and self.side_effect_store is not None:\n            self.side_effect_store.complete_side_effect(\n                idempotency_key=idempotency_key,\n                content=result.content,\n                trace=result.trace.model_dump(),\n            )\n        return result\n\n'''
          target.write_text(text[:start] + method + text[end:], encoding="utf-8")

          # Propagate durable IDs into ToolExecutionContext.
          path = "src/echo_masque/connector_runtime.py"
          replace(
              path,
              "            initiator_user_id=payload.author_id,\n        )\n",
              "            initiator_user_id=payload.author_id,\n"
              "            operation_id=payload.runtime_operation_id,\n"
              "            step_id=payload.runtime_step_id,\n"
              "        )\n",
          )

          # Social Turn request/response durable fields.
          path = "src/echo_masque/api/social_turn_schemas.py"
          replace(
              path,
              "    cursor: DiscordSocialTurnCursor | None = None\n\n\nclass DiscordSocialTurnStepView(BaseModel):\n",
              "    cursor: DiscordSocialTurnCursor | None = None\n"
              "    operation_id: str = Field(default=\"\", max_length=64)\n"
              "    runtime_step_id: str = Field(default=\"\", max_length=64)\n\n\n"
              "class DiscordSocialTurnStepView(BaseModel):\n",
          )
          replace(
              path,
              "    mentioned_character_deployment_ids: list[str] = Field(default_factory=list)\n",
              "    mentioned_character_deployment_ids: list[str] = Field(default_factory=list)\n"
              "    operation_id: str = \"\"\n"
              "    step_id: str = \"\"\n"
              "    step_index: int = 0\n"
              "    durable_status: Literal[\"none\", \"generated\", \"replayed\", \"delivered\"] = \"none\"\n"
              "    delivery_required: bool = False\n",
          )

          # Character Turn trace correlation.
          path = "src/echo_masque/orchestration/character_turn_graph.py"
          replace(
              path,
              "    orchestration_version: str\n    status: GraphStatus\n",
              "    orchestration_version: str\n    operation_id: str\n    status: GraphStatus\n",
          )
          replace(
              path,
              "            status=status,\n            changed_keys=changed_keys,\n",
              "            status=status,\n"
              "            operation_id=state.get(\"operation_id\", \"\"),\n"
              "            owner_id=state.get(\"owner_id\", \"\"),\n"
              "            deployment_id=state.get(\"deployment_id\", \"\"),\n"
              "            character_card_id=state.get(\"character_card_id\", \"\"),\n"
              "            changed_keys=changed_keys,\n",
          )
          replace(
              path,
              '            "orchestration_version": context.orchestration_version,\n            "status": "pending",\n',
              '            "orchestration_version": context.orchestration_version,\n'
              '            "operation_id": payload.runtime_operation_id,\n'
              '            "status": "pending",\n',
          )

          # Social Turn uses Core operation/step IDs when invoking Character Turn.
          path = "src/echo_masque/orchestration/social_turn_graph.py"
          replace(
              path,
              "    orchestration_version: str\n    status: SocialGraphStatus\n",
              "    orchestration_version: str\n    operation_id: str\n    status: SocialGraphStatus\n",
          )
          replace(
              path,
              "            status=status,\n            changed_keys=changed_keys,\n",
              "            status=status,\n"
              "            operation_id=state.get(\"operation_id\", \"\"),\n"
              "            deployment_id=state.get(\"current_deployment_id\", \"\"),\n"
              "            changed_keys=changed_keys,\n",
          )
          replace(
              path,
              "        result = await context.character_runner.run(context.request.payload)\n",
              "        character_payload = context.request.payload.model_copy(\n"
              "            update={\n"
              "                \"runtime_operation_id\": context.request.operation_id,\n"
              "                \"runtime_step_id\": context.request.runtime_step_id,\n"
              "            }\n"
              "        )\n"
              "        result = await context.character_runner.run(character_payload)\n",
          )
          replace(
              path,
              '            "orchestration_version": context.orchestration_version,\n            "status": "pending",\n',
              '            "orchestration_version": context.orchestration_version,\n'
              '            "operation_id": request.operation_id,\n'
              '            "status": "pending",\n',
          )

          # Condition Watch joins the durable Runtime Trace sink without adding private state.
          path = "src/echo_masque/orchestration/condition_watch_graph.py"
          replace(
              path,
              "            status=status,\n            changed_keys=changed_keys,\n",
              "            status=status,\n"
              "            owner_id=context.watch.owner_id,\n"
              "            deployment_id=context.watch.deployment_id,\n"
              "            changed_keys=changed_keys,\n",
          )

          # API route exports.
          path = "src/echo_masque/api/routes/__init__.py"
          replace(
              path,
              "from echo_masque.api.routes.reports import router as reports_router\n",
              "from echo_masque.api.routes.reports import router as reports_router\n"
              "from echo_masque.api.routes.runtime_traces import router as runtime_traces_router\n",
          )
          replace(
              path,
              '    "reports_router",\n',
              '    "reports_router",\n    "runtime_traces_router",\n',
          )

          # FastAPI wiring: one durable repository, no new environment variables.
          path = "src/echo_masque/api/__init__.py"
          replace(
              path,
              "    reports_router,\n    scheduled_reminders_router,\n",
              "    reports_router,\n    runtime_traces_router,\n    scheduled_reminders_router,\n",
          )
          replace(
              path,
              "    DiscordIdentityRepository,\n    EvaluationRepository,\n",
              "    DiscordIdentityRepository,\n    DurableRuntimeRepository,\n    EvaluationRepository,\n",
          )
          replace(
              path,
              "    condition_watch_repository = ConditionWatchRepository(database)\n    browser_runtime = BrowserCapabilityManager(\n",
              "    condition_watch_repository = ConditionWatchRepository(database)\n"
              "    durable_runtime_repository = DurableRuntimeRepository(database)\n"
              "    browser_runtime = BrowserCapabilityManager(\n",
          )
          replace(
              path,
              "        discord_bot_token=resolved.discord_tool_bot_token,\n    )\n    interaction_repository = InteractionRepository(database)\n",
              "        discord_bot_token=resolved.discord_tool_bot_token,\n"
              "        side_effect_store=durable_runtime_repository,\n"
              "    )\n"
              "    interaction_repository = InteractionRepository(database)\n",
          )
          replace(
              path,
              "            notifier=condition_watch_notifier,\n        )\n",
              "            notifier=condition_watch_notifier,\n"
              "            trace_sink=durable_runtime_repository,\n"
              "        )\n",
          )
          replace(
              path,
              "        CharacterTurnGraphRunner(discord_connector_runtime)\n",
              "        CharacterTurnGraphRunner(\n"
              "            discord_connector_runtime,\n"
              "            trace_sink=durable_runtime_repository,\n"
              "        )\n",
          )
          replace(
              path,
              "        SocialTurnGraphRunner(character_turn_graph_runner)\n",
              "        SocialTurnGraphRunner(\n"
              "            character_turn_graph_runner,\n"
              "            trace_sink=durable_runtime_repository,\n"
              "        )\n",
          )
          replace(
              path,
              "    app.state.provider_trace_repository = provider_trace_repository\n",
              "    app.state.provider_trace_repository = provider_trace_repository\n"
              "    app.state.durable_runtime_repository = durable_runtime_repository\n",
          )
          replace(
              path,
              "    app.include_router(provider_traces_router)\n",
              "    app.include_router(provider_traces_router)\n"
              "    app.include_router(runtime_traces_router)\n",
          )

          # Durable Social Turn connector endpoints and step replay wrapper.
          path = "src/echo_masque/api/routes/connectors.py"
          replace(
              path,
              "from echo_masque.api.social_turn_schemas import (\n    DiscordSocialTurnStepRequest,\n    DiscordSocialTurnStepView,\n)\n",
              "from echo_masque.api.social_turn_schemas import (\n"
              "    DiscordSocialTurnCursor,\n"
              "    DiscordSocialTurnStepRequest,\n"
              "    DiscordSocialTurnStepView,\n"
              ")\n"
              "from echo_masque.api.runtime_durability_schemas import (\n"
              "    DiscordDeliveryAckRequest,\n"
              "    DiscordDeliveryClaimRequest,\n"
              "    DiscordDeliveryClaimView,\n"
              "    DiscordDeliveryFailureRequest,\n"
              "    DiscordPendingSocialOperation,\n"
              "    DiscordSocialOperationClaimRequest,\n"
              "    DiscordSocialOperationView,\n"
              ")\n",
          )
          replace(
              path,
              "    DeploymentRepository,\n    DiscordIdentityRepository,\n",
              "    DeploymentRepository,\n    DiscordIdentityRepository,\n    DurableRuntimeRepository,\n",
          )
          marker = '''def social_turn_graph_runner(request: Request) -> SocialTurnGraphRunner | None:\n    return cast(\n        SocialTurnGraphRunner | None,\n        request.app.state.social_turn_graph_runner,\n    )\n'''
          replacement = marker + '''\n\ndef durable_runtime_repository(request: Request) -> DurableRuntimeRepository:\n    return cast(DurableRuntimeRepository, request.app.state.durable_runtime_repository)\n'''
          replace(path, marker, replacement)

          target = Path(path)
          text = target.read_text(encoding="utf-8")
          route_marker = '@router.post("/social-turns/step", response_model=DiscordSocialTurnStepView)\n'
          insert_at = text.index(route_marker)
          endpoints = '''@router.post(\n    "/social-turns/operations/claim",\n    response_model=DiscordSocialOperationView,\n)\ndef claim_social_turn_operation(\n    payload: DiscordSocialOperationClaimRequest,\n    request: Request,\n    authorization: Annotated[str | None, Header()] = None,\n) -> DiscordSocialOperationView:\n    _authorize_connector(request, authorization)\n    deployments = deployment_repository(request)\n    records = deployments.list_connector_deployments(\n        platform="discord",\n        connection_id=payload.connection_id,\n    )\n    first = next(\n        (item for item in records if item.id == payload.initial_deployment_ids[0]),\n        None,\n    )\n    if first is None:\n        raise HTTPException(status_code=404, detail="Initial Social Turn deployment is unavailable.")\n    try:\n        record = durable_runtime_repository(request).claim_social_operation(\n            operation_id=payload.operation_id,\n            owner_id=first.owner_id,\n            connection_id=payload.connection_id,\n            guild_id=payload.guild_id,\n            channel_id=payload.channel_id,\n            thread_id=payload.thread_id,\n            source_message_id=payload.source_message_id,\n            initial_deployment_ids=payload.initial_deployment_ids,\n            available_deployment_ids=payload.available_deployment_ids,\n            continuation_budget=payload.continuation_budget,\n            max_depth=payload.max_depth,\n        )\n    except ValueError as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n    return DiscordSocialOperationView.from_record(record)\n\n\n@router.get(\n    "/social-turns/operations/pending",\n    response_model=list[DiscordPendingSocialOperation],\n)\ndef pending_social_turn_operations(\n    request: Request,\n    connection_id: str = Query(min_length=1, max_length=64),\n    authorization: Annotated[str | None, Header()] = None,\n) -> list[DiscordPendingSocialOperation]:\n    _authorize_connector(request, authorization)\n    records = durable_runtime_repository(request).pending_social_operations(\n        connection_id=connection_id,\n        limit=20,\n    )\n    return [DiscordPendingSocialOperation.from_record(item) for item in records]\n\n\n@router.post(\n    "/social-turns/delivery/claim",\n    response_model=DiscordDeliveryClaimView,\n)\ndef claim_social_turn_delivery(\n    payload: DiscordDeliveryClaimRequest,\n    request: Request,\n    authorization: Annotated[str | None, Header()] = None,\n) -> DiscordDeliveryClaimView:\n    _authorize_connector(request, authorization)\n    repository = durable_runtime_repository(request)\n    operation = repository.get_operation(payload.operation_id)\n    if operation is None or operation.connection_id != payload.connection_id:\n        raise HTTPException(status_code=404, detail="Durable Social Turn operation not found.")\n    try:\n        claim_status, _step = repository.claim_delivery(\n            operation_id=payload.operation_id,\n            step_id=payload.step_id,\n            claim_nonce=payload.claim_nonce,\n        )\n    except (KeyError, ValueError) as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n    refreshed = repository.get_operation(payload.operation_id)\n    if refreshed is None:\n        raise HTTPException(status_code=404, detail="Durable Social Turn operation not found.")\n    return DiscordDeliveryClaimView(\n        claim_status=claim_status,\n        operation_status=refreshed.status,\n        operation_id=payload.operation_id,\n        step_id=payload.step_id,\n    )\n\n\n@router.post(\n    "/social-turns/delivery/ack",\n    response_model=DiscordSocialOperationView,\n)\ndef acknowledge_social_turn_delivery(\n    payload: DiscordDeliveryAckRequest,\n    request: Request,\n    authorization: Annotated[str | None, Header()] = None,\n) -> DiscordSocialOperationView:\n    _authorize_connector(request, authorization)\n    repository = durable_runtime_repository(request)\n    operation = repository.get_operation(payload.operation_id)\n    if operation is None or operation.connection_id != payload.connection_id:\n        raise HTTPException(status_code=404, detail="Durable Social Turn operation not found.")\n    try:\n        updated = repository.acknowledge_delivery(\n            operation_id=payload.operation_id,\n            step_id=payload.step_id,\n            claim_nonce=payload.claim_nonce,\n            cursor_json=payload.cursor.model_dump_json(),\n            sent_message_ids=payload.sent_message_ids,\n            outgoing_text=payload.outgoing_text,\n            applied=payload.applied,\n            deployment_id=payload.deployment_id,\n        )\n    except (KeyError, ValueError) as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n    return DiscordSocialOperationView.from_record(updated)\n\n\n@router.post(\n    "/social-turns/delivery/uncertain",\n    status_code=status.HTTP_204_NO_CONTENT,\n)\ndef mark_social_turn_delivery_uncertain(\n    payload: DiscordDeliveryFailureRequest,\n    request: Request,\n    authorization: Annotated[str | None, Header()] = None,\n) -> None:\n    _authorize_connector(request, authorization)\n    repository = durable_runtime_repository(request)\n    operation = repository.get_operation(payload.operation_id)\n    if operation is None or operation.connection_id != payload.connection_id:\n        raise HTTPException(status_code=404, detail="Durable Social Turn operation not found.")\n    repository.mark_delivery_uncertain(\n        operation_id=payload.operation_id,\n        step_id=payload.step_id,\n        claim_nonce=payload.claim_nonce,\n        error=payload.error,\n    )\n\n\n'''
          text = text[:insert_at] + endpoints + text[insert_at:]
          start = text.index(route_marker, insert_at + len(endpoints))
          function_end = text.index('\n@router.post("/messages"', start)
          old_function = text[start:function_end]
          new_function = '''@router.post("/social-turns/step", response_model=DiscordSocialTurnStepView)\nasync def process_social_turn_step(\n    payload: DiscordSocialTurnStepRequest,\n    request: Request,\n    authorization: Annotated[str | None, Header()] = None,\n) -> DiscordSocialTurnStepView:\n    _authorize_connector(request, authorization)\n    runner = social_turn_graph_runner(request)\n    if runner is None:\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail="Social Turn LangGraph orchestration is not enabled.",\n        )\n    if not payload.operation_id:\n        try:\n            return await runner(payload)\n        except ConnectorRuntimeError as exc:\n            raise HTTPException(status_code=409, detail=str(exc)) from exc\n        except ValueError as exc:\n            raise HTTPException(status_code=409, detail=str(exc)) from exc\n\n    repository = durable_runtime_repository(request)\n    operation = repository.get_operation(payload.operation_id)\n    if operation is None or operation.connection_id != payload.payload.connection_id:\n        raise HTTPException(status_code=409, detail="Durable Social Turn operation was not claimed.")\n    if operation.status == "completed":\n        raise HTTPException(status_code=409, detail="Durable Social Turn operation is completed.")\n    if operation.status == "uncertain":\n        raise HTTPException(\n            status_code=409,\n            detail="Durable Social Turn operation requires delivery reconciliation.",\n        )\n\n    checkpoint = DiscordSocialTurnCursor.model_validate_json(operation.cursor_json)\n    if not checkpoint.pending_turns:\n        raise HTTPException(status_code=409, detail="Durable Social Turn checkpoint is complete.")\n    current = checkpoint.pending_turns[0]\n    if payload.payload.deployment_id != current.deployment_id:\n        raise HTTPException(status_code=409, detail="Social Turn payload is stale for its checkpoint.")\n    request_hash = repository.stable_hash(\n        payload.operation_id,\n        checkpoint.step_index,\n        current.deployment_id,\n    )\n    try:\n        preparation, step = repository.prepare_social_step(\n            operation_id=payload.operation_id,\n            step_index=checkpoint.step_index,\n            deployment_id=current.deployment_id,\n            request_hash=request_hash,\n        )\n    except RuntimeError as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n    except ValueError as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n\n    if preparation == "replay":\n        cached = DiscordSocialTurnStepView.model_validate_json(step.response_json)\n        return cached.model_copy(update={"durable_status": "replayed"})\n    if preparation == "in_progress":\n        raise HTTPException(status_code=503, detail="Durable Social Turn generation is in progress.")\n    if preparation == "uncertain":\n        raise HTTPException(status_code=409, detail="Durable Social Turn step is uncertain.")\n\n    run_request = payload.model_copy(\n        update={\n            "cursor": checkpoint,\n            "runtime_step_id": step.step_id,\n        }\n    )\n    try:\n        view = await runner(run_request)\n    except Exception as exc:\n        repository.fail_social_step(step.step_id, str(exc))\n        if isinstance(exc, (ConnectorRuntimeError, ValueError)):\n            raise HTTPException(status_code=409, detail=str(exc)) from exc\n        raise\n\n    smart_output = view.reply.smart_output\n    delivery_required = not (\n        view.reply.action == "silent"\n        or (smart_output is not None and smart_output.action == "ignore")\n        or (\n            smart_output is None\n            and not view.reply.text\n            and view.reply.expression.action == "none"\n        )\n    )\n    durable_view = view.model_copy(\n        update={\n            "operation_id": payload.operation_id,\n            "step_id": step.step_id,\n            "step_index": checkpoint.step_index,\n            "durable_status": "generated",\n            "delivery_required": delivery_required,\n        }\n    )\n    repository.complete_social_step_generation(\n        step_id=step.step_id,\n        response_json=durable_view.model_dump_json(),\n        cursor_json=durable_view.cursor.model_dump_json(),\n        delivery_required=delivery_required,\n    )\n    return durable_view\n\n'''
          text = text[:start] + new_function + text[function_end:]
          target.write_text(text, encoding="utf-8")
          PY
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Normalize and validate Python core
        run: |
          ruff check --fix src/echo_masque
          ruff check src/echo_masque
          mypy src/echo_masque
          pytest -q tests/test_character_turn_graph.py tests/test_social_turn_graph.py tests/test_social_turn_graph_wiring.py tests/test_provider_trace_scope.py
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase5-core-apply.yml
      - name: Commit Phase 5 core slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Phase 5 durable runtime core"
          git push origin HEAD:agent/langgraph-phase-5-durable-runtime
