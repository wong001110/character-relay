name: Phase 5 durability regressions v2

on:
  push:
    branches:
      - agent/langgraph-phase-5-durable-runtime
    paths:
      - .github/workflows/phase5-durability-tests.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-5-durable-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Python durability
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/echo_masque tests/test_runtime_durability.py
          mypy src/echo_masque
          pytest -q tests/test_runtime_durability.py tests/test_character_turn_graph.py tests/test_social_turn_graph.py tests/test_social_turn_graph_wiring.py
      - name: Validate Discord durability
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove targeted workflow
        run: |
          git rm .github/workflows/phase5-durability-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove Phase 5 durability gate"
          git push origin HEAD:agent/langgraph-phase-5-durable-runtime
