name: Phase 5 durability regressions v3

on:
  push:
    branches:
      - agent/langgraph-phase-5-durable-runtime
    paths:
      - .github/workflows/phase5-durability-v3.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-5-durable-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove persistence to orchestration dependency
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/echo_masque/persistence/runtime_durability_repository.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from typing import Literal\n', 'from typing import Literal, Protocol\n', 1)
          text = text.replace('from echo_masque.orchestration.trace import RuntimeTraceEvent\n', '', 1)
          marker = 'StepPreparationStatus = Literal["execute", "replay", "in_progress", "uncertain"]\n\n\n'
          protocol = '''StepPreparationStatus = Literal["execute", "replay", "in_progress", "uncertain"]\n\n\nclass RuntimeTraceEventInput(Protocol):\n    trace_id: str\n    graph_run_id: str\n    graph_name: str\n    node_name: str\n    node_kind: str\n    status: str\n    operation_id: str\n    owner_id: str\n    deployment_id: str\n    character_card_id: str\n    changed_keys: tuple[str, ...]\n    metadata: tuple[tuple[str, str], ...]\n    error: str\n\n\n'''
          if marker not in text:
              raise SystemExit('trace protocol marker not found')
          text = text.replace(marker, protocol, 1)
          text = text.replace(
              '    def emit(self, event: RuntimeTraceEvent) -> None:',
              '    def emit(self, event: RuntimeTraceEventInput) -> None:',
              1,
          )
          text = text.replace(
              '    def _final_completed_event(event: RuntimeTraceEvent) -> bool:',
              '    def _final_completed_event(event: RuntimeTraceEventInput) -> bool:',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_runtime_durability.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom types import SimpleNamespace\n', 1)
          text = text.replace('from echo_masque.orchestration.trace import RuntimeTraceEvent\n', '', 1)
          text = text.replace('RuntimeTraceEvent(', 'SimpleNamespace(')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Python durability
        run: |
          python -m pip install -e '.[dev]'
          ruff check --fix src/echo_masque tests/test_runtime_durability.py tests/test_runtime_trace_portal.py
          ruff check src/echo_masque tests/test_runtime_durability.py tests/test_runtime_trace_portal.py
          mypy src/echo_masque
          pytest -q tests/test_runtime_durability.py tests/test_runtime_trace_portal.py tests/test_character_turn_graph.py tests/test_social_turn_graph.py tests/test_social_turn_graph_wiring.py
      - name: Validate Discord durability
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove targeted workflows
        run: |
          git rm .github/workflows/phase5-durability-tests.yml
          git rm .github/workflows/phase5-durability-v3.yml
      - name: Commit durability boundary fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep durable persistence independent of orchestration"
          git push origin HEAD:agent/langgraph-phase-5-durable-runtime
