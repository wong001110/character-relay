name: Phase 5 durability regressions v4

on:
  push:
    branches:
      - agent/langgraph-phase-5-durable-runtime
    paths:
      - .github/workflows/phase5-durability-v4.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-5-durable-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Point persistence and tests at neutral trace contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/echo_masque/persistence/runtime_durability_repository.py')
          text = path.read_text(encoding='utf-8').replace(
              'from echo_masque.orchestration.trace import RuntimeTraceEvent\n',
              'from echo_masque.runtime_trace import RuntimeTraceEvent\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          for name in ('tests/test_runtime_durability.py', 'tests/test_runtime_trace_portal.py'):
              path = Path(name)
              text = path.read_text(encoding='utf-8').replace(
                  'from echo_masque.orchestration.trace import RuntimeTraceEvent\n',
                  'from echo_masque.runtime_trace import RuntimeTraceEvent\n',
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Python durability
        run: |
          python -m pip install -e '.[dev]'
          ruff check --fix src/echo_masque tests/test_runtime_durability.py tests/test_runtime_trace_portal.py
          ruff check src/echo_masque tests/test_runtime_durability.py tests/test_runtime_trace_portal.py
          mypy src/echo_masque
          pytest -q tests/test_runtime_durability.py tests/test_runtime_trace_portal.py tests/test_character_turn_graph.py tests/test_social_turn_graph.py tests/test_social_turn_graph_wiring.py
      - name: Validate Discord durability
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove targeted workflows
        run: |
          git rm .github/workflows/phase5-durability-tests.yml
          git rm .github/workflows/phase5-durability-v3.yml
          git rm .github/workflows/phase5-durability-v4.yml
      - name: Commit neutral trace contract wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: share Runtime Trace contract across layers"
          git push origin HEAD:agent/langgraph-phase-5-durable-runtime
