name: Phase 5 durable safety finalize

on:
  push:
    branches:
      - agent/langgraph-phase-5-durable-runtime
    paths:
      - .github/workflows/phase5-safety-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-5-durable-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch final safety invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:140]!r}')
              target.write_text(text.replace(old, new, count), encoding='utf-8')

          # One side-effect slot per Character step. If a crash causes the model to propose
          # a different Tool or arguments, fail closed rather than execute a second effect.
          path = 'src/echo_masque/persistence/runtime_durability_repository.py'
          old = '''        key = self.stable_hash(\n            "tool-side-effect-v1",\n            operation_id,\n            step_id,\n            deployment_id,\n            tool_id,\n            arguments_hash,\n        )\n        with self.database.session() as session:\n            record = session.get(RuntimeSideEffectRecord, key)\n            if record is None:\n                record = RuntimeSideEffectRecord(\n                    idempotency_key=key,\n                    operation_id=operation_id,\n                    step_id=step_id,\n                    deployment_id=deployment_id,\n                    tool_id=tool_id,\n                    arguments_hash=arguments_hash,\n                    status="claimed",\n                )\n                session.add(record)\n                session.commit()\n                return "granted", key, "", {}\n            if record.status == "completed":\n                return "replay", key, record.content, self._object(record.trace_json)\n            return "uncertain", key, "", {}\n'''
          new = '''        key = self.stable_hash(\n            "tool-side-effect-slot-v2",\n            operation_id,\n            step_id,\n            deployment_id,\n        )\n        with self.database.session() as session:\n            record = session.get(RuntimeSideEffectRecord, key)\n            if record is None:\n                record = RuntimeSideEffectRecord(\n                    idempotency_key=key,\n                    operation_id=operation_id,\n                    step_id=step_id,\n                    deployment_id=deployment_id,\n                    tool_id=tool_id,\n                    arguments_hash=arguments_hash,\n                    status="claimed",\n                )\n                session.add(record)\n                session.commit()\n                return "granted", key, "", {}\n            if record.tool_id != tool_id or record.arguments_hash != arguments_hash:\n                return "uncertain", key, "", {}\n            if record.status == "completed":\n                return "replay", key, record.content, self._object(record.trace_json)\n            return "uncertain", key, "", {}\n'''
          replace(path, old, new)

          # Early-silent Character Turns end at turn_resolve; don't leave their trace "running".
          old = '''        if event.status != "completed":\n            return False\n        return event.node_name in {\n'''
          new = '''        if event.status != "completed":\n            return False\n        if event.node_name == "turn_resolve":\n            return any(key == "result" for key, _value in event.metadata)\n        return event.node_name in {\n'''
          replace(path, old, new)

          # A thread source message belongs to the thread channel, not necessarily its parent.
          path = 'connectors/discord/src/index.ts'
          replace(
              path,
              '      const channel = await guild.channels.fetch(operation.channel_id);\n',
              '      const sourceChannelId = operation.thread_id || operation.channel_id;\n'
              '      const channel = await guild.channels.fetch(sourceChannelId);\n',
          )

          # Regression: a changed side-effect proposal under the same durable step must not execute.
          path = 'tests/test_runtime_durability.py'
          target = Path(path)
          text = target.read_text(encoding='utf-8')
          marker = '''    assert replay_key == key\n    assert "reminder-1" in content\n    assert trace["status"] == "completed"\n\n    pending, uncertain_key, _, _ = runtime.claim_side_effect(\n'''
          addition = '''    assert replay_key == key\n    assert "reminder-1" in content\n    assert trace["status"] == "completed"\n\n    changed_arguments, changed_key, _, _ = runtime.claim_side_effect(\n        operation_id=operation.operation_id,\n        step_id=step_id,\n        deployment_id="ann",\n        tool_id="scheduler.remind",\n        arguments_hash="args-changed-after-crash",\n    )\n    assert changed_arguments == "uncertain"\n    assert changed_key == key\n\n    changed_tool, changed_tool_key, _, _ = runtime.claim_side_effect(\n        operation_id=operation.operation_id,\n        step_id=step_id,\n        deployment_id="ann",\n        tool_id="watch.condition",\n        arguments_hash="args-2",\n    )\n    assert changed_tool == "uncertain"\n    assert changed_tool_key == key\n\n    other_step_id = runtime.social_step_id(operation.operation_id, 1, "ann")\n    pending, uncertain_key, _, _ = runtime.claim_side_effect(\n'''
          if marker not in text:
              raise SystemExit('side effect test marker not found')
          text = text.replace(marker, addition, 1)
          text = text.replace(
              '        step_id=step_id,\n        deployment_id="ann",\n        tool_id="watch.condition",\n        arguments_hash="args-2",\n    )\n    assert pending == "granted"\n\n    restarted = DurableRuntimeRepository(database)\n    uncertain, same_key, _, _ = restarted.claim_side_effect(\n        operation_id=operation.operation_id,\n        step_id=step_id,',
              '        step_id=other_step_id,\n        deployment_id="ann",\n        tool_id="watch.condition",\n        arguments_hash="args-2",\n    )\n    assert pending == "granted"\n\n    restarted = DurableRuntimeRepository(database)\n    uncertain, same_key, _, _ = restarted.claim_side_effect(\n        operation_id=operation.operation_id,\n        step_id=other_step_id,',
              1,
          )

          # Regression: early silent graph terminal event is persisted as completed.
          append = '''\n\ndef test_early_silent_character_trace_is_completed(tmp_path: Path) -> None:\n    _database, runtime = repository(tmp_path / "durable-early-silent-trace.db")\n    runtime.emit(\n        RuntimeTraceEvent(\n            trace_id="trace-silent",\n            graph_run_id="graph-run-silent",\n            graph_name="character_turn",\n            node_name="turn_resolve",\n            node_kind="decision",\n            status="completed",\n            deployment_id="ann",\n            changed_keys=("resolve_status", "status", "outcome", "deployment_id"),\n            metadata=(("result", "trigger_not_matched"),),\n        )\n    )\n    record = runtime.get_trace_run("graph-run-silent")\n    assert record is not None\n    assert record.status == "completed"\n'''
          if 'def test_early_silent_character_trace_is_completed' not in text:
              text += append
          target.write_text(text, encoding='utf-8')
          PY
      - name: Validate final safety slice
        run: |
          python -m pip install -e '.[dev]'
          ruff check --fix src/echo_masque tests/test_runtime_durability.py
          ruff check src/echo_masque tests/test_runtime_durability.py
          mypy src/echo_masque
          pytest -q tests/test_runtime_durability.py tests/test_runtime_trace_portal.py tests/test_character_turn_graph.py tests/test_social_turn_graph.py
          cd connectors/discord
          npm install
          npm run typecheck
          npm test
          npm run build
          cd ../..
      - name: Remove one-shot workflow and build artifacts
        run: |
          git rm .github/workflows/phase5-safety-finalize.yml
          rm -f connectors/discord/package-lock.json web/package-lock.json web/tsconfig.tsbuildinfo
      - name: Commit final safety invariants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close Phase 5 durable crash windows"
          git push origin HEAD:agent/langgraph-phase-5-durable-runtime
