name: Phase 5 Runtime Trace UI apply

on:
  push:
    branches:
      - agent/langgraph-phase-5-durable-runtime
    paths:
      - .github/workflows/phase5-ui-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/langgraph-phase-5-durable-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Toolbox integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/PortalToolbox.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import { ProviderTraceViewer } from "./ProviderTraceViewer";\n',
              'import { ProviderTraceViewer } from "./ProviderTraceViewer";\n'
              'import { runtimeTraceApi } from "./runtimeTraceApi";\n'
              'import { RuntimeTraceViewer } from "./RuntimeTraceViewer";\n',
              1,
          )
          text = text.replace(
              'type ToolboxSection = "actions" | "schedule" | "account" | "provider" | "tooltest";',
              'type ToolboxSection =\n'
              '  | "actions"\n'
              '  | "schedule"\n'
              '  | "account"\n'
              '  | "provider"\n'
              '  | "runtime"\n'
              '  | "tooltest";',
              1,
          )
          text = text.replace(
              '  const [providerTraceAllowed, setProviderTraceAllowed] = useState(false);\n',
              '  const [providerTraceAllowed, setProviderTraceAllowed] = useState(false);\n'
              '  const [runtimeTraceAllowed, setRuntimeTraceAllowed] = useState(false);\n',
              1,
          )
          marker = '''  useEffect(() => {\n    if (user.role !== "admin" || publicDemo) {\n      setProviderTraceAllowed(false);\n      return;\n    }\n    const controller = new AbortController();\n    void providerTraceApi\n      .access(controller.signal)\n      .then(() => setProviderTraceAllowed(true))\n      .catch(() => {\n        if (!controller.signal.aborted) setProviderTraceAllowed(false);\n      });\n    return () => controller.abort();\n  }, [user.id, user.role, publicDemo]);\n'''
          addition = marker + '''\n  useEffect(() => {\n    if (user.role !== "admin" || publicDemo) {\n      setRuntimeTraceAllowed(false);\n      return;\n    }\n    const controller = new AbortController();\n    void runtimeTraceApi\n      .access(controller.signal)\n      .then(() => setRuntimeTraceAllowed(true))\n      .catch(() => {\n        if (!controller.signal.aborted) setRuntimeTraceAllowed(false);\n      });\n    return () => controller.abort();\n  }, [user.id, user.role, publicDemo]);\n'''
          if marker not in text:
              raise SystemExit('provider access effect marker not found')
          text = text.replace(marker, addition, 1)

          nav_marker = '''            {providerTraceAllowed && (\n              <button\n                type="button"\n                className={section === "provider" ? "is-active" : ""}\n                onClick={() => setSection("provider")}\n              >\n                Provider Trace\n              </button>\n            )}\n'''
          nav_new = nav_marker + '''            {runtimeTraceAllowed && (\n              <button\n                type="button"\n                className={section === "runtime" ? "is-active" : ""}\n                onClick={() => setSection("runtime")}\n              >\n                Runtime Trace\n              </button>\n            )}\n'''
          if nav_marker not in text:
              raise SystemExit('provider tab marker not found')
          text = text.replace(nav_marker, nav_new, 1)

          card_marker = '''              {providerTraceAllowed && (\n                <button type="button" onClick={() => setSection("tooltest")}>\n                  <span className="toolbox-sticker sticker-lavender">TOOL</span>\n                  <strong>{zh ? "Tool Calling 手动测试" : "Tool Calling manual test"}</strong>\n                  <small>\n                    {zh\n                      ? "Super Admin 直接执行真实 Runtime Tool，确认 Tool 本身能否正常 completed / rejected / failed。"\n                      : "Super Admin can execute a real Runtime Tool directly to verify completed / rejected / failed behavior."}\n                  </small>\n                </button>\n              )}\n'''
          card_new = card_marker + '''              {runtimeTraceAllowed && (\n                <button type="button" onClick={() => setSection("runtime")}>\n                  <span className="toolbox-sticker sticker-mint">TRACE</span>\n                  <strong>{zh ? "Runtime Trace Explorer" : "Runtime Trace Explorer"}</strong>\n                  <small>\n                    {zh\n                      ? "查看 LangGraph 节点、operation_id、恢复与 durable execution 状态。"\n                      : "Inspect LangGraph nodes, operation IDs, recovery, and durable execution state."}\n                  </small>\n                </button>\n              )}\n'''
          if card_marker not in text:
              raise SystemExit('tooltest card marker not found')
          text = text.replace(card_marker, card_new, 1)

          render_marker = '''          {section === "provider" && providerTraceAllowed && !publicDemo && (\n            <ProviderTraceViewer embedded onClose={() => setSection("actions")} />\n          )}\n'''
          render_new = render_marker + '''\n          {section === "runtime" && runtimeTraceAllowed && !publicDemo && (\n            <RuntimeTraceViewer onClose={() => setSection("actions")} />\n          )}\n'''
          if render_marker not in text:
              raise SystemExit('provider render marker not found')
          text = text.replace(render_marker, render_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate Web
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove one-shot workflow
        run: git rm .github/workflows/phase5-ui-apply.yml
      - name: Commit Runtime Trace UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose Runtime Trace Explorer in Toolbox"
          git push origin HEAD:agent/langgraph-phase-5-durable-runtime
