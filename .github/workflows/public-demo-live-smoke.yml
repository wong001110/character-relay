name: Public Demo Live Smoke

on:
  workflow_dispatch:
    inputs:
      live_url:
        description: Deployed Echo Masque URL
        required: true
        default: https://echo-masque-production.up.railway.app
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: public-demo-live-smoke
  cancel-in-progress: false

jobs:
  public-demo-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_URL: ${{ inputs.live_url || 'https://echo-masque-production.up.railway.app' }}
      ADMIN_EMAIL: ${{ secrets.ECHO_MASQUE_LIVE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ECHO_MASQUE_LIVE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require Admin comparison credentials
        run: |
          test -n "$ADMIN_EMAIL" || (echo "Missing ECHO_MASQUE_LIVE_ADMIN_EMAIL" && exit 1)
          test -n "$ADMIN_PASSWORD" || (echo "Missing ECHO_MASQUE_LIVE_ADMIN_PASSWORD" && exit 1)
      - name: Install Echo Masque
        run: python -m pip install -e .
      - name: Wait for the public Demo deployment
        run: |
          python - <<'PY'
          import time

          import httpx

          base = "${{ env.LIVE_URL }}".rstrip("/")
          for attempt in range(90):
              try:
                  response = httpx.post(
                      f"{base}/api/auth/login",
                      json={
                          "email": "demo@echo-masque.app",
                          "password": "EchoMasqueDemo2026!",
                      },
                      timeout=15,
                  )
                  if response.status_code == 200:
                      print("Public Demo deployment is ready.")
                      break
              except httpx.HTTPError:
                  pass
              print(f"Waiting for public Demo deployment ({attempt + 1}/90)...")
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for the public Demo deployment.")
          PY
      - name: Compare Demo with the Bootstrap Admin workspace
        run: |
          python scripts/live_public_demo_smoke.py "$LIVE_URL" \
            --admin-email "$ADMIN_EMAIL" \
            --admin-password "$ADMIN_PASSWORD" \
            > public-demo-live-smoke.json
      - name: Publish redacted result
        run: cat public-demo-live-smoke.json
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-live-smoke
          path: public-demo-live-smoke.json
          if-no-files-found: error
      - name: Record successful acceptance
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('public-demo-live-smoke.json', 'utf8'));
            const cards = result.character_names.map((name) => `- ${name}`).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 56,
              body: `✅ Public Demo live acceptance passed for commit \`${context.sha}\`.\n\n**Production resources**\n${cards}\n- Scenarios: ${result.scenario_count}\n- Test Packs: ${result.test_pack_count}\n- Credential-ready Cards: ${result.credential_ready_cards.length}\n- Read-only boundary: enforced\n- Daily Run limit: ${result.daily_run_limit}\n- Secrets included in evidence: no\n\nEvidence artifact: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Record failed acceptance
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 56,
              body: `❌ Public Demo live acceptance failed for commit \`${context.sha}\`. No credential or Provider secret is included in this notice. Inspect run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
