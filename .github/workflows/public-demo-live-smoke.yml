name: Public Demo Live Smoke

on:
  workflow_dispatch:
    inputs:
      live_url:
        description: Deployed Echo Masque URL
        required: true
        default: https://echo-masque-production.up.railway.app
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-demo-live-smoke
  cancel-in-progress: false

jobs:
  public-demo-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_URL: ${{ inputs.live_url || 'https://echo-masque-production.up.railway.app' }}
      ADMIN_EMAIL: ${{ secrets.ECHO_MASQUE_LIVE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ECHO_MASQUE_LIVE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require Admin comparison credentials
        run: |
          test -n "$ADMIN_EMAIL" || (echo "Missing ECHO_MASQUE_LIVE_ADMIN_EMAIL" && exit 1)
          test -n "$ADMIN_PASSWORD" || (echo "Missing ECHO_MASQUE_LIVE_ADMIN_PASSWORD" && exit 1)
      - name: Install Echo Masque
        run: python -m pip install -e .
      - name: Wait for the public Demo deployment
        run: |
          python - <<'PY'
          import time

          import httpx

          base = "${{ env.LIVE_URL }}".rstrip("/")
          for attempt in range(90):
              try:
                  response = httpx.post(
                      f"{base}/api/auth/login",
                      json={
                          "email": "demo@echo-masque.app",
                          "password": "EchoMasqueDemo2026!",
                      },
                      timeout=15,
                  )
                  if response.status_code == 200:
                      print("Public Demo deployment is ready.")
                      break
              except httpx.HTTPError:
                  pass
              print(f"Waiting for public Demo deployment ({attempt + 1}/90)...")
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for the public Demo deployment.")
          PY
      - name: Compare Demo with the Bootstrap Admin workspace
        run: |
          python scripts/live_public_demo_smoke.py "$LIVE_URL" \
            --admin-email "$ADMIN_EMAIL" \
            --admin-password "$ADMIN_PASSWORD" \
            > public-demo-live-smoke.json
      - name: Publish redacted result
        run: cat public-demo-live-smoke.json
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-live-smoke
          path: public-demo-live-smoke.json
          if-no-files-found: error
