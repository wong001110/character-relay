name: Public Demo Status Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  verify-public-demo-contract:
    name: Verify Public Demo contract from this revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify source-level readiness and read-only boundaries
        run: >-
          python -m pytest
          tests/test_public_demo.py
          tests/test_public_demo_status_credentials.py
          tests/test_public_demo_quota.py

  verify-deployed-public-demo:
    name: Verify current shared deployment health
    needs: verify-public-demo-contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the current deployed readiness endpoint
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "https://echo-masque-production.up.railway.app/api/public-demo/status"
          latest = None
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      latest = json.load(response)
                  names = latest.get("character_names", [])
                  components_ready = (
                      latest.get("enabled") is True
                      and len(names) >= 2
                      and latest.get("credential_ready_count") == len(names)
                      and latest.get("scenario_count", 0) >= 1
                      and latest.get("test_pack_count", 0) >= 1
                  )
                  if components_ready and latest.get("ready") is True:
                      break
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  latest = None
              print(f"Waiting for current shared Public Demo readiness ({attempt + 1}/60)...")
              time.sleep(5)
          else:
              raise SystemExit(f"Current shared Public Demo did not become ready. Last response: {latest}")

          if latest.get("role") != "user":
              raise SystemExit("Public Demo role is not user.")
          if latest.get("read_only") is not True:
              raise SystemExit("Public Demo read-only boundary is not reported.")
          if latest.get("secrets_included") is not False:
              raise SystemExit("Public Demo status must remain secret-free.")

          with open("public-demo-status.json", "w", encoding="utf-8") as handle:
              json.dump(latest, handle, ensure_ascii=False, indent=2)
          PY
      - name: Publish secret-free status
        run: cat public-demo-status.json
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-status
          path: public-demo-status.json
          if-no-files-found: error
      - name: Write readiness summary
        if: always()
        run: |
          {
            echo "## Public Demo readiness"
            echo ""
            echo "- Current shared deployment health: \`${{ job.status }}\`"
            echo "- Trigger revision: \`${{ github.sha }}\`"
            echo "- This remote status proves the current shared deployment only; it does not attest which revision is deployed."
            echo "- Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -f public-demo-status.json ]; then
              echo ""
              echo "### Secret-free status"
              echo '```json'
              cat public-demo-status.json
              echo ""
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record successful deployment-health check
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('public-demo-status.json', 'utf8'));
            const cards = result.character_names.map((name) => `- ${name}`).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 57,
              body: `✅ Current shared Public Demo health passed after trigger \`${context.sha}\`. This status does not attest the deployed revision.\n\n${cards}\n- Scenarios: ${result.scenario_count}\n- Test Packs: ${result.test_pack_count}\n- Credential-ready Cards: ${result.credential_ready_count}\n- Role: ${result.role}\n- Read-only: ${result.read_only}\n- Daily Run limit: ${result.daily_run_limit}\n- Secrets included: no\n\nEvidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Record failed deployment-health check
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 57,
              body: `❌ Current shared Public Demo health check failed after trigger \`${context.sha}\`. This does not identify the deployed revision. No credential or Provider secret is included. Inspect: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
