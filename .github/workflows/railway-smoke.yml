name: Railway Smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public Echo Masque URL
        required: false
        default: https://echo-masque-production.up.railway.app
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: railway-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEFAULT_RAILWAY_URL: https://echo-masque-production.up.railway.app

jobs:
  network-diagnostic:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Resolve DNS and probe public endpoints
        run: |
          set -x
          getent ahosts echo-masque-production.up.railway.app || true
          curl --fail --show-error --silent --dump-header /tmp/health.headers --output /tmp/health.body "$DEFAULT_RAILWAY_URL/health"
          cat /tmp/health.headers
          cat /tmp/health.body
          curl --fail --show-error --silent --dump-header /tmp/root.headers --output /tmp/root.body "$DEFAULT_RAILWAY_URL/"
          cat /tmp/root.headers
          head -c 400 /tmp/root.body
          echo
          curl --fail --show-error --silent "$DEFAULT_RAILWAY_URL/api/targets"
          echo
      - name: Create and inspect a Stable Benchmark Trial
        run: |
          started=$(curl --fail --show-error --silent \
            -H "Content-Type: application/json" \
            -H "X-Echo-User: railway-diagnostic" \
            -X POST \
            -d '{"target_id":"demo-stable","suite":["identity_integrity"],"mode":"fast","tester_mode":"benchmark"}' \
            "$DEFAULT_RAILWAY_URL/api/trials")
          echo "$started"
          run_id=$(echo "$started" | jq -r '.id')
          test -n "$run_id" && test "$run_id" != "null"
          for attempt in $(seq 1 10); do
            snapshot=$(curl --fail --show-error --silent "$DEFAULT_RAILWAY_URL/api/trials/$run_id/snapshot")
            echo "$snapshot"
            status=$(echo "$snapshot" | jq -r '.run.status')
            if [ "$status" != "pending" ] && [ "$status" != "running" ]; then
              test "$status" = "completed"
              exit 0
            fi
            sleep 1
          done
          exit 1

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve Railway URL
        id: target
        env:
          INPUT_URL: ${{ inputs.url }}
          VARIABLE_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
        run: |
          target="$INPUT_URL"
          if [ -z "$target" ]; then target="$VARIABLE_URL"; fi
          if [ -z "$target" ]; then target="$DEFAULT_RAILWAY_URL"; fi
          echo "Testing $target"
          echo "url=$target" >> "$GITHUB_OUTPUT"
      - name: Wait for deployment and run smoke test
        env:
          RAILWAY_PUBLIC_URL: ${{ steps.target.outputs.url }}
        run: |
          for attempt in $(seq 1 20); do
            echo "Railway smoke attempt $attempt/20"
            if python scripts/railway_smoke.py "$RAILWAY_PUBLIC_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then
              sleep 30
            fi
          done
          echo "Railway smoke test did not pass after 20 attempts."
          exit 1
