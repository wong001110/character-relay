name: Restore supplied PNG branding

on:
  push:
    branches: [agent/restore-png-logo]

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-png-logo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"

      - name: Restore supplied PNG assets
        run: |
          printf '%s  %s\n' \
            'c139840a77d2da23a9bb885c86b81a98bb5f5f2d2846dc8516e7f4112de73ae4' '.tmp-brand/favicon_00.b64' \
            'd708be98a5976cbec3f4314cc64783d440a427b780ba46efcdcf1e7ff45ccb6f' '.tmp-brand/mark_00.b64' \
            '93201a794bf76094aad42452a2b1d856a327c167ecaaaaed3a76133bd7d9da6e' '.tmp-brand/mark_01.b64' \
            '77c3a87bf3f2bbaa9b9a97a610f15e9e4d39c2826f0772d298250806c3a1a1f4' '.tmp-brand/wordmark_00.b64' \
            '38ed9521994d33a4ea87039e31ab7838739ff6023c0b9f9763cfdb3df43fd074' '.tmp-brand/wordmark_01_00.b64' \
            '9e3a276170b0867caf899a21207e17a5dff30f35e1d2c85398f5b7e710a7263a' '.tmp-brand/wordmark_01_01.b64' \
            '4c3145c98d676de5a82dd2c7a9315cf94f2e44e91b34ab1e9c7d0f4bcffda903' '.tmp-brand/wordmark_01_02.b64' \
            '2c976a07693104ef932801fe2e5377e7e47bd130890c9c7378a36fa65e73fd89' '.tmp-brand/wordmark_01_03.b64' \
            '28a741f538840f59b22a31a8fe60b43b0c9974f5bec12c7329a26a8d60466d26' '.tmp-brand/wordmark_01_04.b64' \
            '4dbac30ac412113c33031278fd9f1d4f5b3c04387314cc8994d18577f0ba25c7' '.tmp-brand/wordmark_01_05.b64' \
            '505d46bed9a22b265dc6ed2d7d1e80a8d912c5378e3b5f25ec0b23b2632e754d' '.tmp-brand/wordmark_01_06.b64' \
            '8ef7e9d673722f7ac6c73ef18bf5981e0fe4c70490f88cf91c5faa7375a96169' '.tmp-brand/wordmark_02.b64' | sha256sum -c -
          python - <<'PY'
          import base64
          from pathlib import Path

          root = Path(".tmp-brand")
          output = Path("web/public/assets/brand")
          output.mkdir(parents=True, exist_ok=True)
          assets = {
              "wordmark": [
                  root / "wordmark_00.b64",
                  *sorted(root.glob("wordmark_01_??.b64")),
                  root / "wordmark_02.b64",
              ],
              "mark": [root / "mark_00.b64", root / "mark_01.b64"],
              "favicon": [root / "favicon_00.b64"],
          }
          for name, chunks in assets.items():
              staged = "".join(path.read_text(encoding="utf-8") for path in chunks)
              decoded = base64.b64decode(staged, validate=True)
              (output / f"character-relay-{name}.png").write_bytes(decoded)
          PY
          printf '%s  %s\n' \
            '1b2a5c558af261e9da3682e085998b9cb5920b68ef44d33dc6e553ec8fc8b055' 'web/public/assets/brand/character-relay-wordmark.png' \
            'e9a1fef009fef2c854a5a4bafca63077dfcbdbf9333e07c06669da0e7f0df588' 'web/public/assets/brand/character-relay-mark.png' \
            '4a114a5e4d4542bfc7a1347ea5041566cbebf470be7e24c4047dd8463421dc3c' 'web/public/assets/brand/character-relay-favicon.png' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "web/src/CharacterShelf.tsx": (
                  "/assets/brand/character-relay-wordmark.svg",
                  "/assets/brand/character-relay-wordmark.png",
              ),
              "web/src/PortalToolbox.tsx": (
                  "/assets/brand/character-relay-mark.svg",
                  "/assets/brand/character-relay-mark.png",
              ),
              "web/index.html": (
                  '<link rel="icon" type="image/svg+xml" href="/assets/brand/character-relay-mark.svg" />',
                  '<link rel="icon" type="image/png" sizes="48x48" href="/assets/brand/character-relay-favicon.png" />',
              ),
              "web/src/notebook-ui.css": (
                  "width: clamp(210px, 25vw, 380px);",
                  "width: clamp(210px, 25vw, 300px);",
              ),
          }
          for path, (old, new) in replacements.items():
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing branding anchor in {path}: {old}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f web/public/assets/brand/character-relay-mark.svg
          rm -f web/public/assets/brand/character-relay-wordmark.svg

      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Remove temporary and generated files
        run: |
          rm -rf .tmp-brand
          rm -f .github/workflows/restore-png-branding.yml
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -rf web/dist

      - name: Commit validated PNG branding
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore supplied PNG branding"
          git push origin HEAD:agent/restore-png-logo
