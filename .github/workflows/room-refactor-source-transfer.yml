name: Temporary public-source checkpoint transfer
on:
  push:
    branches: [chore/room-refactor-verification-20261001]
    paths: [.github/workflows/room-refactor-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7d4731519047fccda25078dfd44354a8ca79127
          fetch-depth: 1
      - name: Verify source-only transfer and exact Git identities
        env:
          # Public repository source only. No continuity DB, credentials or user captures.
          SOURCE_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-d804-820b-9670-96e8b5133466/raw?se=2026-10-01T11%3A24%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=6b94a988-34ba-5614-8f77-4b7321587b59&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T09%3A43%3A53Z&ske=2026-10-02T09%3A43%3A53Z&sks=b&skv=2026-02-06&sig=JbGj/kgAhOxMPIuF1sdXocQKE1gvUzdJegdm19Qq/zw%3D'
        run: |
          echo "::add-mask::$SOURCE_URL"
          curl --fail --silent --show-error --max-time 60 "$SOURCE_URL" -o /tmp/source.zip
          echo 'aa582b49a4789022bce729282c91f480fc9341bc0f8183a4c0964df378da3a75  /tmp/source.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/source.zip') as z:
              assert sorted(z.namelist()) == ['commit.txt', 'source.patch']
              for name in z.namelist():
                  Path('/tmp/' + name).write_bytes(z.read(name))
          PY
          git apply --check --index /tmp/source.patch
          git apply --index /tmp/source.patch
          test "$(git write-tree)" = c9db1a97787f4ba499766c82dc8ea74838301618
          sha=$(git hash-object -t commit -w --stdin < /tmp/commit.txt)
          test "$sha" = d9943a3ec5b46b66fe992b2abe08a43dbc08a3a8
          test "$(git show -s --format=%P "$sha")" = e7d4731519047fccda25078dfd44354a8ca79127
          git push origin "$sha:refs/heads/chore/room-refactor-source-r4"
          echo "Verified source commit: $sha"
