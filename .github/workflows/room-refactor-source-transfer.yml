name: Temporary public-source checkpoint transfer
on:
  push:
    branches: [chore/room-refactor-verification-20261001]
    paths: [.github/workflows/room-refactor-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c7ce413f4c6930fbb8ee837978f0482355849dc
          fetch-depth: 1
      - name: Verify source-only transfer and exact Git identities
        env:
          # Public repository source only. No continuity DB, credentials or user captures.
          SOURCE_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-58dc-81f8-b9cb-999f21a4cbaa/raw?se=2026-10-01T10%3A24%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=bd8efc96-3a96-57ae-abe0-fd1de4272907&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T09%3A49%3A29Z&ske=2026-10-02T09%3A49%3A29Z&sks=b&skv=2026-02-06&sig=1NLIPjgH%2BqXg%2B1pBF7nReCaACN44dMlvar5LY558F8c%3D'
        run: |
          echo "::add-mask::$SOURCE_URL"
          curl --fail --silent --show-error --max-time 60 "$SOURCE_URL" -o /tmp/source.zip
          echo 'dd12efa569cfe2a6247c8a1fc4682be441c95a18c650b30c6d0dde8614872ccc  /tmp/source.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/source.zip') as z:
              assert sorted(z.namelist()) == ['commit.txt', 'source.patch']
              for name in z.namelist():
                  Path('/tmp/' + name).write_bytes(z.read(name))
          PY
          git apply --check --index /tmp/source.patch
          git apply --index /tmp/source.patch
          test "$(git write-tree)" = 8961d02055fe67364b7b0521fbd9ba437d546d35
          sha=$(git hash-object -t commit -w --stdin < /tmp/commit.txt)
          test "$sha" = e7d4731519047fccda25078dfd44354a8ca79127
          test "$(git show -s --format=%P "$sha")" = 2c7ce413f4c6930fbb8ee837978f0482355849dc
          # Only the connector performs the separately checked PR-head fast-forward.
          git push origin "$sha:refs/heads/chore/room-refactor-source-r3"
          echo "Verified source commit: $sha"
