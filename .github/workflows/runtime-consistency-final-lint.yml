name: Runtime consistency final lint cleanup

on:
  push:
    branches:
      - fix/runtime-consistency-before-phase-3
    paths:
      - .github/workflows/runtime-consistency-final-lint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-consistency-before-phase-3
          fetch-depth: 0
      - name: Split final long string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/echo_masque/server_time_tools.py')
          text = path.read_text(encoding='utf-8')
          old = '                            "voice. Do not write an internal title or instruction, and do not add an "\n'
          new = ('                            "voice. Do not write an internal title or instruction, "\n'
                 '                            "and do not add an "\n')
          if text.count(old) != 1:
              raise SystemExit(f'expected one long-line match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/runtime-consistency-final-lint.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/echo_masque/server_time_tools.py
          git commit -m "style: split final future-message description"
          git push origin HEAD:fix/runtime-consistency-before-phase-3
