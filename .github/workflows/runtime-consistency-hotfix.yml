name: Runtime consistency hotfix

on:
  push:
    branches:
      - fix/runtime-consistency-before-phase-3
    paths:
      - .github/workflows/runtime-consistency-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-consistency-before-phase-3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Put the create action where users are actually managing deployments.
          replace_once(
              'web/src/DeploymentCenter.tsx',
              '''              <span>\n                {deployments.length} / {deploymentTotal}\n              </span>''',
              '''              <span>\n                {deployments.length} / {deploymentTotal}\n              </span>\n              {!demoMode && (\n                <button\n                  className="ink-button"\n                  onClick={openNewDeployment}\n                  disabled={!cards.length || !selectedWorkspaceProfile}\n                >\n                  {zh ? "+ 新部署" : "+ New deployment"}\n                </button>\n              )}''',
          )

          # 2) Make future reminder/notification copy an explicit persona contract.
          replace_once(
              'src/echo_masque/server_time_tools.py',
              '''                if isinstance(properties, dict) and name == "scheduler_remind":\n                    scheduled_schema = properties.get("scheduled_at")''',
              '''                if isinstance(properties, dict) and name == "scheduler_remind":\n                    reminder_schema = properties.get("reminder_text")\n                    if isinstance(reminder_schema, dict):\n                        reminder_schema["description"] = (\n                            "The exact future message this Character will send when the reminder fires. "\n                            "Write it now in the current Character persona and voice. Do not write an "\n                            "internal title or instruction, and do not add an @mention; Runtime handles "\n                            "the target mention separately."\n                        )\n                    scheduled_schema = properties.get("scheduled_at")''',
          )
          replace_once(
              'src/echo_masque/server_time_tools.py',
              '''                    function["description"] = (\n                        "Schedule a future reminder. Use delay_seconds for relative time or "\n                        "scheduled_at for a local/offset ISO-8601 time. Unqualified times use "\n                        f"the Server timezone ({timezone})."\n                    )\n            adjusted.append(ChatToolDefinition.model_validate(payload))''',
              '''                    function["description"] = (\n                        "Schedule a future reminder. Write reminder_text as the exact future "\n                        "Character-facing message in the current persona and voice; Runtime will "\n                        "deliver it deterministically without another model call. Use delay_seconds "\n                        "for relative time or scheduled_at for a local/offset ISO-8601 time. "\n                        f"Unqualified times use the Server timezone ({timezone})."\n                    )\n                if isinstance(properties, dict) and name == "watch_condition":\n                    notification_schema = properties.get("notification_text")\n                    if isinstance(notification_schema, dict):\n                        notification_schema["description"] = (\n                            "The exact future message this Character will send only after the "\n                            "condition triggers. Write it now in the current Character persona and "\n                            "voice. Do not write an internal title or instruction, and do not add an "\n                            "@mention; Runtime handles the target mention separately."\n                        )\n                    function["description"] = (\n                        "Create a bounded future condition watch after an explicit human request. "\n                        "Write notification_text as the exact future Character-facing message in "\n                        "the current persona and voice. Runtime later evaluates the condition and "\n                        "delivers that stored text deterministically only after a persisted trigger."\n                    )\n            adjusted.append(ChatToolDefinition.model_validate(payload))''',
          )

          # 3) Persist Discord message routing for Scheduler / Condition Watch output.
          replace_once(
              'src/echo_masque/scheduled_reminder_service.py',
              '''import asyncio\nfrom contextlib import suppress''',
              '''import asyncio\nimport logging\nfrom contextlib import suppress''',
          )
          replace_once(
              'src/echo_masque/scheduled_reminder_service.py',
              '''_WEBHOOK_SCOPE = "discord_webhook"\n\n\nclass ScheduledReminderDeliveryService:''',
              '''_WEBHOOK_SCOPE = "discord_webhook"\n\nlogger = logging.getLogger(__name__)\n\n\nclass ScheduledReminderDeliveryService:''',
          )
          replace_once(
              'src/echo_masque/scheduled_reminder_service.py',
              '''        if mode == "bot":\n            await self._send_bot_message(\n                channel_id=reminder.thread_id or reminder.channel_id,\n                content=content,\n                allowed_users=allowed_users,\n            )\n            return''',
              '''        if mode == "bot":\n            message_id = await self._send_bot_message(\n                channel_id=reminder.thread_id or reminder.channel_id,\n                content=content,\n                allowed_users=allowed_users,\n            )\n            self._register_message_route(\n                reminder,\n                deployment,\n                message_id=message_id,\n                webhook_id="",\n            )\n            return''',
          )
          replace_once(
              'src/echo_masque/scheduled_reminder_service.py',
              '''        if response.is_error:\n            raise RuntimeError(f"Discord reminder webhook returned HTTP {response.status_code}.")\n\n    async def _send_bot_message(''',
              '''        if response.is_error:\n            raise RuntimeError(f"Discord reminder webhook returned HTTP {response.status_code}.")\n        self._register_message_route(\n            reminder,\n            deployment,\n            message_id=self._message_id(response),\n            webhook_id=binding.webhook_id,\n        )\n\n    async def _send_bot_message(''',
          )
          replace_once(
              'src/echo_masque/scheduled_reminder_service.py',
              '''    ) -> None:\n        if self.discord_bot_token is None:\n            raise RuntimeError("Discord Bot credential is unavailable for reminder delivery.")''',
              '''    ) -> str:\n        if self.discord_bot_token is None:\n            raise RuntimeError("Discord Bot credential is unavailable for reminder delivery.")''',
          )
          replace_once(
              'src/echo_masque/scheduled_reminder_service.py',
              '''        if response.is_error:\n            raise RuntimeError(f"Discord reminder message returned HTTP {response.status_code}.")\n\n    def _client(self) -> httpx.AsyncClient:''',
              '''        if response.is_error:\n            raise RuntimeError(f"Discord reminder message returned HTTP {response.status_code}.")\n        return self._message_id(response)\n\n    @staticmethod\n    def _message_id(response: httpx.Response) -> str:\n        try:\n            payload = response.json()\n        except ValueError as exc:\n            raise RuntimeError("Discord reminder delivery returned invalid JSON.") from exc\n        message_id = payload.get("id") if isinstance(payload, dict) else None\n        if not isinstance(message_id, str) or not message_id.strip():\n            raise RuntimeError("Discord reminder delivery did not return a message ID.")\n        return message_id.strip()\n\n    def _register_message_route(\n        self,\n        reminder: ScheduledReminderRecord,\n        deployment: object,\n        *,\n        message_id: str,\n        webhook_id: str,\n    ) -> None:\n        try:\n            self.identity_repository.register_message_routes(\n                connection_id=deployment.connection_id,\n                deployment_id=deployment.id,\n                workspace_id=deployment.workspace_id,\n                channel_id=reminder.channel_id,\n                thread_id=reminder.thread_id,\n                webhook_id=webhook_id,\n                message_ids=[message_id],\n            )\n        except Exception as exc:\n            # Delivery already happened. Route bookkeeping must never turn a successful\n            # side effect into a retry that could duplicate the reminder.\n            logger.warning(\n                "Unable to persist Discord reminder message route: deployment=%s message=%s error=%s",\n                reminder.deployment_id,\n                message_id,\n                exc,\n            )\n\n    def _client(self) -> httpx.AsyncClient:''',
          )

          # Keep static typing explicit for the deployment object used by route bookkeeping.
          replace_once(
              'src/echo_masque/scheduled_reminder_service.py',
              '''from echo_masque.persistence import DeploymentRepository, DiscordIdentityRepository''',
              '''from echo_masque.persistence import DeploymentRepository, DiscordIdentityRepository\nfrom echo_masque.persistence.deployment_models import CharacterDeploymentRecord''',
          )
          replace_once(
              'src/echo_masque/scheduled_reminder_service.py',
              '''        deployment: object,\n        *,''',
              '''        deployment: CharacterDeploymentRecord,\n        *,''',
          )

          # 4) Regression: a delivered reminder is reply-routable to the originating deployment.
          replace_once(
              'tests/test_scheduled_reminders.py',
              '''    assert by_id[record.id].status == "completed"\n    assert by_id[record.id].delivered_at is not None''',
              '''    assert by_id[record.id].status == "completed"\n    assert by_id[record.id].delivered_at is not None\n    route = identities.resolve_message_route(\n        connection_id="connection-1",\n        message_id="message-1",\n    )\n    assert route is not None\n    assert route.deployment_id == "deployment-1"\n    assert route.character_card_id == "character-1"\n    assert route.channel_id == "channel-1"''',
          )

          # 5) Regression: runtime Tool schemas tell the model to author persona-ready future copy.
          Path('tests/test_reminder_persona_contract.py').write_text('''from echo_masque.persistence import (\n    ConditionWatchRepository,\n    Database,\n    ScheduledReminderRepository,\n)\nfrom echo_masque.server_time_tools import ServerAwareToolRegistry\n\n\ndef test_future_notification_tool_schemas_require_character_voice() -> None:\n    database = Database("sqlite:///:memory:")\n    database.initialize()\n    registry = ServerAwareToolRegistry(\n        reminder_repository=ScheduledReminderRepository(database),\n        condition_watch_repository=ConditionWatchRepository(database),\n        condition_watch_enabled=True,\n    )\n    definitions = {\n        item.function.name: item\n        for item in registry.provider_tools(("scheduler.remind", "watch.condition"))\n    }\n\n    reminder = definitions["scheduler_remind"].function\n    reminder_properties = reminder.parameters["properties"]\n    reminder_text = reminder_properties["reminder_text"]\n    assert "exact future message" in reminder_text["description"]\n    assert "persona and voice" in reminder_text["description"]\n    assert "without another model call" in reminder.description\n\n    watch = definitions["watch_condition"].function\n    watch_properties = watch.parameters["properties"]\n    notification_text = watch_properties["notification_text"]\n    assert "exact future message" in notification_text["description"]\n    assert "persona and voice" in notification_text["description"]\n    assert "stored text deterministically" in watch.description\n''', encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/runtime-consistency-hotfix.yml
      - name: Commit generated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/DeploymentCenter.tsx src/echo_masque/server_time_tools.py src/echo_masque/scheduled_reminder_service.py tests/test_scheduled_reminders.py tests/test_reminder_persona_contract.py
          git commit -m "fix: unify reminder persona and reply routing"
          git push origin HEAD:fix/runtime-consistency-before-phase-3
