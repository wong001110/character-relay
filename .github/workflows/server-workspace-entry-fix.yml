name: Server Workspace entry-state fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  entry-fix:
    if: github.event.pull_request.head.ref == 'feature/server-scoped-deployment-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-scoped-deployment-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply and validate entry-state fix
        run: |
          if [ ! -f scripts/apply_server_workspace_entry_fix.py ]; then
            echo 'No pending entry-state fix.'
            exit 0
          fi
          python scripts/apply_server_workspace_entry_fix.py
          rm -f scripts/apply_server_workspace_entry_fix.py
          rm -f .github/workflows/server-workspace-entry-fix.yml
          cd web
          npm install --no-package-lock
          npm run typecheck
          npm test
          npm run build
          rm -f tsconfig.tsbuildinfo
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve direct Deployment entry across Server resolution'
          git push origin HEAD:feature/server-scoped-deployment-workspace
