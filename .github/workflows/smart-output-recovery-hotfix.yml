name: Smart Output recovery hotfix

on:
  push:
    branches:
      - fix/smart-output-recovery
    paths:
      - .github/workflows/smart-output-recovery-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-output-recovery
          fetch-depth: 0
      - name: Apply conservative Smart Output recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/echo_masque/smart_output.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def parse_and_resolve(\n        self,\n        raw: str,\n        candidates: list[ExpressionCandidate],\n    ) -> tuple[DiscordSmartOutputView | None, str]:\n        marker = _OUTPUT_PATTERN.fullmatch(raw)\n        if marker is None:\n            return None, "missing_smart_output_control"\n        try:\n            proposal = SmartOutputProposal.model_validate(json.loads(marker.group(1)))\n        except (json.JSONDecodeError, ValueError):\n            return None, "invalid_smart_output_control"\n        return self.resolve(proposal, candidates)\n'''
          new = '''    def parse_and_resolve(\n        self,\n        raw: str,\n        candidates: list[ExpressionCandidate],\n    ) -> tuple[DiscordSmartOutputView | None, str]:\n        marker = _OUTPUT_PATTERN.fullmatch(raw)\n        value: object\n        if marker is not None:\n            try:\n                value = json.loads(marker.group(1))\n            except json.JSONDecodeError:\n                return None, "invalid_smart_output_control"\n        else:\n            # Some providers occasionally prepend harmless prose or omit one final\n            # closing bracket after an otherwise valid CR_OUTPUT. Recover only the\n            # final control, require a complete JSON object, and reject any trailing\n            # prose. Runtime schema/reference validation still runs below.\n            token = "[[CR_OUTPUT"\n            start = raw.rfind(token)\n            if start < 0:\n                return None, "missing_smart_output_control"\n            candidate = raw[start + len(token) :].lstrip()\n            if not candidate.startswith("{"):\n                return None, "invalid_smart_output_control"\n            try:\n                value, end = json.JSONDecoder().raw_decode(candidate)\n            except json.JSONDecodeError:\n                return None, "invalid_smart_output_control"\n            if candidate[end:].strip() not in {"]", "]]"}:\n                return None, "missing_smart_output_control"\n        try:\n            proposal = SmartOutputProposal.model_validate(value)\n        except ValueError:\n            return None, "invalid_smart_output_control"\n        return self.resolve(proposal, candidates)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'parse_and_resolve block match count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_smart_output.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = r'''


def test_terminal_control_recovers_provider_prose_and_one_missing_bracket() -> None:
    context = SmartOutputContext.from_payload(payload(), character_name="Ann")
    raw = (
        "I found some useful results. Let me share a concise summary.\n\n"
        '[[CR_OUTPUT {"action":"message","reply_to":"trigger","content":'
        '[{"text":"好，我搜了一下，最近 AI 领域有几个值得注意的方向。"}]}]'
    )

    output, reason = context.parse_and_resolve(raw, [])

    assert reason == "ok"
    assert output is not None
    assert output.action == "message"
    assert output.reply_to_message_id == "message-trigger"
    assert output.content == [
        SmartTextPart(text="好，我搜了一下，最近 AI 领域有几个值得注意的方向。")
    ]


def test_terminal_control_recovery_rejects_trailing_prose() -> None:
    context = SmartOutputContext.from_payload(payload(), character_name="Ann")
    raw = (
        '[[CR_OUTPUT {"action":"message","content":[{"text":"hello"}]}]] '
        "extra text"
    )

    output, reason = context.parse_and_resolve(raw, [])

    assert output is None
    assert reason == "missing_smart_output_control"
'''
          if 'test_terminal_control_recovers_provider_prose_and_one_missing_bracket' in test_text:
              raise SystemExit('recovery tests already present')
          tests.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/smart-output-recovery-hotfix.yml
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/echo_masque/smart_output.py tests/test_smart_output.py
          git commit -m "fix: recover terminal smart output controls"
          git push origin HEAD:fix/smart-output-recovery
