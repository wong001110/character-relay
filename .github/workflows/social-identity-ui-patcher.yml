name: Social Identity UI Patcher

on:
  push:
    branches:
      - fix/social-identity-presentation
    paths:
      - .github/workflows/social-identity-ui-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-identity-presentation
          fetch-depth: 0
      - name: Patch Social Graph UI
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('web/src/conversationIntelligenceApi.ts')
          text = api.read_text()
          old = '''export interface SocialNeighbor {\n  subject_key: string;\n  subject_type: "actor" | "character";\n  label: string;\n  character_card_id: string;\n  value: number;\n  confidence: number;\n  evidence_count: number;\n  last_evidence_at: string;\n  trend: string;\n}\n\nexport interface SocialEgoGraph {\n  character_card_id: string;\n  character_display_name: string;\n  connection_id: string;\n  guild_id: string;\n  items: SocialNeighbor[];\n}'''
          new = '''export interface SocialNeighbor {\n  subject_key: string;\n  subject_type: "actor" | "character";\n  label: string;\n  avatar_url: string;\n  discord_user_id: string;\n  is_bot: boolean;\n  character_card_id: string;\n  value: number;\n  confidence: number;\n  evidence_count: number;\n  last_evidence_at: string;\n  trend: string;\n}\n\nexport interface SocialEgoGraph {\n  character_card_id: string;\n  character_display_name: string;\n  character_avatar_url: string;\n  connection_id: string;\n  guild_id: string;\n  items: SocialNeighbor[];\n}'''
          if old not in text:
              raise SystemExit('conversationIntelligenceApi social interfaces anchor missing')
          api.write_text(text.replace(old, new, 1))

          component = Path('web/src/ConversationIntelligenceInspector.tsx')
          text = component.read_text()
          start = text.index('function SocialGraphCanvas({ graph }: { graph: SocialEgoGraph }) {')
          end = text.index('\n\nexport function ConversationIntelligenceInspector', start)
          new_canvas = r'''function SocialGraphCanvas({ graph }: { graph: SocialEgoGraph }) {
  const nodes = graph.items.slice(0, 8);
  const centerX = 180;
  const centerY = 142;
  const radius = 104;
  const positions = nodes.map((item, index) => {
    const angle = -Math.PI / 2 + (Math.PI * 2 * index) / Math.max(1, nodes.length);
    return { item, index, x: centerX + Math.cos(angle) * radius, y: centerY + Math.sin(angle) * radius };
  });
  return (
    <svg className="ci-social-svg" viewBox="0 0 360 320" role="img" aria-label="Character social ego graph">
      <defs>
        <clipPath id="ci-social-center-avatar"><circle cx={centerX} cy={centerY} r="37" /></clipPath>
        {positions.map(({ item, index, x, y }) => (
          <clipPath key={`clip-${item.subject_key}`} id={`ci-social-avatar-${index}`}>
            <circle cx={x} cy={y} r={21 + Math.abs(item.value) * 7} />
          </clipPath>
        ))}
      </defs>
      {positions.map(({ item, x, y }) => (
        <line
          key={`edge-${item.subject_key}`}
          x1={centerX}
          y1={centerY}
          x2={x}
          y2={y}
          strokeWidth={1.5 + Math.abs(item.value) * 5}
          opacity={0.25 + item.confidence * 0.65}
        />
      ))}
      <circle className="ci-social-center" cx={centerX} cy={centerY} r="38" />
      {graph.character_avatar_url ? (
        <image
          href={graph.character_avatar_url}
          x={centerX - 37}
          y={centerY - 37}
          width="74"
          height="74"
          preserveAspectRatio="xMidYMid slice"
          clipPath="url(#ci-social-center-avatar)"
        />
      ) : null}
      <text className="ci-social-center-label" x={centerX} y={centerY + 55} textAnchor="middle">
        {graph.character_display_name.slice(0, 18)}
      </text>
      {positions.map(({ item, index, x, y }) => {
        const nodeRadius = 22 + Math.abs(item.value) * 7;
        return (
          <g key={item.subject_key}>
            <circle className="ci-social-node" cx={x} cy={y} r={nodeRadius} />
            {item.avatar_url ? (
              <image
                href={item.avatar_url}
                x={x - nodeRadius + 1}
                y={y - nodeRadius + 1}
                width={(nodeRadius - 1) * 2}
                height={(nodeRadius - 1) * 2}
                preserveAspectRatio="xMidYMid slice"
                clipPath={`url(#ci-social-avatar-${index})`}
              />
            ) : null}
            <text className="ci-social-node-label" x={x} y={y + nodeRadius + 14} textAnchor="middle">
              {item.label.slice(0, 16)}
            </text>
          </g>
        );
      })}
    </svg>
  );
}'''
          component.write_text(text[:start] + new_canvas + text[end:])

          text = component.read_text()
          social_start = text.index('      {tab === "social" && (')
          social_end = text.index('      {tab === "hygiene" && (', social_start)
          new_social = r'''      {tab === "social" && (
        <div className="ci-two-column">
          <InspectorSection eyebrow="EGO GRAPH / SERVER" title={social?.character_display_name ?? selectedCard?.display_name ?? "—"}>
            {social && social.items.length ? <SocialGraphCanvas graph={social} /> : <EmptyState title={zh ? "暂无关系 evidence" : "No relationship evidence yet"} />}
          </InspectorSection>
          <InspectorSection eyebrow="RELATIONSHIP EVIDENCE" title={zh ? "邻接关系" : "Immediate relationships"}>
            <div className="ci-social-list">
              {(social?.items ?? []).map((item) => (
                <PaperCard key={item.subject_key} className="ci-social-row">
                  <div className="ci-social-row__head">
                    <div className="ci-social-identity">
                      {item.avatar_url ? <img src={item.avatar_url} alt="" /> : <span className="ci-social-avatar-fallback">{item.label.slice(0, 1).toUpperCase()}</span>}
                      <div>
                        <strong>{item.label}</strong>
                        {item.discord_user_id && <small className="ci-social-user-id">{item.discord_user_id}</small>}
                      </div>
                    </div>
                    <span>{item.subject_type === "character" ? "CHARACTER" : item.is_bot ? "BOT" : "USER"}</span>
                  </div>
                  <div className="ci-strength-track"><i style={{ width: `${percent(item.value)}%` }} /></div>
                  <small>{formatValue(item.value)} · confidence {item.confidence.toFixed(2)} · {item.evidence_count} evidence · {trendGlyph(item.trend)}</small>
                </PaperCard>
              ))}
            </div>
            <div className="ci-hidden-state-count">{relationshipStates.length} aggregate relationship state(s)</div>
          </InspectorSection>
        </div>
      )}

'''
          component.write_text(text[:social_start] + new_social + text[social_end:])

          css = Path('web/src/conversation-intelligence-control-plane.css')
          text = css.read_text()
          anchor = '''.ci-hidden-state-count {\n  margin-top: var(--cr-space-4);'''
          styles = '''.ci-social-row__head {\n  align-items: center;\n}\n\n.ci-social-identity {\n  display: flex;\n  min-width: 0;\n  align-items: center;\n  gap: var(--cr-space-3);\n}\n\n.ci-social-identity img,\n.ci-social-avatar-fallback {\n  width: 42px;\n  height: 42px;\n  flex: 0 0 42px;\n  border: 1px solid var(--cr-line-strong);\n  border-radius: 50%;\n  object-fit: cover;\n  background: var(--cr-paper-muted);\n}\n\n.ci-social-avatar-fallback {\n  display: grid;\n  place-items: center;\n  font-weight: 700;\n}\n\n.ci-social-identity > div {\n  display: grid;\n  min-width: 0;\n  gap: 2px;\n}\n\n.ci-social-identity strong {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.ci-social-user-id {\n  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n  font-size: 0.7rem;\n}\n\n'''
          if anchor not in text:
              raise SystemExit('CSS social anchor missing')
          css.write_text(text.replace(anchor, styles + anchor, 1))
          PY
      - name: Commit UI patch and remove patcher
        run: |
          rm .github/workflows/social-identity-ui-patcher.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/conversationIntelligenceApi.ts web/src/ConversationIntelligenceInspector.tsx web/src/conversation-intelligence-control-plane.css .github/workflows/social-identity-ui-patcher.yml
          git commit -m "fix: show Social Graph names and avatars"
          git push origin HEAD:fix/social-identity-presentation
