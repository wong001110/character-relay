name: V3 Final Structural Cleanup

on:
  push:
    branches:
      - feat/intelligence-core-v3-hard-cutover

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intelligence-core-v3-hard-cutover
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hard-cutover cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected cleanup pattern not found in {path}: {old!r}")
              file.write_text(text.replace(old, new))

          replace(
              "src/echo_masque/api/deployment_discovery_schemas.py",
              "    topic_id: str\n",
              "    conversation_thread_id: str\n",
          )
          replace(
              "src/echo_masque/api/routes/deployment_discovery.py",
              "        topic_id=record.topic_id,\n",
              "        conversation_thread_id=record.conversation_thread_id,\n",
          )

          route = Path("src/echo_masque/api/routes/smart_participation_vnext.py")
          text = route.read_text()
          text = text.replace(
              "from echo_masque.conversation_reply_planner import CharacterSegmentReplyPlanner\n",
              "",
          )
          pattern = re.compile(
              r"\ndef _reply_planner\(request: Request\) -> CharacterSegmentReplyPlanner:.*?"
              r"\ndef _context_resolver\(request: Request\) -> ContextResolverV3:",
              re.S,
          )
          replacement = '''\ndef _participation_planner(request: Request) -> ParticipationPlannerV3:\n    current = getattr(request.app.state, "participation_planner_v3", None)\n    if isinstance(current, ParticipationPlannerV3):\n        return current\n    planner = ParticipationPlannerV3(\n        cast(\n            CharacterParticipationSemanticService,\n            request.app.state.semantic_participation_service,\n        )\n    )\n    request.app.state.participation_planner_v3 = planner\n    return planner\n\n\ndef _context_resolver(request: Request) -> ContextResolverV3:'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not replace legacy reply-planner wrapper in smart participation route")
          route.write_text(text)

          planner = Path("src/echo_masque/participation_planner_v3.py")
          text = planner.read_text()
          text = text.replace("from typing import Literal, cast\n", "from typing import Literal\n")
          old = '''    def __init__(\n        self,\n        semantic: CharacterParticipationSemanticService | object,\n        *,\n        media_contract: MediaEpistemicContract | None = None,\n    ) -> None:\n        # Accept the short-lived pre-cutover wrapper during this commit sequence, but consume only\n        # its semantic scorer. The planner itself owns Segment selection.\n        candidate = getattr(semantic, "semantic", semantic)\n        self.semantic = cast(CharacterParticipationSemanticService, candidate)\n        self.media_contract = media_contract or MediaEpistemicContract()\n'''
          new = '''    def __init__(\n        self,\n        semantic: CharacterParticipationSemanticService,\n        *,\n        media_contract: MediaEpistemicContract | None = None,\n    ) -> None:\n        self.semantic = semantic\n        self.media_contract = media_contract or MediaEpistemicContract()\n'''
          if old not in text:
              raise SystemExit("Could not remove Participation Planner compatibility wrapper")
          planner.write_text(text.replace(old, new))

          for path in (
              "src/echo_masque/participation_final_utility.py",
              "src/echo_masque/conversation_reply_planner.py",
              "tests/test_conversation_reply_planner.py",
          ):
              file = Path(path)
              if file.exists():
                  file.unlink()
          PY
      - name: Format cleanup
        run: |
          python -m pip install ruff
          python -m ruff check --fix-only \
            src/echo_masque/api/deployment_discovery_schemas.py \
            src/echo_masque/api/routes/deployment_discovery.py \
            src/echo_masque/api/routes/smart_participation_vnext.py \
            src/echo_masque/participation_planner_v3.py
          python -m ruff format \
            src/echo_masque/api/deployment_discovery_schemas.py \
            src/echo_masque/api/routes/deployment_discovery.py \
            src/echo_masque/api/routes/smart_participation_vnext.py \
            src/echo_masque/participation_planner_v3.py
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No structural cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Finish v3 participation and discovery cutover"
          git push origin HEAD:feat/intelligence-core-v3-hard-cutover
