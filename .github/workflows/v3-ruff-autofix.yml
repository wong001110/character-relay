name: V3 Ruff Autofix

on:
  push:
    branches:
      - feat/intelligence-core-v3-hard-cutover

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intelligence-core-v3-hard-cutover
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply known remaining Ruff fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected Ruff cleanup pattern not found in {path}: {old!r}")
              file.write_text(text.replace(old, new))

          replace(
              "src/echo_masque/conversation_media.py",
              '            "Runtime truth: this content was actually perceived earlier. Use it only as remembered evidence for the current follow-up; do not invent new media facts.",',
              '            "Runtime truth: this content was actually perceived earlier. "\n'
              '            "Use it only as remembered evidence for the current follow-up; "\n'
              '            "do not invent new media facts.",',
          )
          replace(
              "src/echo_masque/conversation_runtime.py",
              '        if "?" in text or "？" in text or any(',
              '        if "?" in text or "\\uff1f" in text or any(',
          )
          replace(
              "src/echo_masque/conversation_structure_resolver.py",
              '    r"true|same|yes|yep|nah|wow|草+|艹+|6+|？？+|\\?+|！+|!+)$",',
              '    r"true|same|yes|yep|nah|wow|草+|艹+|6+|\\uff1f\\uff1f+|\\?+|\\uff01+|!+)$",',
          )
          replace(
              "src/echo_masque/conversation_structure_resolver.py",
              '            if target in expected and segment_index.get(target) != segment_index.get(item.message_id):',
              '            if (\n'
              '                target in expected\n'
              '                and segment_index.get(target) != segment_index.get(item.message_id)\n'
              '            ):',
          )
          replace(
              "src/echo_masque/conversation_structure_resolver.py",
              '            participants = tuple(dict.fromkeys(item.author_id for item in cluster if item.author_id))',
              '            participants = tuple(\n'
              '                dict.fromkeys(item.author_id for item in cluster if item.author_id)\n'
              '            )',
          )
          replace(
              "src/echo_masque/participation_planner_v3.py",
              '                    "The current turn requires media understanding, but no grounded media content is available. Do not pretend to have seen or inspected it.",',
              '                    "The current turn requires media understanding, but no grounded "\n'
              '                    "media content is available. Do not pretend to have seen or "\n'
              '                    "inspected it.",',
          )
          replace(
              "src/echo_masque/participation_planner_v3.py",
              '                "Media content has been explicitly perceived by the media-understanding path. You may discuss only details present in the supplied grounded media context.",',
              '                "Media content has been explicitly perceived by the media-understanding "\n'
              '                "path. You may discuss only details present in the supplied grounded "\n'
              '                "media context.",',
          )
          replace(
              "src/echo_masque/participation_planner_v3.py",
              '                "Only preview/metadata grounding is available. Mention only supplied metadata; do not infer unseen visual/audio content or extrapolate from prior related knowledge.",',
              '                "Only preview/metadata grounding is available. Mention only supplied "\n'
              '                "metadata; do not infer unseen visual/audio content or extrapolate "\n'
              '                "from prior related knowledge.",',
          )
          replace(
              "src/echo_masque/participation_planner_v3.py",
              '                "Required media content is not grounded. Prefer silence or a clarification request.",',
              '                "Required media content is not grounded. Prefer silence or a "\n'
              '                "clarification request.",',
          )
          PY
      - name: Apply safe Ruff fixes
        run: |
          python -m ruff check --fix-only \
            src/echo_masque/api/routes/intelligence_product_completion.py \
            src/echo_masque/conversation_media.py \
            src/echo_masque/conversation_media_graph.py \
            src/echo_masque/persistence/__init__.py \
            src/echo_masque/persistence/intelligence_v3_migration.py \
            src/echo_masque/smart_participation_outcome.py \
            tests/test_character_recall.py \
            tests/test_character_recall_current_message.py \
            tests/test_conversation_reply_planner.py \
            tests/test_conversation_structure_v3.py \
            tests/test_episodic_sql_rag.py \
            tests/test_social_identity_presentation.py \
            tests/test_tool_continuation_deferred_plan_v4.py \
            tests/test_tool_continuation_deferred_v4.py
      - name: Format touched Ruff files
        run: |
          python -m ruff format \
            src/echo_masque/api/routes/intelligence_product_completion.py \
            src/echo_masque/conversation_media.py \
            src/echo_masque/conversation_media_graph.py \
            src/echo_masque/conversation_runtime.py \
            src/echo_masque/conversation_structure_resolver.py \
            src/echo_masque/discovery_social_association.py \
            src/echo_masque/participation_planner_v3.py \
            src/echo_masque/persistence/__init__.py \
            src/echo_masque/persistence/belief_repository.py \
            src/echo_masque/persistence/episodic_sql_rag_repository.py \
            src/echo_masque/persistence/intelligence_v3_lifecycle_repository.py \
            src/echo_masque/persistence/intelligence_v3_migration.py \
            src/echo_masque/smart_participation_outcome.py \
            tests/test_character_recall.py \
            tests/test_character_recall_current_message.py \
            tests/test_conversation_reply_planner.py \
            tests/test_conversation_structure_v3.py \
            tests/test_discovery_completion.py \
            tests/test_episodic_sql_rag.py \
            tests/test_social_identity_presentation.py \
            tests/test_tool_continuation_deferred_plan_v4.py \
            tests/test_tool_continuation_deferred_v4.py
      - name: Commit safe fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Finish Ruff cleanup for v3 cutover"
          git push origin HEAD:feat/intelligence-core-v3-hard-cutover
