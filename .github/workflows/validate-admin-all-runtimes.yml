name: Validate Admin AI runtimes

on:
  push:
    branches: [agent/admin-all-runtimes-enabled]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-all-runtimes-enabled
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check src tests
          python -m mypy src
          python -m pytest
      - name: Validate Discord Connector
        working-directory: connectors/discord
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary and generated files
        run: |
          rm -f .github/workflows/validate-admin-all-runtimes.yml
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -f connectors/discord/package-lock.json connectors/discord/tsconfig.tsbuildinfo
          rm -rf web/dist connectors/discord/dist
      - name: Commit validated cleanup
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore: finalize Admin AI runtime settings"
          git push origin HEAD:agent/admin-all-runtimes-enabled
