name: Validate inline editing UX

on:
  push:
    branches: [agent/expression-inline-edit-ux]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expression-inline-edit-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.17.0"
      - name: Apply UX integration
        run: python scripts/apply_inline_edit_ux.py
      - name: Check UX invariants
        run: |
          ! grep -q 'window.scrollTo({ top: 0' web/src/DeploymentCenter.tsx
          grep -q 'expression-inline-editor' web/src/ServerStickerDictionary.tsx
          grep -q 'expression-inline-editor' web/src/discordServerProfiles.css
      - name: Validate Portal
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Remove temporary and generated files
        run: |
          rm -f .github/workflows/validate-inline-edit-ux.yml
          rm -f scripts/apply_inline_edit_ux.py
          rm -f web/package-lock.json web/tsconfig.tsbuildinfo
          rm -rf web/dist
      - name: Commit validated UX fix
        run: |
          git config user.name "Wong Juen An"
          git config user.email "62807108+wong001110@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep expression and deployment edits in context"
          git push origin HEAD:agent/expression-inline-edit-ux
