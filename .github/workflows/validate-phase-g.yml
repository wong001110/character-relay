name: Validate Phase G

# Final full-stack validation after Ruff and Mypy cleanup.
on:
  push:
    branches:
      - feat/server-wiki-graph-consolidation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  discord-connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectors/discord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build --tag character-relay-discord-connector:phase-g-ci .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build production image
        run: docker build --tag echo-masque:phase-g-ci .
      - name: Reject production container without persistent volume
        run: |
          set +e
          docker run --name echo-masque-phase-g-unsafe --env PORT=8001 echo-masque:phase-g-ci > unsafe-storage.log 2>&1
          status=$?
          set -e
          cat unsafe-storage.log
          if [ "$status" -eq 0 ]; then
            exit 1
          fi
          grep --fixed-strings "Unsafe production storage" unsafe-storage.log
          docker rm echo-masque-phase-g-unsafe
      - name: Start container
        run: |
          docker volume create echo-masque-phase-g-data
          docker run --detach \
            --name echo-masque-phase-g \
            --publish 8000:8000 \
            --env PORT=8000 \
            --volume echo-masque-phase-g-data:/data \
            echo-masque:phase-g-ci
      - name: Wait for health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health > health-before.json; then
              exit 0
            fi
            sleep 2
          done
          docker logs echo-masque-phase-g
          exit 1
      - name: Run smoke
        run: python scripts/railway_smoke.py http://127.0.0.1:8000 --require-storage
      - name: Cleanup
        if: always()
        run: |
          docker rm --force echo-masque-phase-g || true
          docker rm --force echo-masque-phase-g-unsafe || true
          docker volume rm echo-masque-phase-g-data || true
