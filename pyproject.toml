"src/echo_masque/services/trials.py" = ["B009"]
"src/echo_masque/smart_participation_outcome.py" = ["SIM105"]
"src/echo_masque/suites/catalog.py" = ["RUF001"]
"src/echo_masque/targets/deterministic.py" = ["RUF001"]
"src/echo_masque/template_sharing.py" = ["E501", "RUF001"]
"src/echo_masque/testers/adaptive.py" = ["RUF001"]
"src/echo_masque/tool_external.py" = ["E501", "RUF012"]
"src/echo_masque/tool_runtime.py" = ["E501", "F841", "I001"]
"src/echo_masque/transcripts/importer.py" = ["RUF001"]
"src/echo_masque/trials/runner.py" = ["RUF001"]
"src/echo_masque/utility_gateway_live.py" = ["E501"]
"src/echo_masque/utility_media_pool_observer.py" = ["E501", "SIM114"]
"tests/test_character_recall.py" = ["RUF001"]
"tests/test_character_recall_current_message.py" = ["RUF001"]
"tests/test_conversation_intelligence_control_plane.py" = ["E501", "I001"]
"tests/test_conversation_segmentation.py" = ["E501"]
"tests/test_discovery_completion.py" = ["I001"]
"tests/test_episodic_sql_rag.py" = ["E501"]
"tests/test_interaction_grounding.py" = ["RUF001"]
"tests/test_phase12.py" = ["RUF001"]
"tests/test_phase13.py" = ["E501"]
"tests/test_prompt_budget.py" = ["E501", "I001", "RUF001"]
"tests/test_recall_media_connector_runtime.py" = ["E501"]
"tests/test_tool_runtime_external.py" = ["E501"]
"tests/test_utility_gateway_phase2.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
packages = ["echo_masque"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "echo_masque.api"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "echo_masque.context_layer"
disable_error_code = ["arg-type", "list-item", "comparison-overlap"]

[[tool.mypy.overrides]]
module = "echo_masque.knowledge_route_gate"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["echo_masque.memory_layers", "echo_masque.character_recall", "echo_masque.internal_context"]
disable_error_code = ["assignment", "arg-type", "attr-defined", "redundant-cast"]

[[tool.mypy.overrides]]
module = "echo_masque.persistence.workspace_repository"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "echo_masque.template_sharing"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "echo_masque.tool_external"
disable_error_code = ["assignment", "arg-type", "redundant-cast", "var-annotated"]

[[tool.mypy.overrides]]
module = "echo_masque.tool_runtime"
disable_error_code = ["assignment", "attr-defined"]

# Stabilization vNext has dynamic JSON/SQL boundaries that remain runtime-validated by Pydantic
# and dedicated regression tests. Keep strict MyPy everywhere else and suppress only the concrete
# boundary codes reported by the phase implementation.
[[tool.mypy.overrides]]
module = "echo_masque.provider_failure_classifier"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "echo_masque.utility_media_pool_observer"
disable_error_code = ["assignment", "var-annotated"]

[[tool.mypy.overrides]]
module = "echo_masque.character_relationships"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "echo_masque.persistence.conversation_segment_repository"
disable_error_code = ["attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = "echo_masque.providers.openai_multimodal"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "echo_masque.utility_gateway_live"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "echo_masque.api.routes.character_relationships"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "echo_masque.api.routes.smart_participation_vnext"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
