[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-masque"
version = "0.1.0"
description = "Behavior validation and stress testing for conversational characters and agents."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Wong Juen An" }]
dependencies = [
  "argon2-cffi>=25,<26",
  "cryptography>=45,<51",
  "fastapi>=0.115,<1.0",
  "fastembed>=0.8,<0.9",
  "httpx>=0.28,<1.0",
  "langgraph>=1.2.9,<2.0",
  "pillow>=11,<13",
  "playwright>=1.54,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5,<7",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "yt-dlp[default,curl-cffi]>=2026.6,<2027",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
echo-masque = "echo_masque.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --ignore=tests/test_utility_gateway_phase2.py"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/live_demo_seed.py" = ["E501", "F401", "RUF001"]
"scripts/live_demo_seed_runner.py" = ["E501"]
"src/echo_masque/api/deployment_discovery_schemas.py" = ["RUF022"]
"src/echo_masque/api/routes/__init__.py" = ["E501", "I001"]
"src/echo_masque/api/routes/accounts.py" = ["E501"]
"src/echo_masque/api/routes/character_relationships.py" = ["E501"]
"src/echo_masque/api/routes/conversation_intelligence.py" = ["E501"]
"src/echo_masque/api/routes/deployment_discovery.py" = ["I001"]
"src/echo_masque/api/routes/smart_participation_vnext.py" = ["E501"]
"src/echo_masque/api/routes/workspace.py" = ["E501"]
"src/echo_masque/bilibili_discovery.py" = ["E501"]
"src/echo_masque/browser_runtime.py" = ["E501", "I001", "SIM105"]
"src/echo_masque/character_relationships.py" = ["E501"]
"src/echo_masque/condition_watch_runtime.py" = ["I001"]
"src/echo_masque/context_layer.py" = ["E501", "I001"]
"src/echo_masque/conversation_intelligence_observation.py" = ["E501", "F401"]
"src/echo_masque/conversation_reply_planner.py" = ["E501"]
"src/echo_masque/conversation_segmentation.py" = ["E501", "RUF001"]
"src/echo_masque/discovery_share.py" = ["E501", "I001", "SIM102", "SIM105"]
"src/echo_masque/discovery_social_association.py" = ["I001"]
"src/echo_masque/episodic_sql_rag.py" = ["E501"]
"src/echo_masque/interaction_grounding.py" = ["E501", "RUF001"]
"src/echo_masque/judges/rules.py" = ["RUF001"]
"src/echo_masque/judges/semantic.py" = ["E501", "RUF001"]
"src/echo_masque/layered_conversation_consolidation.py" = ["F401"]
"src/echo_masque/network_safety.py" = ["I001"]
"src/echo_masque/openrouter_image_scout.py" = ["B904"]
"src/echo_masque/persistence/character_learned_state_event_models.py" = ["E501"]
"src/echo_masque/persistence/conversation_segment_models.py" = ["E501"]
"src/echo_masque/persistence/conversation_segment_repository.py" = ["E501"]
"src/echo_masque/persistence/database.py" = ["E501", "I001"]
"src/echo_masque/persistence/discovery_share_repository.py" = ["E501"]
"src/echo_masque/persistence/episodic_sql_rag_models.py" = ["E501"]
"src/echo_masque/persistence/knowledge_repository.py" = ["I001"]
"src/echo_masque/persistence/utility_gateway_models.py" = ["E501"]
"src/echo_masque/persistence/workspace_repository.py" = ["E501"]
"src/echo_masque/prompt_budget.py" = ["E501"]
"src/echo_masque/provider_capabilities.py" = ["RUF012"]
"src/echo_masque/provider_failure_classifier.py" = ["E501", "SIM114", "UP035"]
"src/echo_masque/providers/openai_compatible.py" = ["E501"]
"src/echo_masque/providers/openai_multimodal.py" = ["E501"]
