[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-masque"
version = "0.1.0"
description = "Behavior validation and stress testing for conversational characters and agents."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Wong Juen An" }]
dependencies = [
  "argon2-cffi>=25,<26",
  "cryptography>=45,<51",
  "fastapi>=0.115,<1.0",
  "fastembed>=0.8,<0.9",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
echo-masque = "echo_masque.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/live_demo_seed.py" = ["E501", "F401", "RUF001"]
"scripts/live_demo_seed_runner.py" = ["E501"]
"src/echo_masque/api/routes/workspace.py" = ["E501"]
"src/echo_masque/judges/rules.py" = ["RUF001"]
"src/echo_masque/judges/semantic.py" = ["E501", "RUF001"]
"src/echo_masque/persistence/workspace_repository.py" = ["E501"]
"src/echo_masque/reports/export.py" = ["RUF001", "E501"]
"src/echo_masque/services/trials.py" = ["B009"]
"src/echo_masque/suites/catalog.py" = ["RUF001"]
"src/echo_masque/targets/deterministic.py" = ["RUF001"]
"src/echo_masque/template_sharing.py" = ["E501", "RUF001"]
"src/echo_masque/testers/adaptive.py" = ["RUF001"]
"src/echo_masque/tool_external.py" = ["RUF012"]
"src/echo_masque/transcripts/importer.py" = ["RUF001"]
"src/echo_masque/trials/runner.py" = ["RUF001"]
"tests/test_phase12.py" = ["RUF001"]
"tests/test_phase13.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
packages = ["echo_masque"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "echo_masque.persistence.workspace_repository"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "echo_masque.template_sharing"
disable_error_code = ["arg-type"]
